oids naming a device.\n- **Metrics:** No quantified claims (PD time saved, first-visit completion, field accuracy) are included. Add only measured data from pilots or production.\n- **Language coverage:** Confirm which languages Auto PD supports today beyond Hindi, English and Hinglish.\n- **Integrations:** Confirm which LOS platforms are live for Auto PD write-back.\n- **Feature readiness:** Confirm document extraction, live evidence triggers and bank-statement comparison are live rather than roadmap.\n- **Customer proof:** Add a named lender logo or quote only if approved.\n- **Demo asset:** §4 needs a real recorded or live PD session to be credible.\n"},{"id":"r-Evidence_Intelligence","name":"Evidence_Intelligence.md","text":"# PRD: Darwix AI Evidence Intelligence Page\n\n**Scope:** Content of the Evidence Intelligence page only. Navigation, entry points, layout and visual design are out of scope.\n**Audience:** Heads of Credit, Underwriting, Claims, Operations, Risk and Diligence at banks, NBFCs, insurers, ARCs and investors in loan portfolios. Data and technology leaders are the secondary reader.\n**What the product is:** A cross-source evidence reconciliation layer for BFSI. It reads documents, system records, ledgers, tapes and conversations; builds one source-grounded case; explains what agrees, what differs and *why*; and links every finding to the exact page, row, field or timestamp that proves it.\n**Page goal:** Make the reader believe one thing: *extraction is the easy part. The hard part is knowing which evidence to trust, and Darwix answers that with proof.*\n**Positioning guardrails (state them on the page):**\n- This is not OCR, document summarisation or a decision engine. Extraction is an input. The product begins after it.\n- It prepares and reconciles evidence. Credit, underwriting, claims, legal and acquisition decisions stay with authorised people.\n**Voice:** Match darwix.ai: confident, short, outcome-led. Every section leads with a claim, then proof.\n\n---\n\n## 1. Hero\n\n**Eyebrow:** CROSS-SOURCE EVIDENCE INTELLIGENCE · BUILT FOR BFSI\n\n**Headline:** Every source says something different. Darwix tells you what's true, and shows the proof.\n\n**Subhead:** Darwix Evidence Intelligence reads across documents, systems, ledgers, tapes and conversations to build one source-grounded case. It compares every value across sources, explains why they differ, finds what's missing or outdated, and links each finding to the exact evidence behind it.\n\n**Capability line:** Cross-Source Reconciliation · Difference Classification · Evidence Lineage · Stale & Missing Detection · Clarification Workflow · Case 360 · Audit-Ready Evidence Pack\n\n**Proof strip:** Every finding traceable to page, row or timestamp · Source, evidence-supported and adopted values kept separate · Not every difference is a conflict · Reviewer owns the decision\n\n**CTAs:** Primary: **Request an Evidence Intelligence Demo**. Secondary: **See one account reconcile** (scrolls to §4).\n\n---\n\n## 2. The Problem: The Data Isn't Missing. It's Contradicting Itself.\n\n**Headline:** Extracting the document was never the hard part.\n\n**Copy:** A loan tape says ₹18.42 lakh outstanding. The statement of account says ₹18.07 lakh. Which is right? Both may be. A proposal says non-smoker while a tele-medical call says otherwise. An application says no existing loans while the bank statement shows an EMI. Each source is valid on its own. Together they don't agree, and someone has to work out why, usually across spreadsheets, PDFs and email chains, with nothing to prove which value the final decision relied on.\n\n**Three-line pain strip:**\n- **Reviewers rebuild the case by hand** in spreadsheets, hunting for what changed.\n- **Real conflicts hide** among differences that are just timing, definitions or newer events.\n- **Decisions can't be explained later:** which source, which date, which value, which reviewer?\n\n**Closing line:** Don't just extract documents. Reconcile the evidence.\n\n---\n\n## 3. How Evidence Intelligence Works\n\n**Headline:** From raw sources to a review-ready evidence case.\n\nEight steps as a horizontal flow, one line each:\n\n1. **Ingest:** Documents, tapes, statements, ledgers, system records and conversations enter through APIs, uploads, SFTP, DMS or LOS/LMS integrations, each tied to its case.\n2. **Understand:** Classify each document and page, read tables and fields, detect version, date and quality.\n3. **Structure:** Normalise values into one case model. \"₹12,50,000\", \"12.5L\" and \"1,250,000\" become one number. \"POS\", \"Principal O/S\" and \"Outstanding Principal\" become one field. Original values are kept.\n4. **Reconcile:** Compare each field across every relevant source, using dates, definitions, calculation logic and business rules.\n5. **Classify:** Label each difference: agrees, contextual, conflict, stale, enriched, missing, or subsequent event.\n6. **Prove:** Attach every finding to its exact source evidence.\n7. **Clarify & resolve:** Request what's missing, ingest the response, and record the reviewer's decision.\n8. **Consolidate:** Produce the case view, the evidence pack and the audit trail.\n\n---\n\n## 4. Signature Section: One Account, Eight Sources, One Answer\n\n**Headline:** Watch a seller tape meet the truth.\n\n**Format:** A case timeline. Left shows the source values, right shows Darwix's finding and classification. Script below.\n\n**The case:** A retail secured loan under diligence. **Seller tape claims:** Outstanding principal ₹24.8 lakh (as of 31 Aug) · Property value ₹62 lakh · Last payment 10 Jul · Legal status: notice issued · Owner: borrower · Security documentation: complete.\n\n**Darwix ingests:** Seller tape · loan agreement · statement of account · repayment ledger · property documents · valuation report · legal report · collection notes\n\n| Field | What the sources say | Darwix finding |\n|---|---|---|\n| **Outstanding principal** | Tape ₹24.8L (31 Aug). SOA ₹24.1L (15 Sep). Ledger shows ₹70,000 recovery on 28 Aug | **Stale / Newer.** Difference explained by a later event. Evidence-supported value: ₹24.1L. *Not a \"₹70,000 mismatch.\"* |\n| **Property value** | Tape ₹62L. Latest valuation ₹54L (2 Sep) | **Material Conflict / Newer Valuation.** Reviewer decision required |\n| **Ownership** | Tape: borrower. Property document: borrower + spouse | **Enrichment.** Co-owner discovered |\n| **Legal status** | Tape: notice issued. Legal report: action progressed further | **Subsequent Event.** Tape status is stale |\n| **Security documents** | Tape: complete. Received set is missing one configured document | **Missing Evidence.** Seller clarification created |\n\n**Then:** The seller supplies the missing document. Darwix ingests it, re-runs only what changed, closes the finding, and keeps the full clarification trail. The reviewer opens the case with material findings, evidence links and one open valuation decision.\n\n**Closing line:** The product didn't read eight files. It built an evidence-backed understanding of the account.\n\n---\n\n## 5. Not Every Difference Is a Conflict\n\n**Headline:** Classify the difference before deciding what it means.\n\n**Copy:** Most tools flag every mismatch and bury reviewers in false alarms. Darwix understands dates, definitions and events, so reviewers see what a difference *means*.\n\n| Class | Meaning | Example |\n|---|---|---|\n| **Agrees** | Independent sources support the same value | KYC and proposal both show DOB 14 March 1986 |\n| **Contextual** | Related but different concepts | Gross salary ₹1.10L vs net ₹82,000 |\n| **Conflict** | Incompatible values for the same fact and time | Proposal says non-smoker; call says current smoker |\n| **Stale / Newer** | A later source legitimately supersedes an earlier one | August balance vs September SOA |\n| **Enriched** | A source adds a fact never captured | Legal document reveals a co-owner |\n| **Missing / Quality** | Expected evidence absent, incomplete or unreadable | Valuation report is missing pages 19–24 |\n| **Subsequent Event** | Value changed because something happened after the earlier source | Legal action filed after tape cut-off |\n\n**Supporting line:** Compare values with context, not string matching.\n\n---\n\n## 6. Every Finding Answers: \"Show Me the Proof.\"\n\n**Headline:** No black-box conclusions. Every finding stays one click from its evidence.\n\n**Copy:** Each value and finding keeps its path back to the source: document, version, page, table, row, ledger entry, transcript timestamp, system field, rule version and reviewer action.\n\n**Example finding:**\n\n| | |\n|---|---|\n| **Finding** | Premium Payment Term Conflict |\n| **Proposal form** | 15 years → Page 4, Premium Details |\n| **Benefit illustration** | 15 years → Page 2 |\n| **Customer statement on verification video** | 10 years → timestamp 04:18 |\n| **Classification** | Conflict |\n| **Confidence** | High |\n| **Status** | Review required |\n\n**Supporting line:** The reviewer should never have to ask, \"Where did the AI get this from?\"\n\n---\n\n## 7. Three Values. Nothing Overwritten.\n\n**Headline:** Keep what was received, what the evidence shows and what the reviewer accepted.\n\n**Copy:** Evidence-heavy cases change hands. A seller gives one value, diligence finds another, and a reviewer adopts a third. Darwix keeps all three, separately.\n\n| Value state | Meaning |\n|---|---|\n| **Source value** | What the originating system, seller or document said |\n| **Evidence-supported value** | What the available evidence currently supports |\n| **Adopted value** | What the authorised reviewer accepted, with who, when and why |\n\n**Example:** Property market value. Seller: ₹72L. New valuation: ₹64L. Adopted: ₹64L, reason \"latest independent valuation\", effective 18 Sep, evidence Valuation Report p.17. The ₹72L stays in the history.\n\n**Supporting line:** Never lose what was received, what the evidence showed or what was finally accepted.\n\n---\n\n## 8. Conversations Are Evidence Too\n\n**Headline:** Reconcile what people said with what the documents show.\n\n**Copy:** Most reconciliation stops at documents. Darwix pulls in the conversation layer: a borrower's PD, a customer's video verification, a tele-medical consultation, an agent call. A customer's own words become another source in the case, and get compared to the file.\n\n**Examples:**\n- **Lending:** Application says no existing loans. Bank statement shows a recurring ₹18,500 debit. In the PD, the borrower confirms a car EMI. → **Undeclared Obligation, supported by three sources.**\n- **Insurance:** Proposal says no diabetes. On the tele-medical call the customer mentions daily diabetes medicine. The lab report shows an elevated HbA1c. → **Material Disclosure Conflict.**\n- **Insurance:** Proposal says ₹15L annual income. Income documents support about ₹11L. → **Financial Underwriting Conflict.**\n\n**Supporting line:** One case view connects the form, the document and the conversation.\n\n---\n\n## 9. Missing, Stale and Newly Discovered Evidence\n\n**Headline:** The most valuable findings aren't mismatches. They're what the file never contained.\n\nThree cards:\n\n**Missing:** Compares the case against your configured evidence requirements. *\"Security document referenced in seller tape but not received.\" \"Medical report advised but not on file.\" \"Ledger doesn't cover the required period.\"*\n\n**Stale:** Detects outdated snapshots and old valuations against your freshness rules. *\"Valuation older than the configured limit.\" \"Legal status predates a later event.\"*\n\n**Newly discovered:** Surfaces facts absent from the source data. *Undisclosed medical condition · additional loan · new legal proceeding · extra co-owner · unrecorded recovery payment · changed nominee.*\n\n**Quality checks:** Missing pages, unreadable scans, duplicate files, conflicting versions, broken date sequences and incomplete annexures are flagged before anyone relies on the data.\n\n---\n\n## 10. Review by Materiality, Not Document Count\n\n**Headline:** Move from thousands of extracted fields to the few findings that change the decision.\n\n**Copy:** Every finding is structured, prioritised and explained.\n\n**Example finding card:**\n\n| | |\n|---|---|\n| **Finding ID** | FIN-DUE-0048 |\n| **Category** | Outstanding balance |\n| **Classification** | Critical conflict |\n| **Seller value** | ₹23.8 lakh |\n| **Evidence-supported value** | ₹19.6 lakh |\n| **Primary evidence** | SOA + LMS snapshot |\n| **Confidence** | 0.96 |\n| **Status** | Review required |\n\n**Confidence, explained:** Not one opaque score. Confidence reflects extraction quality, source agreement, freshness, completeness and rule certainty. Low-confidence evidence goes to a reviewer instead of being treated as fact. *Three sources agree on DOB → high. One blurry scan vs a borrower statement on income → review.*\n\n**Severity reflects:** Financial impact · underwriting relevance · legal relevance · collateral impact · compliance relevance · evidence incompleteness\n\n---\n\n## 11. Clarify, Resolve, Preserve\n\n**Headline:** When the evidence isn't enough, ask the right source and keep the answer in the trail.\n\nFour blocks in a flow:\n\n1. **Structured clarification:** Not an email chain. Each request carries the finding, both values, the exact source references, what's needed and a due date. It goes to the seller, borrower, customer, agent, underwriter, legal, valuation or field team.\n2. **Response becomes evidence:** The reply or new document is ingested, linked to the finding, and only the affected fields are re-processed. Previous results are preserved.\n3. **Reviewer resolution:** Accept the source value · accept the evidence-supported value · adopt another supported value · mark contextual · request more evidence · escalate · defer. Each logs the reviewer, reason and evidence.\n4. **Selective reprocessing:** A new valuation report updates property value and related findings without rebuilding the medical, KYC or servicing evidence.\n\n**Supporting line:** Detect. Prove. Clarify. Resolve. Preserve.\n\n---\n\n## 12. Case 360, Readiness and the Evidence Pack\n\n**Headline:** One view of what the evidence supports. One pack that shows how you got there.\n\nThree blocks:\n\n**a) Case 360:** Borrower, account, policy or asset 360 showing latest evidence-supported values next to original source values and adopted values, open and resolved findings, missing evidence, confidence and material changes.\n\n**b) Review-ready gate:** Does the case have enough evidence to move forward?\n- **Ready for Review**\n- **Ready with Exceptions**\n- **Blocked: Missing Evidence**\n- **Blocked: Material Conflict**\n- **Clarification Pending**\n\n*Don't confuse document receipt with decision readiness.*\n\n**c) Evidence pack:** A portable, committee- and audit-ready record: source index, document inventory, canonical field view, discrepancy and missing-evidence registers, evidence snippets with page/row/timestamp anchors, clarification history, reviewer resolutions, adopted-value change log and audit timeline.\n\n**Supporting line:** A case file that explains not only the answer, but how the answer was reached.\n\n---\n\n## 13. Rules Where Rules Belong. AI Where Understanding Is Needed.\n\n**Headline:** Use deterministic logic for deterministic questions.\n\n**Copy:** If the tape is dated 31 August, the SOA is dated 15 September and a ₹50,000 recovery posted on 10 September, the balance difference is a subsequent servicing event. That's arithmetic and dates, not a guess. Darwix combines OCR and document AI, language models for semantic comparison and entity resolution, and deterministic rules for calculations, dates, thresholds and source hierarchy, and records which was used.\n\n**Supporting line:** Use AI for understanding. Use rules for control. Preserve both in the evidence trail.\n\n---\n\n## 14. One Evidence Layer. Four BFSI Journeys.\n\n**Headline:** Built for the workflows where the evidence conflicts.\n\nFour cards, each with the sources reconciled and one example finding:\n\n**Asset Acquisition / ARC**\nSeller tape, sanction documents, loan agreement, SOA, ledger, security and valuation documents, legal and recovery records.\n*Example:* Tape shows ₹85L market value; latest valuation shows ₹69L → **Stale / Newer Valuation, material impact.**\n\n**Lending**\nApplication, LOS, bank statements, salary slips, ITR/GST, bureau data provided by the lender, PD conversation, property and valuation records.\n*Example:* Application ₹90,000 income vs ₹82,000 net pay, salary credit and borrower statement → **Contextual difference, not a conflict.**\n\n**Insurance Pre-Issuance**\nProposal, KYC, medical questionnaire, lab reports, tele-medical and video verification conversations, underwriting notes.\n*Example:* Proposal says non-smoker; video call discloses occasional smoking → **Disclosure Conflict routed to underwriting.**\n\n**Claims & Investigation**\nClaim form, policy record, hospital documents, bills, diagnostics, investigator and surveyor reports.\n*Example:* Admission date on the discharge summary differs from the claim form → **Date inconsistency flagged with both page anchors.**\n\n---\n\n## 15. Your Rules. Your Thresholds.\n\n**Headline:** The AI finds differences inside your institution's decision framework.\n\n**Configurable:** Canonical fields · source hierarchy · mandatory documents · freshness limits · materiality and numeric tolerances · date tolerances · confidence thresholds · severity logic · rules by product or portfolio · review and escalation paths · clarification templates · adopted-value permissions · readiness rules · workflow actions\n\n**Example:** A ₹1,000 difference may be immaterial in one portfolio and material in another. You set the threshold.\n\n---\n\n## 16. Automate the Evidence Work. Keep the Decision Accountable.\n\n**Headline:** Judgment stays where it belongs.\n\n| Darwix does | Authorised reviewers control |\n|---|---|\n| Ingests, extracts and normalises | Acceptance of material evidence |\n| Reconciles and classifies differences | Exception resolution and source override |\n| Finds missing, stale and new evidence | Adopted values |\n| Ranks and explains findings | Underwriting and credit judgment |\n| Links each finding to proof | Legal interpretation |\n| Drafts clarification requests | Claim decisions |\n| Reprocesses when new evidence arrives | Acquisition or investment decisions |\n| Prepares summaries and triggers approved workflows | Policy deviations and final accountable action |\n\n**Boundary line (state on page):** The platform does not autonomously sanction credit, issue or decline a policy, approve a claim, decide an acquisition or make a legal determination.\n\n---\n\n## 17. Integrations, Events and Governance\n\n**Headline:** Fits the systems that already hold the case. Keeps the evidence controlled.\n\n**Connects to:** LOS · LMS · CRM · policy admin · underwriting · claims · DMS · collections and recovery · legal case management · seller data rooms · valuation and KYC systems · data warehouse and lake · workflow engines · external data providers.\n\n**Actions:** A finding can trigger work: missing document → request and owner; medical conflict → medical underwriting; stale valuation → refresh request; seller difference → seller clarification; case ready → next review or committee workflow. Events (finding created, clarification received, adopted value changed, case review-ready) are available to downstream systems.\n\n**Governance tiles:**\n- **Need-based and role-based access:** documents, medical and financial findings restricted by role\n- **PII protection:** configurable masking and redaction\n- **Source integrity:** source identity and version preserved\n- **Full audit trail:** extraction, rule and model versions, findings, clarifications, reviewer actions and write-backs\n- **Controlled write-back:** define which values return to which systems and when approval is required\n- **Encryption, residency and retention:** on-prem, VPC or cloud, per enterprise policy\n\n**Badges:** SOC 2 Type II · ISO 27001 (as on the Compliance page) · link to Compliance\n\n---\n\n## 18. Business Impact\n\n**Headline:** Less time searching for the truth. More time deciding what to do with it.\n\nValue tiles (bold headline, one line each):\n- **End manual reconciliation:** no more spreadsheets built to compare sources\n- **Focus review time:** material findings to people, consistent evidence passes through\n- **Stop chasing false alarms:** timing and definition differences are classified, not flagged as errors\n- **Surface hidden facts:** what the source data never contained\n- **Cut clarification cycles:** precise, evidence-linked requests replace vague follow-ups\n- **Align teams:** underwriting, credit, legal, claims and diligence share one evidence state\n- **Defend every decision:** source, rule, reviewer and adopted value all on record\n\n**Operational visibility (one line):** Conflicts per case, missing-evidence and stale-data rates, clarification turnaround, cases blocked and time to review-ready, to show where evidence quality creates delay.\n\n---\n\n## 19. Why Darwix\n\nEight pillars, one line each:\n**Cross-source** (not one document at a time) · **Context-aware** (differences classified) · **Evidence-first** · **Provenance-aware** · **Resolution-aware** (clarify, resolve, adopt) · **Conversation-native** (calls and PDs as evidence) · **Rules + AI** · **Human-controlled and audit-ready**\n\n**Supporting line:** Not document AI. Decision-grade evidence intelligence.\n\n---\n\n## 20. FAQ\n\n1. **What is Evidence Intelligence?** A cross-source reconciliation platform for BFSI. It ingests documents and enterprise data, extracts and normalises evidence, compares values across sources, classifies differences, finds missing or new information, links every finding to source proof and prepares the case for human review.\n2. **Is this OCR or document AI?** No. Extraction is an input. The product goes on to compare information across sources, explain why values differ and preserve lineage through clarification and resolution.\n3. **Does every difference become a discrepancy?** No. Differences are classified as Agrees, Contextual, Conflict, Stale/Newer, Enriched, Missing/Quality or Subsequent Event, so timing and definition differences don't become false conflicts.\n4. **Can I see where a finding came from?** Yes. Findings link to the exact document, page, table, row, ledger entry, system field or transcript timestamp.\n5. **Does it overwrite the original value?** No. The source value, the evidence-supported value and the reviewer-adopted value are kept separately, with full history.\n6. **What happens when new evidence arrives?** It joins the case. Affected fields and findings are reprocessed, and prior values and reviewer actions stay in the audit history.\n7. **Can it request clarification?** Yes. Findings and missing evidence create structured clarification requests to the appropriate party.\n8. **Does the AI make the final credit, underwriting or claim decision?** No. Authorised people and systems make every accountable decision.\n9. **Can it reconcile conversations with documents?** Yes, where a transcript or verification outcome is available, such as a PD, video verification or tele-medical conversation.\n10. **Can it detect stale information?** Yes. With source dates and subsequent events, it separates an older value from a real contradiction.\n11. **How is confidence handled?** It reflects extraction quality, source agreement, freshness, completeness and rule certainty. Low-confidence items are routed for review.\n12. **Which workflows does it support?** Asset acquisition and ARC diligence, lending, insurance pre-issuance, and claims and investigation, with configuration per institution.\n\n---\n\n## 21. Closing CTA Block\n\n**Headline:** Make every case explainable back to its evidence.\n\n**Copy:** Bring every source into one reconciled case, surface the differences that matter, trace every finding to proof and give reviewers what they need to make accountable decisions.\n\n**CTA:** **See Evidence Intelligence in Action**\n\n**Form:** Reuse the site's standard \"Request a Personalized Demo\" form and value bullets.\n\n---\n\n## Open Items to Confirm Before Publishing\n\n- **Lead use case:** The PRD leads with ARC and asset-acquisition diligence (§4) because it best shows classification. Confirm this matches the strongest current customer or pilot story, and swap the signature demo if not.\n- **Link to other Darwix products:** §8 assumes Evidence Intelligence can ingest outputs from Darwix's own PD, Video PIVC and Tele-Medicine products. Confirm this is live or planned before the page claims it.\n- **Metrics:** No quantified claims (documents per hour, extraction accuracy, review time saved) are included. Add only measured data.\n- **Feature readiness:** Confirm which of the seven difference classes, selective reprocessing, review-ready gates and clarification workflows are live versus roadmap.\n- **Integrations:** Confirm which LOS, LMS, DMS and data-room integrations are available today.\n- **Sample data:** All examples use synthetic data. The §4 demo needs a real walkthrough built on synthetic or fully anonymised documents.\n- **Customer proof:** Add a named logo or quote only if approved.\n"},{"id":"r-Life_Insurance_Proposal_Automation","name":"Life_Insurance_Proposal_Automation.md","text":"# PRD: Darwix AI Life Insurance Proposal Automation Page\n\n**Scope:** Content of the Life Insurance Proposal Automation page only. Navigation, entry points, layout and visual design are out of scope.\n**Audience:** Life insurers: Heads of Distribution, New Business and Operations, Underwriting, Digital and Product, and Chief Compliance/Risk Officers. Agency and bancassurance channel leaders are the secondary reader.\n**What the product is:** A conversation-to-proposal layer for life insurance. It pre-fills what the insurer already knows, listens to the advisor-customer conversation, fills the insurer's own proposal form (personal, financial, medical, lifestyle, nominee) as the customer speaks, asks configured follow-ups when an answer needs depth, catches contradictions and missing information before submission, links supporting documents to the fields they prove, has the customer review and confirm, and hands underwriting a complete, traceable case.\n**Page goal:** Make the reader believe one thing: *the proposal is where disclosure quality is won or lost, and Darwix makes it complete, consistent and confirmed by the customer, before it reaches underwriting.*\n**Positioning guardrails (state them on the page):**\n- Darwix builds the proposal. It does not underwrite, price, accept, load, decline or issue. It does not recommend a product outside the insurer's approved advice and suitability process.\n- It works with the insurer's approved KYC process. It does not replace it.\n**Voice:** Match darwix.ai: confident, short, outcome-led. Every section leads with a claim, then proof.\n\n---\n\n## 1. Hero\n\n**Eyebrow:** AI PROPOSAL AUTOMATION · BUILT FOR LIFE INSURANCE\n\n**Headline:** Advisors talk to customers. Darwix completes the proposal.\n\n**Subhead:** Darwix Life Insurance Proposal Automation pre-fills what you already know, fills your proposal form as the customer speaks, asks the right follow-up when a medical or lifestyle answer needs depth, flags what doesn't match before submission, and gives underwriting a complete, evidenced case the customer has confirmed.\n\n**Capability line:** CRM & KYC Pre-Fill · Live Proposal Capture · Dynamic Medical & Lifestyle Follow-Ups · Discrepancy Detection · Document Intelligence · Customer Review & Consent · Underwriting Handoff · Hindi-English-Hinglish\n\n**Proof strip:** Your questionnaire, your logic · Understands \"not regularly\" isn't \"No\" · Contradictions caught before submission · Customer confirms exactly what's submitted\n\n**CTAs:** Primary: **Request a Proposal Automation Demo**. Secondary: **Watch a proposal complete itself** (scrolls to §4).\n\n---\n\n## 2. The Problem: The Proposal Is Where Disclosure Is Won or Lost\n\n**Headline:** Everything downstream depends on a form that's still filled by hand.\n\n**Copy:** The proposal is the foundation of the contract. Underwriting relies on it, and if a claim is questioned years later, what the form asked and what was disclosed is what gets examined. Yet it's still a long form, filled by an advisor switching between conversation and screen, with data the insurer already holds re-asked, medical answers squeezed into Yes/No boxes, and documents uploaded separately. A customer who says \"I don't smoke regularly\" becomes a \"No.\" A different income sits in CRM, on the form and in the ITR. Gaps surface after the customer has left, as underwriting queries, delays and, in the worst case, disputes.\n\n**Three-line pain strip:**\n- **Data entry, not conversation:** advisors type while customers wait.\n- **Answers that lose their meaning:** nuanced disclosures flattened into checkboxes.\n- **Problems found too late:** as underwriting queries, drop-offs and claim disputes.\n\n**Regulatory context line (Legal to review):** Life insurance runs on utmost good faith, and the proposal form is where disclosure is captured. Getting it clear, complete and confirmed at the source matters.\n\n**Closing line:** Let the advisor understand the customer. Let AI build the proposal.\n\n---\n\n## 3. How It Works\n\n**Headline:** From customer context to underwriting-ready proposal.\n\nEight steps as a horizontal flow, one line each:\n\n1. **Pre-fill:** Pull customer, KYC, quote, product, advisor and existing-policy context. The conversation starts with confirmation, not a blank form.\n2. **Converse:** The advisor talks naturally, in Hindi, English or Hinglish. No reading the form field by field.\n3. **Capture:** Darwix separates speakers and maps every relevant answer into your form, in any order.\n4. **Go deeper when needed:** A positive medical or lifestyle answer opens your configured follow-ups.\n5. **Validate:** Compare what's said with CRM, KYC, documents and what the advisor entered.\n6. **Evidence:** Request and link documents at the moment they're needed.\n7. **Confirm:** The customer reviews the material information and gives the declaration and consent you configure.\n8. **Hand off:** Send underwriting a structured case with lineage, discrepancies and required next steps.\n\n---\n\n## 4. Signature Section: One Term-Insurance Conversation, One Underwriting-Ready Proposal\n\n**Headline:** Watch a proposal complete itself.\n\n**Format:** A conversation on the left (Hinglish, with speaker labels) and the proposal form filling on the right, colour-coded *pre-filled*, *captured*, *flagged*. Script below. *(Synthetic data.)*\n\n**Pre-filled from CRM/KYC:** Existing customer · term plan · sum assured ₹1 crore · annual premium · advisor · KYC on file · CRM income ₹18 lakh · occupation: self-employed\n\n| Moment | What's said | What Darwix does |\n|---|---|---|\n| **Confirm** | Advisor: \"Your address on record is Sector 56, Gurugram. Still correct?\" Customer: \"Yes.\" | Marks the address confirmed, with the source, who confirmed and when |\n| **Occupation** | \"Digital printing ka business hai, around six years se.\" | Captures business type and six-year vintage |\n| **Income** | \"Last year around thirteen lakh.\" | **Flags: Income Disclosure Mismatch** (CRM ₹18L vs stated ~₹13L). Nudges for clarification and the configured income document |\n| **Existing cover** | \"Ek policy already hai, around 25 lakh ki.\" | Captures existing cover ~₹25L and asks for insurer and policy details |\n| **Medical** | \"BP ki medicine three years se le raha hoon.\" | Records hypertension treatment, ~3 years, and opens your configured follow-ups (diagnosis, medication, last investigation, complications) |\n| **Lifestyle** | \"Regularly nahi. Month mein maybe 2–3 cigarettes.\" | Records **Tobacco: Yes, occasional, cigarettes, ~2–3/month.** Not \"No\" |\n| **Nominee** | \"Wife ko nominee rakhna hai.\" | Captures spouse as nominee and requests the remaining required details |\n| **Evidence** | Customer uploads the ITR: ₹12.7L | Reconciles CRM ₹18L, customer ~₹13L and document ₹12.7L. Final value follows your review process. All three kept in the history |\n\n**Then:** Darwix shows the customer a plain summary of material information. The customer confirms, declares and authenticates against that exact proposal version. Underwriting receives the case with the hypertension disclosure, tobacco use, income evidence, existing cover, source lineage and any configured medical requirement.\n\n**Closing line:** The advisor had one natural conversation. Darwix produced the proposal, the evidence trail and the underwriting handoff.\n\n---\n\n## 5. A Disclosure Isn't a Yes/No Box\n\n**Headline:** Understand the meaning of the answer, not just the first word.\n\n**Copy:** Customers rarely answer in binary. Darwix captures what they actually said and structures it against your questionnaire.\n\n| Customer says | A checkbox records | Darwix records |\n|---|---|---|\n| \"Regular smoker nahi hoon, friends ke saath kabhi-kabhi.\" | No | **Tobacco: Yes.** Occasional smoking, follow-ups opened |\n| \"Bas social smoking, 2–3 times a month.\" | No | Tobacco: Yes · type · ~2–3 times/month |\n| \"BP ki medicine teen saal se chal rahi hai, baaki koi issue nahi.\" | (varies) | Hypertension treatment: Yes · ~3 years · other conditions: none stated in this response |\n| \"Smoking quit kiya tha, few months se occasionally again.\" | No | **Current tobacco use: Positive.** Original value preserved, discrepancy marked |\n\n**Adaptive follow-ups (your logic, your questions):** A \"Yes\" to diabetes opens diagnosis year, treatment, medication type, last relevant investigation, complications, hospitalisation and available reports. A \"Yes\" to tobacco opens type, frequency, duration and quantity. A \"No\" opens nothing extra.\n\n**Structured, not free-text:** *Condition: Diabetes · Diagnosis year: 2021 · Treatment: oral medication · Recent investigation: available/pending · Complications: customer response · Evidence: linked if available.*\n\n**Supporting line:** Turn a positive disclosure into underwriting-ready context. Ask less when less is needed. Go deeper when the disclosure requires it.\n\n---\n\n## 6. Pre-Fill, Then Confirm, Never Re-Ask\n\n**Headline:** Don't make customers repeat what you already know.\n\n**Copy:** Darwix retrieves authorised context from CRM, KYC, quote and illustration systems and existing policy records, and turns each known value into a confirmation. Every value keeps its source.\n\n**Handles the real structure of a life proposal:** Proposer · life assured · payor · nominee · appointee · guardian for a minor · beneficiary structure. Each role is kept separate. *Know who is proposing, who is insured, who is paying and who receives the benefit.*\n\n**What it captures:** Identity and contact, occupation and income, existing insurance and pending applications, product configuration, medical and family history, lifestyle, nominee, declarations.\n\n---\n\n## 7. Catch the Contradiction Before It Becomes an Underwriting Query\n\n**Headline:** A complete proposal isn't enough. It has to be consistent.\n\n**Copy:** Darwix compares what the customer says, what's in CRM, what the advisor entered and what the documents show, live.\n\n| Source A | Source B | Darwix flags |\n|---|---|---|\n| Advisor value: income ₹18L | Customer: ~₹13L. ITR: ₹12.7L | **Income Disclosure Mismatch** |\n| Form: tobacco No | Conversation: occasional smoking | **Tobacco Disclosure Mismatch** |\n| Form: no existing life cover | CRM shows an existing insurer relationship | **Existing Insurance Requires Confirmation** |\n| Occupation: \"Engineer\" | Customer: plant-floor work with machinery | **Occupation Detail Required** |\n| Nominee: minor | No appointee details | **Appointee Missing** |\n\n**Nothing is silently overwritten.** Darwix keeps the pre-filled value, the customer-stated value, the document-supported value, the advisor correction and the final submitted value, with the reason and timestamp for every material change.\n\n**Supporting line:** Find the inconsistency while the customer is still on the call.\n\n---\n\n## 8. Documents That Prove the Fields\n\n**Headline:** Don't keep documents beside the proposal. Make them part of it.\n\n**Copy:** Darwix classifies uploaded documents (PAN, address proof, salary slips, ITR, Form 16, bank statements, existing policies, medical and lab reports), extracts the relevant values, maps them to the proposal fields, and flags mismatches, duplicates, unreadable files and missing pages.\n\n**Evidence triggers from the conversation:**\n- Customer discloses diabetes → request the latest configured investigation and treatment details\n- Customer mentions recent surgery → request discharge summary and capture the date\n- Customer says \"ITR abhi phone mein nahi hai\" → mark the income document pending, send an authorised upload link, keep the requirement open\n\n**Supporting line:** Let the disclosure decide the next evidence step.\n\n---\n\n## 9. Advisor Assist and Live Completeness\n\n**Headline:** Fix the gaps while the customer is still there.\n\n**Nudges, not scripts:**\n- \"Nominee relationship is still required.\"\n- \"Customer disclosed hypertension. Diagnosis year and treatment are missing.\"\n- \"Customer-stated income differs from the pre-filled value.\"\n- \"Customer mentioned another life policy. Sum assured is missing.\"\n- \"Tobacco disclosed. Type and frequency are required.\"\n- \"4 mandatory fields remain.\"\n\n**Every field carries a state:** Pre-filled · Confirmed · Captured · Captured but unverified · Document-supported · Clarification required · Discrepancy unresolved · Missing · Complete\n\n**Ready-to-submit gate:** Mandatory fields, disclosures, nominee, medical and lifestyle questions, existing insurance, required documents, declarations and unresolved material discrepancies must all clear. *Form completed doesn't always mean proposal ready.*\n\n---\n\n## 10. The Customer Confirms What Goes In Their Name\n\n**Headline:** Not a final \"Submit\" button. A real review.\n\n**Copy:** Before submission, Darwix prepares a plain-language summary of the material information: personal details, product, sum assured, premium, policy and payment term, riders, nominee, occupation, income, existing insurance, medical and lifestyle disclosures, documents and declarations. The customer can correct through your configured process, then give your declaration, consent and authentication.\n\n**What's recorded:** Proposal version · what was shown · customer confirmation · declaration and consent · authentication · language and channel · timestamp.\n\n**Supporting line:** Know exactly which version of the proposal the customer confirmed, and when.\n\n---\n\n## 11. Grounded Answers, Multilingual by Design\n\n**Headline:** Answer from your product truth, in the customer's language.\n\nTwo blocks:\n\n**a) Grounded product Q&A:** Customers ask \"How long do I pay premium?\", \"Is this benefit guaranteed?\", \"Is the rider compulsory?\", \"What if I miss a premium?\", \"Is this market-linked?\" Darwix answers from your approved product documents, benefit information, policy wording and scripts. If it can't ground an answer, it won't invent one and routes the question to the advisor.\n\n**b) Hindi, English, Hinglish and configured regional languages:** Code-switching mid-sentence, spoken numbers, medical and financial terms and relationships are mapped to standard fields. The transcript stays in the language spoken.\n\n**Customer questions and objections are captured too:** Premium concern, product confusion, rider objection, privacy concern, \"need to talk to my family.\" A proposal should capture what the customer is unsure about as well as what they answered.\n\n---\n\n## 12. One Proposal, Every Next Step\n\n**Headline:** The proposal is the baseline for everything that follows.\n\n**Handoffs, driven by your rules:**\n- **Underwriting:** A structured case with the completed proposal, summary, positive disclosures, financial and existing-insurance context, documents and extracted values, discrepancies (resolved and open), required medical or financial workflow, declaration and lineage.\n- **Tele-medical / video medical:** Proposal context and positive disclosures carry into the medical conversation, so the customer doesn't restart.\n- **Video PIVC:** The proposal becomes the verification context for product, sum assured, premium, term, riders, nominee and disclosures.\n- **Evidence reconciliation:** Later results (a tele-medical mention, a lab report, income documents) are compared against the proposal baseline. *Proposal: tobacco No. Tele-medical: occasional smoking → flagged with both sources linked.*\n\n**Underwriting requirements Darwix can invoke (as you configure them):** Financial documents · medical test · tele-medical or video medical · physician report · occupation, travel, aviation or hazardous-activity questionnaire · existing-insurance or income clarification · manual review.\n\n**Supporting line:** One proposal. One medical story. One evidence trail.\n\n---\n\n## 13. Pause, Resume, Continue Across Channels\n\n**Headline:** A paused proposal should remain a continuous journey.\n\n**Copy:** Customers start with an advisor, continue on a call, and finish on the app. Darwix preserves completed and confirmed fields, open questions, missing documents, unresolved discrepancies, pending consent and the last advisor note, and records why the proposal stopped (needs a document, wants to consult family, premium concern, medical information unavailable).\n\n**When the customer returns:** Resume from the last completed section. Nothing confirmed is asked again.\n\n**Actions during the flow:** Missing-document request · advisor callback task · medical-report upload link · follow-up scheduling · status updates.\n\n**Status clarity:** In Progress · Customer Action Pending · Advisor Action Pending · Evidence Pending · Medical Requirement Pending · Review Required · Ready for Submission · Submitted to Underwriting · Returned for Clarification\n\n---\n\n## 14. Built Around Your Products\n\n**Headline:** One proposal engine. Product-specific logic.\n\nFour compact cards, one line each:\n- **Term insurance:** sum assured vs income, occupation, existing cover, medical and lifestyle, riders, nominee\n- **Savings / endowment:** premium commitment, source of funds, benefit option, term and payment term, customer understanding\n- **ULIP / market-linked:** fund option, premium, acknowledgement of market-linked nature, product declarations\n- **Pension / annuity:** purchase price, annuity option, joint-life, payout, source of funds, declarations\n\n**Needs context (as your approved process requires):** Darwix can structure the customer need captured in your approved sales process (protection need, family goal, retirement, gap in existing cover, affordability). It doesn't independently recommend a product outside that framework.\n\n---\n\n## 15. Your Proposal. Your Rules. Your Underwriting.\n\n**Headline:** Automate the proposal. The insurer owns the risk decision.\n\n**Configurable by you:** Sections, mandatory and conditional fields · product-specific questions · medical, lifestyle, occupation and financial questionnaires · nominee logic · document requirements and evidence triggers · discrepancy rules and materiality · completeness criteria · declaration and consent flow · underwriting requirements · post-proposal actions\n\n| Darwix does | The insurer controls |\n|---|---|\n| Pre-fills and captures the proposal | Product eligibility |\n| Asks configured follow-ups | Needs and suitability process |\n| Detects missing information and contradictions | Financial and medical underwriting policy |\n| Validates documents against fields | Underwriting requirements and risk classification |\n| Drafts the proposal summary | Loading, exclusion, counter-offer, postponement, decline |\n| Triggers configured medical and financial requirements | Acceptance and policy issuance |\n| Prepares the underwriting handoff | |\n\n**Also:** Darwix integrates with your approved KYC process rather than replacing it, and it never alters product benefits. All product content comes from insurer-approved sources.\n\n---\n\n## 16. Integrations, Security and Audit\n\n**Headline:** Fits your stack. Governs sensitive data.\n\n**Connects to:** CRM · lead management · quotation and illustration engine · proposal and policy administration systems · KYC · DMS · underwriting · medical and tele-medical workflows · PIVC · payment and communication platforms · knowledge base · data warehouse · workflow engines\n\n**Reads:** Customer, lead, product, quote, existing policies, KYC, existing proposals, advisor, document status.\n**Returns:** Completed fields, customer-confirmed values, documents, disclosures, nominee, discrepancies, summary, consent, status, underwriting requirements and workflow events.\n\n**Governance tiles:**\n- **Purpose-limited access:** only data authorised for the proposal workflow\n- **Role-based access:** proposal, financial, medical and document data by role\n- **Sensitive-data protection:** health, identity and financial data protected in transit and at rest, with masking where required\n- **Consent traceability:** confirmation and consent events preserved with the proposal version\n- **Source traceability:** where every material field came from\n- **Controlled write-back:** define what updates your systems and what needs review\n- **Model and rule governance:** question logic, extraction behaviour and versions tracked\n- **Residency and retention:** on-prem, VPC or cloud per your policy\n\n**Full audit trail:** Proposal ID, customer, advisor, channel, version, pre-filled value, source, customer answer, advisor change, document value, discrepancy, clarification, final value, confirmation, consent, submission and handoff, each with user and timestamp.\n\n**Badges:** SOC 2 Type II · ISO 27001 (as on the Compliance page) · link to Compliance\n\n---\n\n## 17. Business Impact\n\n**Headline:** Faster proposals. Better disclosures. Fewer downstream clarifications.\n\nValue tiles (bold headline, one line each):\n- **Less manual form filling:** conversations become structured fields\n- **Less repetition:** confirm what you know, capture only what's new\n- **More complete disclosures:** dynamic follow-ups on positive answers\n- **Fewer underwriting queries:** gaps and contradictions resolved before submission\n- **Better data:** source values, statements and evidence kept separately\n- **More transparency:** customers review what's submitted in their name\n- **Advisors freed up:** focus on the customer, not the screen\n- **Consistent multilingual capture:** Hindi, Hinglish and regional languages, one standard record\n\n**Operational visibility (one line):** Completion and first-session completion rates, time to complete, fields pre-filled vs captured, customer corrections, discrepancy categories, drop-off reasons, resumption rate, underwriting query rate, proposals needing medical or financial underwriting.\n\n---\n\n## 18. Why Darwix\n\nEight pillars, one line each:\n**Conversation-native** · **Pre-fill aware** · **Dynamic** (opens depth only when needed) · **Disclosure-aware** (medical, lifestyle, financial nuance) · **Evidence-aware** · **Discrepancy-aware** · **Multilingual** · **Underwriting-ready and insurer-controlled**\n\n**Supporting line:** From conversation to underwriting-ready proposal.\n\n---\n\n## 19. FAQ\n\n1. **What is Darwix Life Insurance Proposal Automation?** A conversation-to-proposal solution. It pre-fills known customer information, captures details from the advisor-customer conversation, applies your follow-up logic, detects missing or inconsistent information, links supporting documents and prepares the case for underwriting.\n2. **Does the advisor still fill the form manually?** No. The advisor talks and Darwix maps answers into your fields. You can still require advisor review before submission.\n3. **Can it pre-fill from our systems?** Yes, from CRM, KYC, quote and illustration systems and existing customer records through authorised integrations.\n4. **Can it handle medical questions?** Yes. You configure the questionnaire and logic. Positive disclosures open structured follow-ups and evidence requirements.\n5. **Can it understand ambiguous answers?** Yes. \"I only smoke socially\" is recorded as a positive tobacco disclosure, not \"No\", subject to your configured logic.\n6. **Does it work in Hindi and Hinglish?** Yes, with code-switching, mapped to standard fields. *(Confirm the exact language list before publishing.)*\n7. **Can it read supporting documents?** Where authorised, it classifies and extracts values from income proof, identity documents, existing policies and medical reports and compares them with the proposal.\n8. **Can it detect inconsistencies?** Yes, between customer statements, pre-filled data, advisor entries and documents.\n9. **Does it make the underwriting decision?** No. Underwriting, risk acceptance, loading, exclusion, postponement, decline and issuance stay with your authorised process.\n10. **Can it trigger medical requirements?** It triggers or prepares the requirements you configure. Your rules and underwriters decide the final requirement.\n11. **Can it connect to PIVC or tele-medical?** Yes. Proposal context passes into those workflows, and later results return to the case for reconciliation.\n12. **Can the customer review the proposal?** Yes. Darwix prepares a customer-readable summary, and you incorporate review, correction, declaration and authentication into your process.\n13. **Does it overwrite existing data?** No. It preserves the original value, captures the new or evidenced value, flags the difference and follows your review process.\n14. **Can an incomplete proposal be resumed?** Yes. Completed fields, open questions, pending documents and unresolved discrepancies are preserved.\n\n---\n\n## 20. Closing CTA Block\n\n**Headline:** Turn life insurance proposal filling into an intelligent customer conversation.\n\n**Copy:** Capture personal, financial, medical and lifestyle disclosures naturally, validate them against evidence, complete the proposal automatically and move an underwriting-ready case into your next workflow.\n\n**CTA:** **See Proposal Automation in Action**\n\n**Form:** Reuse the site's standard \"Request a Personalized Demo\" form and value bullets.\n\n---\n\n## Open Items to Confirm Before Publishing\n\n- **Regulatory and legal wording:** Have Legal and Compliance review the context line in §2 and any wording on disclosure, consent and declaration, so nothing implies legal advice or a guaranteed effect on claim outcomes. Confirm the page never suggests Darwix changes what the insurer is legally required to ask.\n- **Metrics:** No quantified claims (completion time saved, first-session completion, underwriting-query reduction, drop-off improvement) are included. Add only measured pilot data.\n- **Feature readiness:** Confirm which items are live versus roadmap: dynamic medical follow-ups, document-to-field validation, customer review and consent capture, resume across channels and the underwriting and PIVC handoffs.\n- **Link to other Darwix products:** The page claims handoff to Video PIVC, Tele-Medicine and Evidence Intelligence. Confirm which integrations exist today.\n- **Language coverage:** Confirm supported languages beyond Hindi, English and Hinglish.\n- **Integrations:** Confirm supported proposal, policy-admin, CRM, KYC and underwriting systems.\n- **Channel scope:** Confirm which channels are supported for the conversation (advisor in person, voice call, video, digital) and which are roadmap.\n- **Customer proof and demo:** Add a named insurer logo or quote only if approved. The §4 demo needs synthetic data, never real customer health information.\n"},{"id":"r-PIVC","name":"PIVC.md","text":"# PRD: Darwix AI Video PIVC Agent Product Page\n\n**Scope:** Content of the Video PIVC Agent page only. Navigation, entry points, layout and visual design are out of scope.\n**Audience:** Insurer decision-makers: Heads of Operations, Underwriting, Risk, Compliance, Distribution, and CXOs.\n**Page goal:** Make the reader believe one thing: *Darwix finds out what the customer actually understood, before the policy is issued.*\n**Voice:** Match the rest of darwix.ai: confident, short, outcome-led, BFSI-native. Every section leads with a claim, then proof.\n\n---\n\n## 1. Hero\n\n**Eyebrow:** AI VIDEO PIVC · BUILT FOR INSURANCE\n\n**Headline:** Verify the customer. Verify the policy. Verify informed consent.\n\n**Subhead:** Darwix Video PIVC Agent turns pre-issuance verification into a policy-aware video conversation. It confirms who is on the call, checks what they say against the proposal, flags possible mis-selling while the customer is still on video, and hands you audit-ready evidence for every case.\n\n**Capability line:** Identity & Liveness · Policy-Aware Conversation · Real-Time Discrepancy Detection · Multilingual · Consent Capture · Audit-Ready Evidence\n\n**Proof strip:** 5 layers of assurance · Hindi-English code-switch native · Discrepancies caught mid-call, not post-issuance · 6 explainable outcomes, no unexplained pass/fail\n\n**CTAs:** Primary: **Request a Video PIVC Demo**. Secondary: **Watch a live PIVC** (scrolls to §4).\n\n---\n\n## 2. The Problem: \"Yes\" is not understanding\n\n**Headline:** A customer saying \"yes\" doesn't mean they understood the policy.\n\n**Copy:** Most PIVCs are checklists. Ask the questions, capture the \"yes\", move the proposal forward. But mis-selling hides in the gap between what was recorded and what the customer was told. *\"I thought this was a fixed deposit.\" \"The agent said returns are guaranteed.\" \"I only pay for five years.\"* A scripted call never catches these. A reviewer replaying hours of video rarely does.\n\n**Regulatory context line:** IRDAI expects life insurers to use PIVC to prevent mis-selling and confirm customers are fully informed, including key terms such as sum assured, premium, policy term and premium payment term.\n\n**Closing line:** Move from scripted confirmation to evidence-backed pre-issuance assurance.\n\n---\n\n## 3. One Video. Five Layers of Assurance.\n\nFive cards. Each has a one-line promise and three to four proof points.\n\n| # | Layer | Promise | Proof points |\n|---|---|---|---|\n| 1 | **Identity Assurance** | The right customer is on the call. | Face presence · Passive/active liveness · Face match to approved reference (where configured) · Multiple-face and face-not-visible detection · Identity confidence score |\n| 2 | **Policy Understanding** | Verify the exact policy on the proposal, not a generic script. | Product, sum assured, premium, frequency, policy term, PPT, riders, nominee, benefits, exclusions, guaranteed vs non-guaranteed, market-linked risk |\n| 3 | **Mis-Selling & Discrepancy Intelligence** | Catch what doesn't match while the customer is still present. | Speech vs proposal comparison · Advisor-promise detection · Approved follow-up asked instantly |\n| 4 | **Informed Audio-Visual Consent** | Capture what the customer saw, heard, understood and confirmed. | Customer's own video and voice · Language, timestamp and policy value presented alongside each confirmation |\n| 5 | **Audit & Decision Evidence** | Every outcome traces back to the customer's own words. | Structured record, reason codes, exact timestamps |\n\n---\n\n## 4. Signature Section: Mis-Selling Caught Live\n\n**Headline:** Surface the sentence that could change the issuance decision.\n\n**Sub-copy:** The most valuable PIVC signals aren't answers to mandatory questions. They're the things customers say unprompted. Darwix hears them, compares them to the proposal, and acts before the call ends.\n\n**Format:** A three-column \"Customer says → Proposal records → Darwix flags\" table, shown with the first case animated as a live call.\n\n| Customer says | Proposal records | Darwix flags |\n|---|---|---|\n| \"मुझे बताया गया था कि सिर्फ पाँच साल premium देना है.\" | Premium Payment Term: 10 years | **Premium Payment Term Mismatch** |\n| \"I thought this was a fixed deposit.\" | Life insurance savings product | **Product Understanding Mismatch** |\n| \"The advisor told me the returns are guaranteed.\" | Benefit not fully guaranteed | **Benefit Understanding Mismatch** |\n| \"I take diabetes medicine every day.\" | Diabetes: No | **Material Health Disclosure Mismatch** |\n| \"I smoke sometimes, only socially.\" | Tobacco: No | **Tobacco Disclosure Mismatch** |\n| \"I never asked for this additional cover.\" | Rider: Selected | **Rider Consent Mismatch** |\n| \"The agent filled everything. I don't know what was selected.\" | Proposal complete | **Proposal Awareness Risk** |\n\n**Also detected (chip cloud):** Guaranteed-return misrepresentation · Loan-linked bundling or coercion · Payment irregularity (agent paid first premium) · Liquidity / surrender misunderstanding · Market-risk not disclosed · Nominee unknown · Third-party proposal completion · Customer refusal or discomfort\n\n**Supporting line:** Surface the inconsistency while the customer is still present, not after issuance.\n\n---\n\n## 5. How It Works\n\n**Headline:** From proposal data to verified evidence in one intelligent interaction.\n\nSeven steps as a horizontal flow, one line each:\n\n1. **Load context:** Proposal, product, premium, term, riders, nominee and declarations are pulled in before the call. The Agent starts with the case already understood.\n2. **Capture consent:** Recording and participation consent are recorded as evidence.\n3. **Verify identity:** Presence, liveness and face-match run to insurer rules. Low-confidence results become explicit events, never silently ignored.\n4. **Conduct the PIVC:** A natural, policy-aware conversation. Mandatory questions stay mandatory. The intelligence sits around them.\n5. **Detect exceptions live:** Every response is checked against the proposal as it's spoken. Approved follow-ups fire instantly.\n6. **Capture final declaration:** Recorded with all confirmations and unresolved exceptions.\n7. **Generate evidence package:** Video plus structured, searchable, reviewable output.\n\n---\n\n## 6. Conversation That Understands, Not a Recorded Questionnaire\n\n**Headline:** The question may be scripted. The customer's answer rarely is.\n\nThree capability tiles:\n\n**a) Adaptive conversation:** Understands unscripted answers. Tells confirmation from disagreement and uncertainty. Asks approved follow-ups. Returns to unanswered mandatory questions. Records disagreement instead of converting it into a false \"yes.\"\n\n**b) Grounded policy Q&A:** Answers *\"Is this return guaranteed?\", \"What if I surrender?\", \"Is this rider compulsory?\"* from insurer-approved documents and the customer's own policy values. If it can't answer reliably, it never invents an answer. It logs the question and routes it to a human.\n\n**c) Multilingual by design:** Verify in the language the customer actually understands. Hindi-English code-switching is native. Insurer-approved mandatory wording is preserved, while clarifications happen in the customer's language. Responses map back to the same structured fields.\n\n**Supporting line:** Same policy. Same controls. A conversation the customer can actually follow.\n\n---\n\n## 7. Product-Aware Verification\n\n**Headline:** Different policies need different verification intelligence.\n\nFour product cards plus one risk-based card. Each lists what gets verified.\n\n- **Term Insurance:** Sum assured, term, PPT, tobacco, occupation, health declarations, riders, nominee, pure-protection nature\n- **Savings / Endowment:** Premium commitment, guaranteed vs non-guaranteed benefits, maturity, surrender implications, and that it is insurance, not a bank deposit\n- **ULIPs / Market-Linked:** Market-linked returns, investment risk, fund allocation, charges, lock-in, insurance-cover component\n- **Pension / Annuity:** Purchase price, deferred vs immediate structure, annuity option, joint-life, return of purchase price, liquidity limits\n- **Enhanced Verification (risk-based):** Extra scrutiny for high-value policies, material medical declarations, high-risk occupations, prior PIVC failures, identity exceptions and sourcing-risk rules\n\n**Supporting line:** One PIVC platform. Verification logic that changes with the policy and the risk.\n\n---\n\n## 8. Insurer-Controlled Guardrails\n\n**Headline:** AI flexibility inside insurer-controlled boundaries.\n\n**Copy:** Darwix doesn't replace your verification policy with unrestricted AI. Mandatory questions, wording, disclosures, thresholds and escalation rules stay in your hands.\n\n**Control list (two columns):**\n- Mandatory questions that can't be skipped\n- Insurer-approved question wording\n- Product-specific verification templates\n- Conditional follow-up logic\n- No silent conversion of uncertain answers into confirmations\n- Confidence and identity-verification thresholds\n- Retry limits\n- Exception severity rules\n- Manual-review triggers\n- Straight-through vs review routing\n- Required final declarations\n\n**Supporting line:** Deterministic where control is required. Intelligent where the conversation needs it.\n\n---\n\n## 9. Video & Voice Intelligence\n\n**Headline:** Understand what's happening in the interaction, not only what's being said.\n\n**Video signals:** Face present or absent · Face visibility quality · Liveness result · Reference face-match · Multiple faces · Repeatedly leaving frame · Repeated identity failures · Session-continuity anomalies. Video signals are preserved as supporting evidence and interpreted by insurer-defined rules only.\n\n**Voice signals:** Live transcript · Speaker turns · Language and code-switching · Confirmation / disagreement / uncertainty · Customer questions · Material disclosures · Advisor-promise references · Refusals · Contradictions · New information not in the proposal\n\n**Supporting line:** Every important utterance becomes a usable verification signal.\n\n---\n\n## 10. Cross-Source Verification\n\n**Headline:** Compare the conversation with the application while the customer is still on video.\n\n**Copy:** Reviewers shouldn't discover inconsistencies manually. Darwix checks the conversation against the proposal form, KYC data, product configuration, benefit illustration, medical declarations, nominee, premium, term and rider selection, and turns each mismatch into a structured record.\n\n**Example card:**\n\n| Field | Tobacco Usage |\n|---|---|\n| Proposal value | No |\n| Customer response | \"I smoke occasionally.\" |\n| Category | Underwriting Disclosure |\n| Severity | Material |\n| Evidence timestamp | 06:42 |\n| Status | Requires Review |\n\n---\n\n## 11. Outcomes: No Unexplained Pass or Fail\n\n**Headline:** Every session ends with a clear, explainable status.\n\n| Outcome | Meaning |\n|---|---|\n| **Verified** | All identity, policy, disclosure and consent requirements met with no unresolved material exceptions |\n| **Verified with Exception** | Core verification complete; non-blocking exceptions recorded for downstream handling |\n| **Needs Review** | Material mismatch, low-confidence result or risk signal needs human review before the case proceeds |\n| **Re-PIVC Required** | Technical, identity, response-quality or completion issue; re-attempt under configured process |\n| **Customer Declined** | Customer declined consent or a required stage |\n| **Failed Verification** | Mandatory conditions not met under insurer rules |\n\n**Supporting line:** Every outcome is backed by the evidence that produced it.\n\n---\n\n## 12. The Evidence Package\n\n**Headline:** Everything you need to understand what happened, without replaying the video.\n\nSeven evidence blocks:\n- **Session:** PIVC ID, proposal ID, times, duration, language, attempt number, outcome\n- **Identity:** Presence, liveness, face-match, confidence, exceptions, retry history\n- **Policy verification (per field):** Proposal value, value presented, customer response, confirmation and discrepancy status, follow-up asked, resolved/unresolved, timestamp\n- **Consent trail:** Recording and participation consent, mandatory declarations, acceptance or disagreement, timestamps, final declaration\n- **Conversation intelligence:** Transcript, key utterances, questions, disclosures, mis-selling indicators, contradictions, refusals\n- **Video evidence:** Full recording with timestamped markers on flagged moments\n- **Decision evidence:** Final outcome, reason codes, severity, review requirement, downstream action status\n\n---\n\n## 13. Human Review: Send the Exception, Not the Whole Video\n\n**Headline:** Reviewers start with *why the case was flagged*.\n\n**Copy:** Darwix packages the proposal field, customer statement, transcript snippet, video timestamp, discrepancy category and applicable rule into one review card.\n\n**Example card:**\n\n| Exception | Premium Payment Term Mismatch |\n|---|---|\n| Proposal value | 15 years |\n| Customer said | \"Mujhe 10 years bola gaya tha.\" |\n| Timestamp | 04:18 |\n| Severity | High |\n| Status | Needs Review |\n\n**Supporting line:** Review the evidence that matters. Replay the full interaction only when required.\n\n---\n\n## 14. End-to-End Example (Interactive Story Block)\n\n**Headline:** One customer conversation. Two material exceptions. Zero blind spots.\n\n**Case context:** Protection Plus Term Plan · ₹1 Cr sum assured · 30-year term · 15-year PPT · Annual · Proposal tobacco: No · Hindi + English\n\n1. **Agent:** \"Your premium is payable annually for 15 years. Is that the term that was explained to you?\" → **Customer:** \"Nahi, mujhe bola gaya tha ki bas 10 saal premium dena hai.\" → **Flag: Premium Payment Term Mismatch · High.** Agent records the difference instead of asking the customer to confirm an incorrect understanding.\n2. **Agent:** \"Your proposal records that you do not use tobacco. Is that correct?\" → **Customer:** \"Regularly nahi, but kabhi kabhi cigarette smoke karta hoon.\" → **Flag: Tobacco Declaration Mismatch · Material.**\n3. **Outcome: Needs Review.** Identity verified · Recording consent captured · 2 material exceptions · Case routed to review workflow before issuance.\n\n**Closing line:** Darwix doesn't hide the contradiction inside a transcript. It turns it into an actionable pre-issuance decision.\n\n---\n\n## 15. Agentic Actions After the Call\n\n**Headline:** The verification ends. The workflow doesn't.\n\n**Flow line:** Conversation → Verification → Decision Evidence → Action\n\n| Case type | Automatic actions |\n|---|---|\n| **Verified** | Update PIVC status · Write structured results to enterprise system · Attach evidence reference · Trigger next-step workflow |\n| **Needs Review** | Create review task · Route to ops / underwriting / risk / compliance queue · Attach reason codes and timestamps · Notify reviewer · Pause straight-through issuance |\n| **Re-PIVC** | Mark attempt incomplete · Capture reason · Trigger re-attempt · Preserve attempt history |\n| **Customer question needs help** | Log unresolved query · Create callback task · Pass transcript context so the customer never repeats themselves |\n\n---\n\n## 16. Enterprise Integration\n\n**Headline:** Plugs into the systems that already hold the policy journey.\n\n**Connects to:** Policy admin · New business · Proposal systems · CRM · Underwriting · KYC / identity services · Document repositories · Product knowledge bases · Case management · Notification services · Data platforms\n\n**Reads before/during PIVC:** Customer reference · Proposal details · Product configuration · Policy parameters · Medical/underwriting declarations · KYC reference · Nominee · Existing verification status\n\n**Writes back after PIVC:** Status · Verification results · Confirmed fields · Discrepancies · Reason codes · Review requirement · Consent evidence · Evidence reference · Session metadata · Structured transcript intelligence\n\n**Supporting line:** Bring policy context into the conversation. Push verified intelligence back into the workflow.\n\n---\n\n## 17. Security, Privacy & Governance\n\n**Headline:** Sensitive video needs enterprise-grade control.\n\nEight tiles (align wording with the site's Compliance page):\n- **Deployment flexibility:** On-prem, VPC or cloud\n- **Data protection:** Video, audio, transcript and policy data encrypted in transit and at rest\n- **Access control:** Evidence visible only to authorised users and systems\n- **Consent & traceability:** Every consent event logged with full session history\n- **PII protection:** Configurable masking of sensitive information\n- **Auditability:** Session IDs, timestamps, outcomes, reason codes, evidence references\n- **Controlled AI:** Questions, knowledge and escalation rules stay under insurer control\n- **Residency & retention:** Insurer-defined location and retention, per deployment architecture\n\n**Badges:** SOC 2 Type II · ISO 27001 (existing site certifications) · Link to Compliance page\n\n---\n\n## 18. Business Impact\n\n**Headline:** Automate the repetitive work. Keep the evidence.\n\nSeven value tiles (headline plus one line each):\n- **Scale PIVC capacity** without scaling review effort linearly\n- **Cut manual verification effort:** automate routine confirmations, send exceptions to people\n- **Surface mis-selling earlier:** before issuance, not after a complaint\n- **Speed up review:** exact exception and timestamp, no full-video review\n- **Improve data quality:** corrections and disclosures captured as structured fields\n- **Strengthen consent evidence:** question, answer, policy context and timestamp preserved\n- **Standardise verification** across products, languages and sessions\n\n**Closing line:** Automate the standard journey. Escalate the exception. Preserve the evidence.\n\n---\n\n## 19. Why Darwix\n\n**Headline:** Built around the whole verification decision, not just the video call.\n\nNine-word-max pillars: **Policy-Aware · Conversational · Multimodal · Discrepancy-Aware · Mis-Selling-Aware · Grounded · Controlled · Action-Oriented · Auditable**\n\n**Supporting line:** From video verification to pre-issuance intelligence.\n\n---\n\n## 20. FAQ\n\n1. **What is the Darwix Video PIVC Agent?** An AI pre-issuance verification solution for insurance. It combines live video, voice intelligence, customer-specific proposal data, policy knowledge, consent capture and discrepancy detection to conduct and document a structured PIVC before issuance.\n2. **Is it just a scripted video bot?** No. Mandatory questions stay insurer-controlled, but the Agent understands natural answers, detects disagreement and uncertainty, asks approved follow-ups, answers grounded policy questions and spots mismatches with proposal data.\n3. **Can it detect possible mis-selling?** Yes. It flags configured indicators, such as a different premium term, guaranteed returns, \"compulsory with my loan,\" an unrecognised rider or a proposal filled without the customer's knowledge, and routes them for insurer review.\n4. **What if the customer contradicts themselves or the proposal?** The Agent asks an approved clarification, records both values, and assigns the configured outcome. It never treats the answer as a clean confirmation.\n5. **Which languages are supported?** Multilingual and code-switched conversations in configured languages, with consistent policy values and structured outputs. *(Confirm the exact language list with Product before publishing.)*\n6. **Does it support human review?** Yes. Flagged cases go to reviewers with the field, statement, transcript, timestamp and rule.\n7. **What evidence is retained?** Recording, transcript, session metadata, identity results, confirmations, discrepancies, consent events, reason codes, timestamps and final outcome, as configured by the insurer.\n8. **Can outcomes trigger downstream actions?** Yes: system updates, review tasks, underwriting/compliance routing and re-PIVC workflows.\n\n---\n\n## 21. Closing CTA Block\n\n**Headline:** Make every PIVC a source of decision-ready evidence.\n\n**Copy:** Verify the right customer. Confirm the right policy. Detect what doesn't match. Preserve the evidence before issuance.\n\n**CTA:** **See Video PIVC Agent in Action**\n\n**Form:** Reuse the site's standard \"Request a Personalized Demo\" form (Full Name, Company, Business Email, Phone, Use Case) with the same three value bullets.\n\n---\n\n## Open Items to Confirm Before Publishing\n\n- **Metrics:** No quantified claims (accuracy, turnaround time, capacity, false-positive rate) are included. Add them only from measured pilot or production data.\n- **Language list:** Confirm which languages Video PIVC supports today (the site's 22-language claim is for Voice).\n- **Regulatory wording:** Have Compliance and Legal review the IRDAI context line (§2) and all \"aligned with\" phrasing.\n- **Product scope:** Confirm which product cards (§7) and which identity checks (face-match reference, liveness type) are live versus roadmap, so the page doesn't overpromise.\n- **Customer proof:** Add a named insurer logo or quote only if approved.\n- **Demo asset:** Confirm that a real recorded or live Video PIVC session can be shown for the §4 \"Watch a live PIVC\" CTA.\n"},{"id":"r-Pre_Meet_Intelligence","name":"Pre_Meet_Intelligence.md","text":"# PRD: Darwix AI Pre Meet Intelligence Page\n\n**Scope:** Content of the Pre Meet Intelligence page only. Navigation, entry points, layout and visual design are out of scope.\n**Audience:** Heads of Field Sales, Collections, Retail Lending, Insurance Distribution, Wealth/RM, Customer Service and Branch Operations at banks, NBFCs, HFCs and insurers. Frontline managers and sales/credit enablement leaders are the secondary reader.\n**What the product is:** A preparation layer that builds a role-specific, decision-ready brief before every BFSI customer meeting or call. It pulls context from across your systems (CRM, LOS, LMS, policy, claims, service, prior conversations, documents, evidence and alerts), works out what changed since the last touch, what each side promised, what's still open and what the meeting should achieve, then hands the same context to live assist when the interaction starts.\n**Page goal:** Make the reader believe one thing: *frontline teams have plenty of customer data and almost no context. Darwix assembles the context, and tells the user what to do with it.*\n**Positioning guardrails (state them on the page):**\n- Not a generic meeting summariser or a prettier CRM record. Preparation is built around BFSI journeys, commitments, open actions and next steps.\n- The brief surfaces existing, evidence-backed context. It never invents a risk label, speculates about a customer, or recommends a regulated product. Decisions stay with the professional.\n**Voice:** Match darwix.ai: confident, short, outcome-led. Every section leads with a claim, then proof.\n\n---\n\n## 1. Hero\n\n**Eyebrow:** PRE-MEETING INTELLIGENCE · BUILT FOR BFSI FRONTLINES\n\n**Headline:** Walk into every customer meeting already knowing what matters.\n\n**Subhead:** Darwix Pre Meet Intelligence prepares your field officers, relationship managers, advisors, collectors and service teams before every interaction. It brings together account status, the last conversation, open commitments, what changed, risks, missing documents and the questions to ask, then tells them what the meeting should achieve.\n\n**Capability line:** Customer & Account Context · Last-Interaction Memory · Commitment Tracking · What-Changed Detection · Risk & Evidence Context · Meeting Objectives · Questions to Ask · Role-Specific Briefs · Live-Assist Handoff\n\n**Proof strip:** Built from all your systems, not one CRM · Remembers what *you* promised too · Shows what changed, not the whole history · Feeds live assist when the meeting starts\n\n**CTAs:** Primary: **Request a Pre Meet Intelligence Demo**. Secondary: **See a brief** (scrolls to §4).\n\n---\n\n## 2. The Problem: The Meeting Is Often Decided Before It Starts\n\n**Headline:** Your frontline doesn't lack data. It lacks context.\n\n**Copy:** The CRM has one note. The LOS has the application. The servicing system knows about the complaint. A call transcript holds the customer's objection. A payment promise was made two weeks ago and quietly missed. A document is still pending. Your own agent promised a sanction letter that was never sent. The frontline user is expected to piece this together in the few minutes before the visit, and usually walks in with only the latest CRM note. The customer ends up repeating themselves, a promise is forgotten, and the meeting circles back instead of moving forward.\n\n**Three-line pain strip:**\n- **Before:** five systems, four tabs, ten minutes, and a last note that's weeks old.\n- **During:** the customer repeats what they already said, and nobody remembers what was promised.\n- **After:** the same gaps show up in the next meeting.\n\n**Closing line:** Never start a BFSI meeting from a blank screen.\n\n---\n\n## 3. From Scattered Data to One Actionable Plan\n\n**Headline:** Know the customer. Know what happened. Know what's open. Know what to do next.\n\nEight steps as a horizontal flow, one line each:\n\n1. **Trigger:** A scheduled meeting, field task, collection task, application, policy, claim or service request.\n2. **Pull only what matters:** Retrieve the context relevant to this meeting, not every field ever stored.\n3. **Rebuild the relationship history:** What happened, in what order, who owns the next step.\n4. **Detect what changed:** Payments, documents, alerts, stage changes, complaints, breached commitments since the last touch.\n5. **Set the objective:** Define what this meeting should accomplish from journey stage and open actions.\n6. **Build the brief:** Questions to ask, what not to repeat, what to verify, documents to collect, watch-outs.\n7. **Refresh:** Update the brief when the case changes.\n8. **Hand off:** Carry the same context into live assist, then carry the outcome into the next brief.\n\n---\n\n## 4. Signature Section: One Field Visit, One Brief\n\n**Headline:** See what the officer knows before they knock.\n\n**Format:** A brief card. The scattered sources sit to the left (collection call, payment system, service log, ops notes), and the finished brief on the right. Script below. *(Synthetic data.)*\n\n**The brief:**\n\n| Section | Content |\n|---|---|\n| **Customer** | Rohan M. · self-employed · prefers Hindi · assigned field officer |\n| **Account state** | Outstanding ₹84,500 · DPD 47 · last payment 14 Aug |\n| **Primary objective** | Reassess a realistic payment plan under the approved collection strategy |\n| **Last interaction** | Call on 18 Sep: customer said salary was delayed and promised ₹25,000 by 20 Sep |\n| **What changed** | 20 Sep passed. **No payment received.** The promise is broken. A charge dispute from the last call is still unresolved |\n| **Open commitments** | Customer: ₹25,000 by 20 Sep (missed). Organisation: charge-dispute response promised in 48 hours (not sent) |\n| **Ask** | What changed after the last commitment? What amount is realistically payable now? When are funds expected? Is the charge dispute still the blocker? |\n
