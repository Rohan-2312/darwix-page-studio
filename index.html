ient:** \"Fever kal raat se hai, around 101 tha. Thoda throat pain bhi hai but breathing problem nahi hai.\" → **Structured:** Fever · onset previous night · ~101°F · throat pain · respiratory distress: none reported. *(Doctor reviews and corrects.)*\n\n**Multilingual by design:** Hindi, English, Hinglish and configured Indian languages, including mid-sentence code-switching. The conversation is preserved in the language spoken. The structured record is standardised.\n\n**Caregivers and minors:** Statements from a parent, guardian or caregiver are labelled separately from the patient's, so the record shows who said what.\n\n---\n\n## 8. Doctor Assist: Surface, Don't Decide\n\n**Headline:** The right context at the right moment. The judgment stays with the doctor.\n\n**Copy:** When the patient says something that connects to their record, Darwix brings the relevant history forward so the doctor doesn't search across screens.\n\n**Example:** **Patient:** \"Yeh headaches phir se start ho gaye hain, last week se.\" → **Darwix surfaces:** a similar complaint six weeks ago · investigation advised then · whether that report is on file · current medication.\n\n**Assist can also surface:** Known allergies · current medications · recent abnormal values already in the record · missing history fields · configured care-pathway prompts · documentation-completeness reminders\n\n**Configurable urgent-symptom alerts:** Providers can define phrases and thresholds (for example severe breathlessness, chest pain, loss of consciousness, self-harm intent) that raise an alert to the doctor. *Copy on page:* Alerts are decision support. Video Tele-Medicine is not a replacement for emergency services, and the doctor decides the response.\n\n---\n\n## 9. AI-Drafted. Doctor-Reviewed. Clinically Attributable.\n\n**Headline:** The AI prepares the record. The doctor is the authority.\n\n**Copy:** From the live consultation, Darwix drafts a structured note. The doctor edits and approves it before it becomes part of the patient record. Nothing is filed unreviewed.\n\n**Note structure:** Chief complaint · history of present illness · relevant history · medication and allergy history · reports reviewed · doctor's observations · assessment and diagnosis (as entered or confirmed by the doctor) · plan · patient advice\n\n**Source attribution:** Every line keeps its origin, so no field becomes an opaque AI summary.\n\n| Source tag | Example |\n|---|---|\n| **Patient-reported** | \"Fever started last night.\" |\n| **Existing record** | Known penicillin allergy |\n| **Uploaded report** | HbA1c dated 12 September |\n| **Doctor observation** | Recorded by practitioner on video |\n| **Doctor assessment** | Entered or confirmed by practitioner |\n| **AI draft** | Awaiting practitioner approval |\n\n---\n\n## 10. From Doctor's Decision to Done\n\n**Headline:** Once the doctor decides, the workflow moves on its own.\n\n**Flow line:** Consultation → Clinical record → Doctor approval → Action\n\n| Workflow | What Darwix prepares (the doctor authorises each) |\n|---|---|\n| **Prescription** | Captures medicine, dose, frequency, duration and instructions from the doctor's decision, shows allergies and current medicines, and prepares an e-prescription for the doctor to issue. Prescribing rules configurable per applicable guidelines. |\n| **Investigations** | Captures test advised, prepares patient instructions and reminders, creates the lab order, tracks pending reports |\n| **Referral** | Captures specialty and reason, passes consultation context, creates the referral task, tracks status |\n| **In-person escalation** | If the doctor decides video isn't enough, records the reason and creates the in-person next step |\n| **Follow-up** | Schedules the next consultation and sets patient reminders |\n\n**Supporting line:** If care needs to move beyond video, the workflow moves with it.\n\n---\n\n## 11. Follow-Up and the Patient Package\n\n**Headline:** The patient leaves knowing exactly what to do next. The next consultation starts where this one ended.\n\n**Patient package (after doctor approval):** Doctor details · prescription and medicine instructions · investigation advice · referral · follow-up date · monitoring instructions · warning signs documented by the doctor · documents to upload before the next visit. Delivered by portal, app, email, SMS or approved messaging channel.\n\n**Post-consultation questions:** Darwix answers \"how do I take this?\", \"do I need to fast?\", \"when is my follow-up?\" from the doctor-approved plan and provider-approved knowledge only. Anything needing new clinical judgment is routed back to the care team.\n\n**Next follow-up starts prepared:** previous plan · new reports · adherence · patient-reported readings · new symptoms.\n\n---\n\n## 12. Consent and Practice-Guideline Aware\n\n**Headline:** Consent and identity are part of the record, not an assumption.\n\n**Copy:** India's Telemedicine Practice Guidelines put the practitioner's judgment, patient consent and continuity of records at the centre of teleconsultation. Darwix builds those into the workflow.\n\n**Built-in controls:**\n- **Teleconsult consent:** captured, timestamped and stored with the consultation\n- **Recording consent:** explicit, separate and configurable, when recording is enabled\n- **Practitioner and patient identity:** doctor name, qualification and registration attached to every consultation\n- **Minors and caregivers:** guardian participation and consent captured\n- **Prescribing boundaries:** configurable to the provider's rules on what may be prescribed by consultation mode and type\n- **Language:** consent and instructions in a language the patient understands\n\n*(Have Legal review all guideline wording before publishing.)*\n\n---\n\n## 13. Doctor Control: What AI Does and What It Never Does\n\n**Headline:** Automate the administrative burden around medicine. Not the clinician's accountability.\n\n| Darwix does | The practitioner controls |\n|---|---|\n| Collects patient-reported information | Whether telemedicine is appropriate |\n| Retrieves authorised records | Assessment and diagnosis |\n| Transcribes and structures the consultation | Treatment and medication decisions |\n| Drafts the clinical note | Investigation and referral decisions |\n| Surfaces configured alerts | In-person or emergency escalation |\n| Prepares prescription, orders and tasks | Final approval of the clinical record |\n| Executes approved post-consultation tasks | Issuing the prescription |\n\n**Emergency line (state on page):** Video Tele-Medicine does not replace emergency services. Patients needing emergency care are directed to the provider's emergency pathway.\n\n---\n\n## 14. Configured to Your Specialty\n\n**Headline:** One platform, tuned to how each specialty consults.\n\nCompact cards, one line each:\n- **General medicine:** acute symptoms, chronic follow-up, report review\n- **Diabetology:** glucose and HbA1c review, adherence, lifestyle, follow-up planning\n- **Cardiology follow-up:** home readings, medication adherence, report review, in-person escalation\n- **Dermatology:** history, image and report upload, video-supported review where appropriate\n- **Post-discharge care:** recovery, adherence, discharge-plan review\n- **Mental health:** scheduled video sessions, longitudinal context, structured notes, configured escalation\n- **Chronic care:** longitudinal records, trends, care-plan continuity\n\n**Supporting line:** Configure the workflow by specialty. Clinical appropriateness stays with the doctor.\n\n---\n\n## 15. Integrates With Your Care Stack\n\n**Headline:** Bring the record into the call. Send approved outputs back.\n\n**Connects to:** HIS/HMS · EMR/EHR · patient portal · appointment platform · LIS · radiology/PACS · pharmacy · care-management and referral systems · CRM and contact centre · notification platforms · insurer/TPA systems where relevant · ABDM/ABHA-linked health records where the provider integrates them, through consent\n\n**Reads before the call:** Demographics, prior consultations, medication and allergy history, reports, recorded diagnoses, appointments, care plans.\n**Writes after the call:** Approved notes, prescription, orders, referrals, follow-up status, patient instructions, consent record, session metadata, workflow status.\n\n---\n\n## 16. Security, Privacy & Governance\n\n**Headline:** Clinical conversations are among the most sensitive data an enterprise holds.\n\nTiles:\n- **Consent-first:** teleconsult and recording consent before processing\n- **Purpose-limited:** patient data used only for authorised care workflows\n- **Role-based access:** records, recordings and notes visible only to authorised users\n- **Encryption:** video, audio, documents and records protected in transit and at rest\n- **Recording controls:** the provider decides whether to record, what to retain and who can view it\n- **Full audit trail:** consultation ID, practitioner attribution, timestamps, approvals, edits and actions\n- **Retention and residency:** provider-defined retention, on-prem, VPC or cloud with data-location controls\n- **AI governance:** knowledge sources, behaviour boundaries and action permissions under provider control\n\n**Badges:** SOC 2 Type II · ISO 27001 (as on the Compliance page) · link to Compliance\n\n---\n\n## 17. Business Impact\n\n**Headline:** Less time reconstructing the consultation. More time delivering care.\n\nValue tiles (bold headline, one line each):\n- **Cut documentation burden:** structured note drafted for review\n- **Arrive prepared:** history and reports ready before the call\n- **Complete records:** symptoms, medications, allergies, advice and follow-up captured in structure\n- **Better continuity:** one consultation feeds the next\n- **Automate post-call work:** prescriptions, orders, referrals and reminders from approved decisions\n- **Fewer manual system updates:** approved outputs written back automatically\n- **Serve patients in their language:** natural Hindi, English and Hinglish\n\n**Operational visibility (one line):** Consultation volume, completion, follow-up and referral rates, documentation completeness and language mix, for process visibility. Not a score of clinical quality.\n\n---\n\n## 18. Why Darwix\n\nEight pillars, one line each:\n**Context-aware** · **Conversational** · **Multilingual** · **Documentation-native** · **Workflow-aware** · **Traceable** · **Clinician-controlled** · **Integration-ready**\n\n**Supporting line:** From teleconsultation platform to intelligent care operating layer.\n\n---\n\n## 19. FAQ\n\n1. **What is Darwix Video Tele-Medicine?** An AI-enabled layer for remote consultations. It combines patient context, live transcription and structuring, doctor assist, clinical-note drafting and post-consultation workflow automation around a secure video consultation.\n2. **Is Darwix an AI doctor?** No. Assessment, diagnosis, treatment, prescribing, referral and the decision on whether telemedicine is appropriate stay with the Registered Medical Practitioner.\n3. **Can it write the clinical notes?** It drafts structured notes from the consultation. The doctor reviews, edits and approves before anything is filed.\n4. **Can it prescribe medicines?** No. It captures the doctor's medication decision and prepares an e-prescription for the doctor to review and issue, subject to applicable telemedicine prescribing rules.\n5. **Does it understand Hindi and Hinglish?** Yes, with code-switching. It maps the conversation into standard structured fields. *(Confirm the exact language list before publishing.)*\n6. **Can it read previous reports?** Where access is authorised, it extracts structured values from lab reports, prescriptions, discharge summaries and referral letters for the doctor's review.\n7. **Can it integrate with our EMR or HIS?** Yes, through authorised integrations to retrieve context and write back approved outputs.\n8. **What if video isn't enough?** The doctor marks in-person examination, referral or the emergency pathway, and Darwix records the reason and starts the next step.\n9. **Does it record consultations?** Only if the provider enables recording and consent is captured. Retention and access are provider-controlled.\n10. **Does it make emergency decisions?** No. It can raise configured urgent-symptom alerts as decision support. The doctor and the provider's emergency workflow decide the response.\n\n---\n\n## 20. Closing CTA Block\n\n**Headline:** Make every video consultation clinically richer and operationally complete.\n\n**Copy:** Bring patient history, live consultation intelligence, doctor-controlled documentation, prescriptions, investigations, referrals and follow-up into one connected workflow.\n\n**CTA:** **See Video Tele-Medicine in Action**\n\n**Form:** Reuse the site's standard \"Request a Personalized Demo\" form and value bullets.\n\n---\n\n## Open Items to Confirm Before Publishing\n\n- **Audience fit:** Darwix is positioned as BFSI-only today (\"Built for BFSI\"). Confirm whether this page targets hospitals and telehealth providers, health insurers and TPAs, or both, and whether homepage and navigation messaging needs to broaden.\n- **Video layer:** Confirm whether Darwix provides the video consultation itself or layers onto a customer's existing video platform. The copy currently works for either.\n- **Metrics:** No quantified claims (documentation time saved, note accuracy, consult volume) are included. Add only measured pilot data.\n- **Clinical and legal review:** Have clinical and legal advisers review all guideline, prescribing, consent and emergency wording before launch.\n- **Feature readiness:** Confirm which items are live versus roadmap: report extraction, urgent-symptom alerts, e-prescription output, ABDM/ABHA integration and specialty templates.\n- **Language coverage:** Confirm supported languages beyond Hindi, English and Hinglish.\n- **Customer proof:** Add a named provider logo or quote only if approved.\n- **Demo asset:** §4 needs a recorded or scripted demo consultation using synthetic data, never real patient data.\n"}],"design":[{"id":"d-main","name":"Darwix_AI_Design_System.pdf","digest":"## Voice and content rules\n- Voice: precise, operational, restrained, regulated. Write in the third person for the platform and the second person for instructions. Every claim carries a number or a name.\n- Numbers before adjectives. Write \"612 calls scored\", \"Renewal +21%\", \"12× productivity\", \"6.2pts\", not \"many\" or \"significant\".\n- Sentence case everywhere: headlines, buttons, labels, table headers. Uppercase only on eyebrows, overlines and field labels, applied through CSS. Write the source text in sentence case.\n- Headline split pattern (inferred from the examples \"Sense. Understand. Act.\" and \"One BFSI brain\"): a short declarative headline of 2–3 beats. Indigo marks one phrase per section, never more.\n- Banned:\n  - Exclamation marks.\n  - \"Oops\", \"Uh oh\" and \"Whoops\".\n  - Emoji.\n  - \"AI-powered\" as a feature description.\n  - Hype adjectives and hedging.\n  - Blaming the user (\"You entered an invalid…\").\n  - \"Please\" before a required instruction.\n  - \"Click here\".\n  - Synonyms for fixed terms: use agent (not bot), handoff, held, operator, account, transcript, approval.\n- Punctuation: no empty lines between paragraphs (spacing handles it). Use \"·\" as a metadata separator. Do not use a colon in field labels. Write date ranges and money in the fixed formats below.\n- Spelling is British: colour, recolour, authorisation, visualisation.\n- Formats:\n  - Dates: \"06 Sep 2026\", never 06/09.\n  - Time: \"14:32 IST\", 24-hour with the timezone named.\n  - Currency: ₹ with Indian grouping, as ₹4,24,812 in product and \"1.2 lakh\" in marketing.\n  - Percentages: whole numbers, with changes as \"6.2pts\".\n  - Confidence: \"0.91\", to two decimals.\n- CTA wording: 1–3 words, verb first, names the outcome. Examples: \"Book a demo\", \"Request walkthrough\", \"Download compliance pack\", \"Run a pilot\". A trailing arrow → is allowed only for navigation. One primary CTA per view.\n- Compliance is stated plainly and exactly, for example \"RBI 2018 directive\". Marketing tone is confident and specific, and claims carry evidence.\n\n## Layout and components\n- Light-only marketing site; dark mode is for the product app. Use real product screens inside a card panel on #FAFAFB. No stock photography of people and no illustration.\n- Container: 1180 for marketing (12 columns). The foundations layer also lists a 1232 large container. Reading width is 720, or 62–72ch.\n- Page margin is 104 on desktop, 40 on tablet and 20 on mobile. Breakpoints are <640, 640, 900/1024, 1280 and 1440.\n- Section rhythm: 88–96 vertical padding. Page order: nav, hero, metrics, proof strip, feature grid, case study, CTA, footer. A page has one task. Use one accent (indigo) and plenty of white.\n- Card:\n  - Radius 14, with a 1px border and no shadow unless it is interactive.\n  - Padding 20–22, gap 14–16.\n  - Part order: eyebrow, media, title, description, metadata, actions, footer.\n  - Min width 280, max 420.\n  - Three-up on desktop, two-up on tablet, one column on mobile.\n- Button:\n  - Radius 10. Sizes are md 44 and lg 52 (CTA about 48.6).\n  - Primary is indigo with a white label, with hover #4F4FE8 and pressed #4344B8.\n  - One primary per region, and it goes first in a hero pair.\n  - Secondary is a 1px border. Gap between siblings is 12.\n  - Full width below 640.\n  - Label is Manrope 600.\n- Chip and tag: Inter, clickable, removable or selectable. Chips narrow a question and never commit an action. Applied filters show as removable chips.\n- Badge: Inter, states a fact, never clickable. Examples are Live, Failed, Pending, Draft, BETA, NEW. Pair it with an icon or word, never colour alone.\n- Table:\n  - Rows 48, header 40 on #FAFAFB, no vertical rules.\n  - Numbers right-aligned in JetBrains Mono.\n  - More than 5 columns collapses to stacked cards on mobile.\n- Form:\n  - Fill #F4F5F9, borderless, 56 tall, radius 14.\n  - Persistent uppercase label above the field. Helper text states the constraint.\n  - Validate on blur, with the error and its fix under the field.\n  - Field gap 16, group gap 24. Single-column forms are 360 wide.\n  - Ask for the least: work email and company only.\n- FAQ: accordion, single-open, with + / − icons. The open header takes the indigo tint (#EEEFFF). Questions are plain and answers lead with the fact and a number.\n- Icons: outline, 24px grid, 1.75px stroke, round caps, single indigo tone. Charts: indigo first, green for good outcomes, red for bad, and a \"View as table\" link.\n\n## Motion and accessibility\n- Motion explains state and does not decorate. Durations are 120ms for hover, focus and press, 200ms for dropdowns and tabs, and 320ms for modals and pages. Easing is cubic-bezier(.2,.8,.2,1). Nothing runs longer than 240ms except live indicators.\n- Under prefers-reduced-motion, everything collapses to a 120ms opacity fade.\n- Target WCAG 2.2 AA. Contrast: #686868 on white is 5.7:1, white on #565ADD is 5.1:1, and #949395 is for large text only.\n- Focus ring is 2px with a 2px offset in indigo at 40%, using :focus-visible. A skip link comes first on every page.\n- Touch targets are 44px with 8px separation.\n- One h1, no skipped heading levels, and landmarks on every page. Every input has a linked label and error. Colour is never the only signal.\n\n## Tokens\n```json\n{\n  \"primary\": \"#565ADD\",\n  \"primaryHover\": \"#4F4FE8\",\n  \"primaryPressed\": \"#4344B8\",\n  \"tint\": \"#EEEFFF\",\n  \"tintBorder\": \"#D7D8F1\",\n  \"gradientEnd\": \"#4F4FE8\",\n  \"ink\": \"#141416\",\n  \"heading\": \"#111111\",\n  \"body\": \"#515153\",\n  \"muted\": \"#686868\",\n  \"faint\": \"#949395\",\n  \"border\": \"#DBDBDC\",\n  \"subtle\": \"#F1F1F1\",\n  \"page\": \"#FFFFFF\",\n  \"alt\": \"#F y, not a flood of fragments.\" (11) Commitments: \"Promises that outlast the call.\" (12) Evidence anatomy: \"Every alert comes with its proof.\" (13) Severity and ownership: \"Urgent alerts get urgent action.\"\n\nHeadlines and copy: Headlines are sentence-case and split into a dark first clause and an accent second clause. Examples: \"Know what needs attention, | while there's still time to act.\" and \"Catch it before the customer | leaves.\" Eyebrows are spaced small caps, such as \"W i t h o u t c o r r e l at i o n · 4 n o t i f i c at i o n s\" and \"A p p l i c at i o n · L O S\". Subheads are one or two plain sentences that name the pain, then the fix. CTAs are \"Request an Alert Intelligence demo\" (primary) and \"See an alert fire live\" (secondary). Pattern lines use parallel triplets: \"Every alert has an owner, evidence and a lifecycle.\"\n\nSignature element: A live alert console. A review queue is filtered by SLA, with status pills (Open, Acknowledged, Resolved). The detail pane shows ALT-7731, \"Promise to pay · ₹25,000 due Friday\". It has a numbered evidence list of 4 sources, each tagged transcript or record. Below it are Owner, Next action and Merged (\"1 signal, 0 duplicates\"). A \"Listening · 4 channels\" indicator sits on top. The later demo replays a PD remark (\"Car ka EMI bhi hai, around ₹18,500\") against an LOS application (APP-10384, declared obligations \"None\"). Darwix's steps show Understand and Compare, ending in the alert.\n\nVisual motifs: Product-UI cards with monospace IDs (ALT-5520, PTP-31882). Severity, status and source chips (High, Open, transcript, record, LMS, Voice, Payments, Field). Before/after panels (4 notifications vs 1 alert). A Mon–Thu cross-channel timeline. An audit-trail table (Time / Stage / Actor / What happens, with actors like darwix.alerts). A 3-column comparison of the same quote, \"I'll pay on Friday.\", in three contexts. An 8-row numbered alert-anatomy card. Numbered steps, ✓ marks and rupee values.\n ILLED, CAPTURED, FLAGGED, QUEUED) and a field path such as business.vintage.\n- A side panel with counters (Sections complete 3/8, Exceptions, Evidence items), a \"Synced\" status and a streaming write-back note.\n\nAn inline \"✦ Flag\" reads \"Business vintage mismatch · application says 10 years. Both values kept.\"\n\nVisual motifs:\n- White cards with a rounded border.\n- Uppercase letter-spaced micro-labels.\n- Pill chips for tags and filters (All / Missing / Needs clarification / Evidence pending / Queued).\n- Status badges: MISSING, FLAGGED, EVIDENCE, QUEUED, Live.\n- Monospace field IDs like PD-10392, business.assets and \"Field:\" tags.\n- Mismatch cards quote what the borrower said and set it against \"Application says …\".\n- Provenance runs as a five-step chain: LOS value → Borrower → Officer → Evidence → Outcome. Its verbs are Contradicted → Clarified → Proven → Reviewed → Resolving.\n- Checkmark lists.\n- Accent colour is probably blue/indigo, with amber for flags and green for synced or reviewed.\n\nTone:\nPractical and credit-domain specific, with Indian lending context (₹, lakh, LOS, CRM, Hinglish). Short declarative sentences. It reassures on control and auditability: \"Nothing is written to the LOS until the officer reviews.\"","thumb":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQwOEh4UEhEREiUbHBYeLCcuLisnKyoxN0Y7MTRCNCorPVM+QkhKTk9OLztWXFVMW0ZNTkv/2wBDAQ0ODhIQEiQUFCRLMisyS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0v/wAARCAHpAeADASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAECAwQFBgf/xABHEAABAwIEAwQGBwUHAwQDAAABAAIDBBEFEiExE1FhFCJBkQYycYGh0RVTVGKTovAWI1KSsSQzQlVyweE0svEHNmOCFyUm/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAECAwQF/8QALxEBAAECBAUDAwIHAAAAAAAAAAECEQMSEyExQVFS8AQUYRWRoUKxIjJxgcHR4f/aAAwDAQACEQMRAD8A+qqCbbqVgronz0k0Ubsr3sLQeRsgpDiNJPMYYqiN8n8IO62V5OmoKqSWmhFE6B0Mgc+U7aG+/j7lsyYPi7Kmqmo6+OEyyFwBzOzAkkXBuARoNBqFuumKeCQ9IoXCOH4457A7FI3RFv71piFyddiBoPV+PRZKrDcRqaCopHVrWiVzQ2QXzMj8QLW1638emuFdlStDCKWqpYZe2zNmm ted, accepted. Each one kept.\", \"Your framework. Our intelligence.\" Each has one muted subline. Eyebrows are small spaced uppercase, e.g. \"DOCUMENT AI\", \"Step 01\". CTAs are specific: \"Request an Evidence Intelligence Demo\", \"See one account reconcile\". Microcopy flags \"Synthetic data.\"\n\nSIGNATURE ELEMENT: Hero reconcile widget. Loan tape ₹18.42L (31 Aug) vs statement ₹18.07L (15 Sep), with a \"₹35,000 recovery\" ledger event. A \"Darwix answer\" panel reads \"Reconciling… Comparing 2 of 4 sources by date, definition and events.\" It shows a gap explained as timing, not an error. The selectable-row matrix and the evidence viewer (quote at 04:18) reinforce it.\n\nVISUAL MOTIFS: Light, clean enterprise UI. Bordered cards, status pills (Conflict · High, Stale / Newer, Review required), a 7-type colour-coded chip legend, ₹ values in large type, arrows between value stages, mono-style file trees, a numbered list, a confidence meter (0.96, 64%), tabs and a slider.\n\nTONE: Precise, calm, audit-minded and Indian-BFSI specific (₹, lakh, SOA, LMS). It is human-in-the-loop: \"Darwix prepares the evidence. Reviewers make the call.\" Short sentences, with explainability over automation hype.","thumb":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQwOEh4UEhEREiUbHBYeLCcuLisnKyoxN0Y7MTRCNCorPVM+QkhKTk9OLztWXFVMW0ZNTkv/2wBDAQ0ODhIQEiQUFCRLMisyS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0v/wAARCAHpAeADASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAECAwQFBgf/xABHEAABAwIEAwUECAMHAgYDAQABAAIDBBEFEiExE0FRBhRhkaEiMnHRFRYjU4Gx4fBCUmJVY3KSk6LBJfEHJDM0VLI2Q3OC/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAECBAMF/8QALhEBAAEDAgMGBQUBAAAAAAAAAAECAxEhMRITUQQUQVJhoXGBsdHwIiMykcHh/9oADAMBAAIRAxEAPwD6qoUrBWxvmpJo4nZXvYQ09DZBSLEaOafgxVEbpP5Qd1sryVPQ1L5aaBtE6F0TwXynbQ3328ltOwjF46mqmpK9kRllc4AlzszSbi4Nw222g1C3XTFOyQ9IoXENFjZkYDiUToSDxQYvaJufdIGgtlHXfwVqnD8SqKGopTWMbxXNa2QXDmM/iAtY36G/Pw1wrsqVo4TTVNNDIKyZs0r35i5t7e60c9tQT+K3kBERAREQEREEKVzpaWt4pfFVWBc72TyBOnLX9h :"Life_Insurance_Proposal_Automation.pdf","digest":"Section order: (1) Nav: Home, Physical AI, Agentic Suite, Solutions, Compliance, About Us, Sign In, \"Book a Demo\". (2) Hero: \"Live\" status pill + \"AI proposal automation · Life insurance\" eyebrow, H1, subcopy, dual CTAs, four benefit mini-cards (\"Your questionnaire, your logic\", \"Contradictions caught early\"), then a live proposal-form mock (PR-20931). (3) Capability chip strip: \"CRM & KYC pre-fill\", \"Discrepancy detection\", \"Customer review & consent\", plus \"Hindi · English · Hinglish\". (4) Problem: \"Everything depends on a form still filled by hand\", with paired pain/fix rows (Flattened, After submission) and a spaced-caps \"Regulatory context\" note. (5) How it works: 8 numbered steps (Pre-fill, Converse, Capture, Go deeper, Validate, Evidence, Confirm, Hand off). (6) Interactive replay demo. (7) Nuance capture and adaptive follow-ups. (8) Pre-fill and data model: \"Never ask what you already know.\" (9) Consistency checks. (10) Document intelligence. (11) Advisor nudges and a ready-to-submit gate.\n\nHeadlines and copy: Headlines split into a dark first clause and an accent second clause, for example \"Advisors talk.\" / \"Darwix completes the proposal.\" Others follow the same pattern: \"Complete is not enough.\" / \"It must be consistent.\" Headlines are short declaratives, often with a contrast. Eyebrows are spaced-out small caps, such as \"H o w it w or k s\". Each section has one line of subcopy. CTAs: \"Request a demo\" (primary) and \"Watch a proposal complete itself\" (secondary). Closing lines are punchy: \"Nothing is silently overwritten.\"\n\nSignature element: A \"Watch a proposal complete itself\" replay. It has a step tabs row (Confirm, Occupation, Income… Confirm & hand off) and a \"Synthetic data\" badge with a Replay button. The left panel is a Hinglish advisor/customer chat with \"Darwix captures…\" annotations. The right panel is a proposal form with fields that move from Pending to Pre-filled, Captured or Flagged, and ends on \"Customer confirmed v3 · OTP · 11:24 IST\".\n\nVisual motifs: Rounded cards with a source/value/timestamp footer (CRM · 11:02 IST). Status pills: Captured, Missing, Evidence pending, Confirmed, Pending, Matched, Queued. Chip rows for follow-ups, and Source A vs Source B vs \"Darwix flags\" tables. A provenance chain (Pre-filled → Customer-stated → Document-supported → Advisor correction → Final submitted). Numbered step cards, plus checklist and progress counters (\"1 of 8 checked\", \"1 of 9 clear\"). Mismatch callouts in amber or red, with green for confirmed.\n\nTone: Confident, precise and insurance-domain fluent. It uses real Indian specifics (₹, ITR, Hinglish quotes). It is compliance-aware (\"utmost good faith\"), outcome-focused, and stresses auditability and customer confirmation without hype.","thumb":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQwOEh4UEhEREiUbHBYeLCcuLisnKyoxN0Y7MTRCNCorPVM+QkhKTk9OLztWXFVMW0ZNTkv/2wBDAQ0ODhIQEiQUFCRLMisyS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0v/wAARCAHpAeADASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAECBAUDBgf/xABIEAACAQMCBAMDCAgEBAYCAwAAAQIDBBESIQUTMVFBYXEUIpEGFRYyUoGh0SNUVZKTscHwJEJT4XKCsvElMzZDRGI0c3TC0v/EABkBAQEBAQEBAAAAAAAAAAAAAAABAgMFBP/EAC4RAQACAQIFAwIEBwAAAAAAAAABEQIDIRITMUFRBBTwYeEiQlKBIzJxkaGx0f/aAAwDAQACEQMRAD8A/VSCTwvac61pWp0paZzg1F9ngClLiNnWr8mlcU5VPsp9TSfJW9jczq21CNlKjKlNOdV9Nnnr0+Bqlwji9O5uq1pfwpOrVlJJuUtUW8rKeVHHTZbo3njGPRIfSEHEdlxt1IJ8SpSotPmp0veby/qtLZY0rv18i1zw/iVxY3Fq7yEebKMY1FlShD/MljDz2efHy3wrskmHhNtc21GorytGtVnPU5Rzj6sV49N0395uAAAAAAAAAgk51W1vea50rrCcpe6/BN7eG/8AaKq14gnDF4mtScspdPLb1A6ZAOd7DcRqSqQu5ptt6Vut32fln8AOiDmK34lJKUriKbim49MPxS229dyfZL6cq+u5jicHGGM+5nG/h4IDpgy0KNeFs4TrfpfCaWe3g/Q0Qi4wScnJpbt+IFgYr6jdTqRq0K2lQi1oWfez+HbBnt7fiUkpVrrQmk9Gza8m8fHuB1MjJgo213BpTr6o6Gn7zznGM9N/6eZ507O+jS5XtEVHvqbkvLOPvyB1AY7OjdU1VVzX1qWNGP8AKvgaKEJwhipUdSWfrNJfggLgzX1CrWjDkz0SjLO7aX4dTwVvfY3uI5ls/Jd1t6/HyLEf er. The right policy.\" / \"Real consent.\" and \"The question is scripted. / The answer rarely is.\" Each has a one-line grey subhead. Eyebrows are small spaced caps (\"Regulatory context\", \"What the customer believes\", \"Checked against proposal\"). CTAs: \"Request a Video PIVC demo\" (primary), \"Watch a live PIVC\" (secondary). Feature items are terse noun phrases.\n\nSignature element: a live PIVC case card, \"PIVC-24817 Protection Plus Term Plan ₹1 Cr\", with \"Live 04:19\" and \"Hindi + English\". It has a customer video panel with \"Face present / Liveness passed / Face match passed\", consent timestamps, and a Field | Proposal | Customer said | Status table. Rows show \"Confirmed\", \"Mismatch\" (premium payment term 15 vs \"Bas 10 saal.\"), \"Checking…\" and \"Pending\". A High-severity alert reads \"difference recorded, not overwritten\". A second element is a proposal-vs-speech table with three columns: Customer says / Proposal records / Darwix flags.\n\nMotifs: white UI cards with mono IDs (PIVC-24817, DSC-0932), status pills (Confirmed, Mismatch, Pending, High, Material, Requires review), timestamps, key-value records, JSON-style tags (session.*, fields[]), chip clouds, side-tab layer selector, numbered steps 01–07, a Hindi/English toggle, and \"source · approved benefit illustration\" citations. Accent colours are inferred, not in the text: likely red/amber for mismatches and green for verified.\n\nTone: precise, compliance-minded, evidence-first and confident. Mixes insurer jargon (PPT, sum assured, rider, IRDAI) with Hinglish quotes. Stresses \"explainable\", \"audit-ready\", \"never invents an answer\", \"records disagreement instead of converting it into a false 'yes'\".","thumb":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQwOEh4UEhEREiUbHBYeLCcuLisnKyoxN0Y7MTRCNCorPVM+QkhKTk9OLztWXFVMW0ZNTkv/2wBDAQ0ODhIQEiQUFCRLMisyS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0v/wAARCAHpAeADASIAAhEBAxEB/8QAGwABA t repeat / Don't say.\n - Objective, topic priority and readiness.\n - Role views with dynamic depth.\n - Evidence status and sources.\n - Compliance and knowledge pack.\n8. Closing: Before / During / After continuity.\n\nCopy patterns:\n- Headlines are short declaratives. The first clause is dark and the closing clause is the accent: \"Walk into every meeting | already prepared.\"\n- Other examples: \"Remember your promises, | not just theirs.\" and \"What's changed, first.\"\n- Sub-lines are one plain sentence (\"Select a line to see its source. Synthetic data.\").\n- Eyebrows are letter-spaced small caps (\"P r i m a r y o b j e c t i v e\", \"Role view\").\n- CTAs are specific: \"Request a Pre Meet Intelligence Demo\" (primary) and \"See a brief\" (secondary).\n- Steps are numbered 01–08 with a bold label and a one-line description.\n\nSignature element: a fictional Indian collections case, \"Rohan M. · DPD 47 · ₹84,500 outstanding · Hindi\". Four source snippets (Collection call, Payment system, Service log, Ops notes) fold into one brief. Fields include What changed, Open commitments, Ask, Don't repeat and Watch-outs. Clicking a line reveals its source (\"₹25,000 by Friday: collection call, 18 Sep, 07:14\"). The page labels it synthetic data.\n\nVisual motifs:\n- White cards with a source label and timestamp.\n- Status pills: \"Live\", \"Ready with open items\" (readiness states Ready / Ready with open items / Preparation required).\n- Evidence tags: Confirmed, Customer-stated, Stale, Conflicting, Missing.\n- Source chips: CRM, LOS, LMS.\n- Label/value brief table.\n- Alert strip: \"Promise-to-Pay Not Fulfilled · Age 3 days\".\n- Numbered grids.\n- Colour: dark ink text, one accent colour, and green/amber/red status.\n\nTone: operational, precise and BFSI-literate. It uses real numbers, dates and ₹. It is confident but compliance-aware (\"Don't say: Approval is guaranteed\"; \"Meeting scheduled doesn't mean meeting ready\").","thumb":"data:image/jpeg;base64,/9  Newer\" badge). It is stepped by \"Finding 1 of 6\" with Previous/Next. The hero panel is a pool bar chart (5,000 accounts, 50% reconciled, then 3,120 / 612 / 288 / 214 / 356 / 241 across the six statuses).\n\nMotifs: status chips for six pool segments; classification badges (Agrees, Contextual, Conflict, Stale/Newer, Subsequent Event, Enriched, Missing/Quality); document-state pills (Available, Missing, Partial, Unreadable, Wrong account, Duplicate); three-column Seller → Evidence → \"✓ Adopted\" cards; quoted example findings in cards; High/Low confidence tags; \"BELOW THRESHOLD\" vs \"HIGH PRIORITY\" labels; field/value query table (HL-008174). Rupee lakh/crore figures, \"illustrative\" and \"Synthetic data\" captions, and a \"Boundary:\" disclaimer line.\n\nTone: precise, audit-grade, restrained and evidence-first. It is sober, uses finance and legal vocabulary, and avoids hype. It states limits openly (\"Darwix surfaces… Your legal team decides\").","thumb":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQwOEh4UEhEREiUbHBYeLCcuLisnKyoxN0Y7MTRCNCorPVM+QkhKTk9OLztWXFVMW0ZNTkv/2wBDAQ0ODhIQEiQUFCRLMisyS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0v/wAARCAHpAeADASIAAhEBAxEB/8QAGwABAAMBAQEBAAAAAAAAAAAAAAECBAMFBgf/xABGEAABBAECBAIHBQYDBwQCAwABAAIDEQQSIQUTMVFBYRQVIjJxgZEGkqGx0SNCUlRi8DNywRYkNFWCk/E2c7LhJkRDZIP/xAAZAQEBAQEBAQAAAAAAAAAAAAAAAQIEAwX/xAAnEQEAAgECBgEEAwAAAAAAAAAAARECAxIEFCExUVITIkFhsTKB8P/aAAwDAQACEQMRAD8A/VVClcM2N82JNHE7S97CGnsaQUi4jhzT8mLIjdJ/CD1WlfJY+DkvlxoG4ToXRPBfKemxvr0+i1O4RxePJypsTPZEZZXOAJc7U0mxYNhtdNhuFvPGMeyQ+kULxDhcbMjAeJROhIPNBi9omz7pA2FaR36+Stk8P4lkYORinMY3mua1sgsOYz94CqN9jfj5b4V7KlYeE42TjQyDMmbNK9+oubde60ePTcE/NbkBERAREQEREEKV50uLm80viyqBc72T4Anbw3/sKoxeIAsrMBGoF1gdPLb4oPTUIvO9ByWyGRmU8EknTdjc9j5X+CD0UXmDH4k6nOyGgloJb0o1uBtt8d1Poue50+vJbpewtZV+xdb+HgEHposuPDO3GLJJv2vg8C+3gfgtDGlrAC4uIG5PigsixZ0OU+RssE2kMaRoF+1f4dqWfHx+JOAdNlaAQDo2JHkTX17oPUtLWCHGy2EB8+pugg+0buqvpv8A6ea5x4ec2LlekNDe+olw8rr52g9RFjw4cq mo. (6) \"Sherpa for BFSI\": \"Wearable Gen-AI for the frontline.\" Alternating feature rows numbered \"01 · Live transcription & summary\", \"02 · Coach & FAQ intelligence\", \"03 · Auto-KYC & Compliance\". Each row has a left text block with ✓ bullets and a right product mockup. (7) \"Sherpa AI capabilities\": \"Eight named AI services. One device. One brain.\" as an accordion of 01–08 rows with \"+\" toggles (Agent Assist, Redact AI, Verify AI, Commit AI, Sentinel AI, Audit AI, TrackBot AI, Score AI). (8) \"Built for FIELD CALLS\": \"Scenarios already in production.\" with two use-case cards (HNI Wealth Management, NPA & Collections).\n\nHeadline pattern: a two-line split. A dark, declarative first line is followed by an accent-coloured second line, e.g. \"The right answer. / In the right moment.\" and \"Verify, in conversation. / Not in a queue.\" The rhythm is a noun phrase, then a contrast phrase. Eyebrows are letter-spaced uppercase labels with a spaced-out feel (\"A N A T O M Y O F S H E R P A\", \"BUILT for FIELD CALLS\"). Numbered \"01 ·\" prefixes are used throughout. The CTA is the imperative \"Book a demo\". Copy is full of product verbs and numbers (Capture, Assist, Analyze, Improve).\n\nSignature element: the accordion of eight named AI services. Opening one reveals a mock \"ATHENA: Eligibility Review & Compliance\" checklist. Supporting it is a call-playback mockup with an Agent/Customer Hinglish transcript, a 00:00–03:30 timeline and Transcription / Call Summary tabs. The summary shows labelled blocks such as \"Plans to be Pitched\" and \"Key Differentiators\". The noise demo uses dB bars (AWG input 67 dB, noise floor 42 dB, cleanout 25 dB) with metric chips \"SNR +18 dB\", \"NER 2.1%\", \"SPK-SEP 98.4%\".\n\nVisual motifs: rounded white cards on a light background, pill chips and tags, ✓ lists, a mono-style metric strip, and outcome stats in green (\"+22% wallet share\", \"+34% recovery rate\"). The mockups are phone- or app-like UI panels.\n\nTone: confident, enterprise-BFSI, specific and metric-led. It uses short fragments (\"Agent voice clear.\"), Indian-market references (RBI, RERA, Hinglish, 11 Indic languages) and an operational, compliance-aware voice.","thumb":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQwOEh4UEhEREiUbHBYeLCcuLisnKyoxN0Y7MTRCNCorPVM+QkhKTk9OLztWXFVMW0ZNTkv/2wBDAQ0ODhIQEiQUFCRLMisyS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0v/wAARCAH0AeADASIAAhEBAxEB/8QAGwABAQADAQEBAAAAAAAAAAAAAAECAwQHBQb/xABNEAABAwIEAgQLBgQBCgUFAAABAAIDBBEFEiExQVETFGGTBhUWIlJVcZGSodEyU1SBsfAjQsHhciQzNkNlc3SjsvEHJjQ1YiVFdaLC/8QAGQEBAQEBAQEAAAAAAAAAAAAAAAECAwQF/8QALhEBAAEEAQQBAwMDBQEAAAAAAAECAxESURQVIWExBJHwE0FSMqGxIjOBweHx/9oADAMBAAIRAxEAPwD1Va554qdmeaRsbebjZbF+Xx6zsZibVEiDIMtvb51u1bop2nCS/RwVEVQzPDIyRvNpuFtX5fBPNxacUhd0HRm//wDN+1cVHifhDSUPSdUqqsmNmbrMNnNlyuL2gNAJaSGgE7EncJXTrOCH7VF+ZqMZxyCNsowczte+TzI8wcxrXcb8XNuR22XTHW4pFNG2WlLmySBshDXER6M1Fhq25cOfHZZiMq+6i/J4rW48K6vdSU1T1XoXw05axptIG5g8DfU3btbQL9W3YKCoiICIiAi1zmQR3iAL7jQ+0X+S5DPXZi0Qt0vqb2Qd6LlpZqmSR7Z4RG1v2SDuupARcta+dgZ0AJN9QBe60tnrs7WOgZawu/W3bog+gi4aapqZZIw6C0bhcusRw/YXcgItVQ6RsRdE3M5uuX0uxcjJ6wWD4dtC4N/px/v2IPoIvn9YrXRMd1fK4POZoP8AKPb+9FhDWVk7vMhbkvbOQbe5B9NFx081U6VrZYrNN7m23JdiAi1VJlEf8G2fMN9rX1+S5Iqitc3zoA0gXId+mh3/AEQfQRcEs1YyUhsQc3hbW99h8t+0KtqKvPG0waF1nE8Bz7efyQdyL5b6ysiIaYLue45GniOWm1ltbPWlrXGFrbnUWJ4IO9FqpnvfCx0rcjyNRyW1ARcM8tXHMckeeMk2IG2g9+v70VinqnTsbJT5GG+Z172QdqItNW6VsDugF5To3s7UG5F84VNbranvroCLflv810U0sskr+kYWMsMt22PG9/kg6UREBERAREQFqlmDHZQ1z3WvZovotq1N/wDUSf4W/qUGHWHfh5vhH1TrB/DzfCPquepqaqKodkiL4g2/2be3VYw1tTPC6RkILSDkIvqQRz56+5a18ZR1dYP3E3wj6qVFbBTUbqqZ4bCwXLiPy253WVM+WSMmaMMcDsNjoD/b8l8Twt/0bn/3o/61q3RFVcU8ySy8scJ+8l7op5Y4T95L3RX4KijgkkcKh+VuXQ5ra3XQ2ipLjNWNtxOmnbp7+zivpT9JZpnE5Y2l+18scJ+8l7op5Y4T95L3RX4eOmp8rXOnaSZC3JmA0sbG/DUD3rN1JRBod1vf+VtiR2X4+3inSWPf5/wbS/a+WOE/eS90V9TDMTpcUhMtJJna05XAixB7QvLqmCGONropxIXHUaaBfrv/AA8/9NW/7xv6Llf+lt0Wt6crTVMzh+vREXzmxaKqkgq2ZKiJsjeThsp1Om/DxfAE6nTfh4vgCfAtNSQ MaJdGLgVBbRLoxol0YuBUFtEujGiXRi4FQW0S6MaJdGLgdAAPNQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAB//Z"},{"id":"w-Voice_Automation","name":"Voice_Automation.pdf","digest":"SECTION ORDER: (1) Sticky nav: Voice playground, Capabilities, Parallel dialing, Post-call actions, Languages, Pricing + \"Book a Demo\". (2) Hero: headline, one-line subhead, single CTA \"Create your agent\", then a 6-stat strip (22 languages, 1,200+ parallel dials/second, <400ms latency, 94% objection handled first-try, 30+ post-call triggers, 4hr context). (3) Voice Playground: filter row (Industry/Product/Use Case/Language) plus \"Surprise me\", \"Request a demo\", \"Play Sample\". (4) Popular samples grid, 9 of 240, \"Browse library →\". (5) Capabilities: six cards. (6) Parallel Dialing: big numbers plus live call stream. (7) Languages & Accents: tile grid. (8) Post-call actions: timeline plus trigger rows. (9) Integrations logo wall. (10) \"Put your own number in. Get a call in 30 seconds\" phone input with \"Call me\". (11) Request a Demo form (name, company, email, phone, use case) and India Office footer.\n\nHEADLINE PATTERNS: Each headline splits into a dark part and an accent-coloured part, and the line breaks mid-thought: \"An AI Agent\" / \"that actually holds the line\"; \"Not one call. Ten thousand, simultaneously.\"; \"Every state. Every dialect.\"; \"The call ends. The work begins automatically.\"; \"Six things most voice bots fake. Darwix actually does them.\" Pattern: a short claim, then the payoff or contrast. Eyebrows are small spaced-out ALL-CAPS labels (\"VOICE PLAYGROUND\", \"CAPABILITIES\", \"LANGUAGES & ACCENTS\"). A one-line grey subhead follows each headline, usually with a proof point (\"benchmarked quarterly against human agents\"). CTAs are verb-first and low friction: \"Create your agent\", \"Play Sample\", \"Call me\", \"See the dialer live →\", \"Full language matrix →\".\n\nSIGNATURE ELEMENT: The Voice Playground is a live call player. It has a \"Now Playing\" header (BFSI, Loan-against-property · Welcome call) with language and gender chips, a scrubber (01:16 / 02:48), and a timestamped transcript. Transcript turns are tagged \"tone · warm\", \"objection detected\" and \"Trigger: EMI shift · 7→10\". A side panel shows customer sentiment (Hesitant → Resolved), detected intents with confidence % (94%, 88%, 97%), and \"Actions queued post-call\" (WhatsApp, CRM, RM email). Second visuals: the live call stream (timestamp, +91 number, city, ● DIALING/RINGING/CONNECTED) and the call timeline ending \"→ 6 actions fire in <2s\".\n\nVISUAL MOTIFS: Rounded white cards on a light background. Mini-visualisations inside capability cards: objection → response → % tables, a waveform with F0/Jitter/MOS stats, a 3-call context timeline. Small chips for language, gender and industry. Green \"WIRED\" status badges with ⚡ trigger rows. Native-script language tiles (हिन्दी, தமிழ) with speaker counts and accent counts. A logo wall of integrations. Monospace-style numerals.\n\nTONE: Confident, technical, proof-driven, India-first. Benchmarks and specifics replace adjectives (Indian enterprise calls, ₹, TRAI, DND). Slightly combative toward generic voice bots (\"most voice bots fake\").","thumb":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQwOEh4UEhEREiUbHBYeLCcuLisnKyoxN0Y7MTRCNCorPVM+QkhKTk9OLztWXFVMW0ZNTkv/2wBDAQ0ODhIQEiQUFCRLMisyS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0v/wAARCAH0AeADASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAEDAgQFBgf/xABJEAABAwIEAwMJBQcDAQYHAAABAAIDBBEFEiExE0FRFCJhBjJTVHGBkZLRFVKhscEWIzNicpPwJELhNDVDc6LC8QclNmR0grP/xAAaAQEBAQEBAQEAAAAAAAAAAAAAAQIDBAUG/8QALREBAAIBAwIFAgUFAAAAAAAAAAECEQMSIQQxExRBUfBSoSJhgZHxMjNxwdH/2gAMAwEAAhEDEQA/APqirmnip2Z5pGxt6uNlYvMY9Z2MxNqiRBkGW3t71vFbpXdOEl6OCoiqGZ4ZGSN6tNwrF5jBO7i04pC7gcM3/wDTfxWjSYn5Q0lDxOyVVWTGzN2mEhzZcri9oDQCWkhoBOgJO4S9ds4Ie1ReaqMZxyCNsowczh7pO5HmDmNY7nfm5tyPGy2Y63FIpY2y0xc2SQNkIa4iLRmosNW3Lh157LMRlXcRe <script>/* Darwix landing-page engine: PRD markdown -> structure -> lint -> page HTML.

(function (root) {
'use strict';

/* ------------------------------------------------------------------ tokens */
var DEFAULT_TOKENS = {
  primary: '#565ADD', primaryHover: '#4F4FE8', primaryPressed: '#4344B8', tint: '#EEEFFF', tintBorder: '#DCDDFB',
  gradientEnd: '#7B7EF0', ink: '#111111', heading: '#2B2B2B', body: '#515153', muted: '#686868', faint: '#949395',
  border: '#E6E7F0', subtle: '#F1F1F1', page: '#FFFFFF', alt: '#FAFAFB', slate: '#F4F5F9', navy: '#1B1F3B',
  success: '#17AA2E', warning: '#C98A00', error: '#D93A3A',
  font: 'Manrope', mono: 'JetBrains Mono', radiusCard: 14, radiusButton: 10, container: 1180, sectionPad: 96
};
var TOKEN_HEX = ['primary','primaryHover','primaryPressed','tint','tintBorder','gradientEnd','ink','heading','body','muted','faint','border','subtle','page','alt','slate','navy','success','warning','error'];
function mergeTokens(over) {
  var t = {}, k;
  for (k in DEFAULT_TOKENS) t[k] = DEFAULT_TOKENS[k];
  if (over) for (k in over) {
    if (!(k in DEFAULT_TOKENS)) continue;
    var v = over[k];
    if (TOKEN_HEX.indexOf(k) >= 0) { if (typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v.trim())) t[k] = v.trim().toUpperCase(); }
    else if (k === 'font' || k === 'mono') { if (typeof v === 'string' && /^[A-Za-z0-9 ]{2,40}$/.test(v.trim())) t[k] = v.trim(); }
    else if (typeof v === 'number' && isFinite(v) && v >= 0 && v <= 2000) t[k] = v;
  }
  return t;
}

/* ------------------------------------------------------------------ helpers */
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
var FLAG_RE = /\s*\((?:state(?: them)? on (?:the )?page|Legal to review|state on page)\)/gi;
function cleanFlags(s) {
  return String(s || '')
    .replace(/\*\(Synthetic data\.?\)\*/gi, '')
    .replace(/\*\(Confirm[^)]*\)\*/gi, '')
    .replace(/\(Confirm[^)]*before publishing\.?\)/gi, '')
    .replace(FLAG_RE, '')
    .replace(/\s*\(scrolls to §\d+\)/gi, '')
    .replace(/\bScript below\.\s*/gi, '')
    .replace(/\s{2,}/g, ' ').trim();
}
function inline(s) {
  s = esc(cleanFlags(s));
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[\s(>"“])\*([^*\n]+?)\*(?=$|[\s).,;:!?"”<])/g, '$1<em>$2</em>');

  if (a.length >= 3) { var m = a[0].match(/^([A-Z][^:]{12,}?):\s+(.+)$/); if (m && m[1].split(' ').length >= 3) a[0] = m[2]; }

function isDesignNote(s) {

/* ------------------------------------------------------------------ parser */
var FIELD_A = /^\*\*([^*]+?):\*\*\s*(.*)$/;      // **Label:** text
var FIELD_B = /^\*\*([^*]+?)\*\*:\s*(.*)$/;      // **Label**: text

      var m;
      if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { var lv = m[1].length, t = m[2], n = t.match(/^(\d+)\.\s+(.*)$/); if (lv === 2) out.push('<h2>' + (n ? '<span class="sn">' + n[1] + '</span>' + inl(n[2]) : inl(t)) + '</h2>'); else out.push('<h' + lv + '>' + inl(t) + '</h' + lv + '>'); i++; continue; }
      if (/^---+\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
      if (/^\|/.test(l)) { var rows = []; while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; } var cells = function (r) { return r.replace(/^\||\|\s*$/g, '').split('|').map(function (c) { return c.trim(); }); }; var head = cells(rows[0]), body = rows.slice(2).map(cells); out.push('<div class="tw"><table><thead><tr>' + head.map(function (c) { return '<th>' + inl(c) + '</th>'; }).join('') + '</tr></thead><tbody>' + body.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + inl(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>'); continue; }
      if (/^\s*[-*]\s+/.test(l)) { var it = []; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { it.push(lines[i].replace(/^\s*[-*]\s+/, '')); i++; } out.push('<ul>' + it.map(function (x) { return '<li>' + inl(x) + '</li>'; }).join('') + '</ul>'); continue; }
      if (/^\s*\d+\.\s+/.test(l)) { var it2 = []; while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) { it2.push(lines[i].replace(/^\s*\d+\.\s+/, '')); i++; } out.push('<ol>' + it2.map(function (x) { return '<li>' + inl(x) + '</li>'; }).join('') + '</ol>'); continue; }
      if (/^>/.test(l)) { var q = []; while (i < lines.length && /^>/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, '')); i++; } out.push('<blockquote>' + inl(q.join(' ')) + '</blockquote>'); continue; }
      var p = [l]; i++; while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#|\||---|\s*[-*]\s|\s*\d+\.\s|>|\*\*[^*]+:\*\*|\*\*[^*]+\*\*:)/.test(lines[i])) { p.push(lines[i]); i++; }
