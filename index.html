shed page |\n| `(Legal to review)` | Regulatory or legal wording that needs sign-off |\n| `*(Confirm ... before publishing.)*` | A claim that is not yet verified |\n| `*(Synthetic data.)*` | Demo data is invented |\n\n---\n\n## Part B. Content Elements\n\nEvery PRD is built from the following elements. Each section specification in Parts E and F refers to them by name.\n\n| Element | Format | Rules |\n|---|---|---|\n| **Eyebrow** | `**Eyebrow:** CATEGORY · BUILT FOR AUDIENCE` | ALL CAPS. Category descriptor, then the industry or user it is built for |\n| **Headline** | `**Headline:** ...` | One claim. Usually 6–14 words. One or two short sentences |\n| **Subhead** | `**Subhead:** ...` | 1–2 sentences. Usually opens \"Darwix [Full Product Name] ...\" and lists what it does in workflow order |\n| **Capability line** | `**Capability line:** A · B · C` | 6–9 Title Case capability names in workflow order |\n| **Proof strip** | `**Proof strip:** A · B · C · D` | Exactly 4 short proof statements, each up to ~9 words |\n| **CTA pair** | `**CTAs:** Primary: **...**. Secondary: **...** (scrolls to §4).` | Primary requests a demo. Secondary jumps to the signature demo |\n| **Copy** | `**Copy:** ...` | One paragraph, 50–130 words, concrete and example-led |\n| **Pain strip** | `**Three-line pain strip:**` + 3 bullets | Each bullet: `**Label:** one line` |\n| **Regulatory context line** | `**Regulatory context line (Legal to review):** ...` | Optional. One or two sentences of regulatory framing |\n| **Closing line** | `**Closing line:** ...` | One sentence that lands the section. Used in Problem, Signature, sometimes Impact |\n| **Supporting line** | `**Supporting line:** ...` | One sentence that restates the section's claim. Ends most capability sections |\n| **Flow steps** | Numbered list: `1. **Label:** one line` | 5–8 steps, introduced as \"N steps as a horizontal flow, one line each:\" |\n| **Flow line** | `**Flow line:** A → B → C` | 3–6 nodes |\n| **Table** | Markdown table | 2–4 columns, 4–8 rows |\n| **Record card** | Two-column table with an empty header `\\| \\| \\|`, or a first row naming the record | 5–8 rows. Used for findings, alerts, queries, field lineage |\n| **Blocks** | `**a) Title:** text` or bold-titled paragraphs | 2–4 blocks, introduced as \"Two blocks:\" / \"Three blocks:\" |\n| **Cards** | Bullets: `- **Name:** one line. *Example.*` | 4–8 cards, introduced as \"N compact cards, one line each:\" |\n| **Status list** | Italic states separated by ` · ` | 5–9 states |\n| **Example** | `**Example:**` or an italic scenario | Concrete, synthetic, specific numbers |\n| **Aphorism** | Italic one-liner | Usually \"*X doesn't mean Y.*\" or \"*Don't confuse X with Y.*\" |\n| **Boundary lines** | `**Boundary (state on page):**` or `**Principles (state on page):**` + bullets | What the product does not do |\n| **Value tiles** | Bullets: `- **Bold headline:** one line` | 6–8 tiles. No numbers |\n| **Operational visibility line** | `**Operational visibility (one line):** ...` | Metrics the product can report, not claimed results |\n| **Pillars** | `**Pillar** (gloss) · **Pillar** · ...` | 8 pillars, one or two words each |\n| **Configurable list** | `**Configurable:** A · B · C` | 8–14 items |\n| **Integration lists** | `**Connects to:**`, `**Reads:**`, `**Returns:**`/`**Writes:**`, `**Events:**` | ` · ` separated, or one sentence each |\n| **Governance tiles** | Bullets: `- **Label:** one line` | 5–8 tiles |\n| **Badges** | Fixed line | `**Badges:** SOC 2 Type II · ISO 27001 (as on the Compliance page) · link to Compliance` |\n| **FAQ list** | `N. **Question?** Answer.` | 8–15 items, 1–3 sentence answers |\n| **Form line** | Fixed line | `**Form:** Reuse the site's standard \"Request a Personalized Demo\" form and value bullets.` |\n| **Open item** | Bullet: `- **Label:** text` | One concrete decision or verification each |\n\n---\n\n## Part C. Header Block\n\n```markdown\n# PRD: Darwix AI [Product Name] Page\n\n**Scope:** Content of the [Product Name] page only. Navigation, entry points, layout and visual design are out of scope.\n**Version note:** [Only when this page reframes or overlaps an existing page: what it shares, how it differs, which one to publish.]\n**Audience:** [Primary buyer titles] at [institution types]. [Secondary reader] are the secondary reader.\n**What the product is:** [Category noun phrase: \"A [real-time / cross-source / conversation-to-X] [layer / agent / platform] for [domain].\"] [What it does, in workflow order, in 1–2 sentences.]\n**Page goal:** Make the reader believe one thing: *[one belief, in the form \"the commodity does X; Darwix does Y, with proof/control.\"]*\n**Positioning guardrails (state them on the page):**\n- Not [commodity A], [commodity B] or [commodity C]. [What it is instead, one clause.]\n- [Decision boundary: what Darwix does, what it never does, who keeps the decision.]\n**Voice:** Match darwix.ai: confident, short, outcome-led[, domain nuance such as \"in ARC diligence language\" or \"calm and clinical-grade, never hype\"]. Every section leads with a claim, then proof.\n\n---\n```\n\n**Rules**\n- **Audience** names real titles (Chief Credit Officer, Head of Collections, CMO) and real institution types (banks, NBFCs, HFCs, insurers, ARCs, hospital groups).\n- **What the product is** never uses hype adjectives. It names the category and the sequence of work.\n- **Page goal** is a single belief. Most use a tension: commodity vs Darwix, data vs context, extraction vs reconciliation.\n- **Positioning guardrails** are exactly two bullets, or a single guardrail paragraph when there is one dominant boundary (e.g. \"Darwix is not an AI doctor...\").\n- **Version note** appears only for variants, and triggers a \"One page or two\" open item.\n- **Normalisation note:** the three earliest PRDs (Auto PD, Video PIVC, Video Tele-Medicine) omit **What the product is**, and Video PIVC also omits the guardrails, the §4 context block and the `*(Synthetic data.)*` marker. The six later PRDs include all of them. This structure follows the later, complete form, and every new PRD includes every header field.\n\n---\n\n## Part D. Page Skeleton\n\n| Position | Section | Required | Notes |\n|---|---|---|---|\n| 1 | Hero | Yes | Part E1 |\n| 2 | The Problem | Yes | Part E2 |\n| 3 | How It Works, or a framing section | Yes | Part E3. Sequential steps, or layers / phases / lenses |\n| 4 | Signature Section | Yes | Part E4. The scripted demo |\n| 5 to n−6 | Capability sections | 8–12 sections | Chosen from the module library, Part F |\n| (inside the run) | Second signature section | Optional | A pool view or an end-to-end story |\n| n−5 | Control section | Yes | Part E5. \"Darwix does / Owner controls\" |\n| n−4 | Configuration, Integrations, Security & Governance | Yes | Part E6. One section, or split into two |\n| (optional) | Analytics | Optional | Module F31 |\n| n−3 | Business Impact | Yes | Part E7 |\n| n−2 | Why Darwix | Yes | Part E8. May merge with Business Impact |\n| n−1 | FAQ | Yes | Part E9 |\n| n | Closing CTA Block | Yes | Part E10 |\n| Unnumbered | Open Items to Confirm Before Publishing | Yes | Part E11 |\n\n### D1. Order of capability sections\nCapability sections follow a fixed narrative arc. Skip stages that do not apply; never reorder them.\n\n1. **Core differentiator:** the one thing the commodity cannot do (meaning over keywords, classification, disclosure nuance).\n2. **Depth:** what the product understands, captures or compares.\n3. **Real-time and assist:** what happens while the interaction is still live.\n4. **Trust:** proof, lineage, source tags, values never overwritten.\n5. **Gaps:** missing, stale and newly discovered information.\n6. **Prioritisation:** materiality, severity, confidence, routing.\n7. **Resolution:** clarification, review, human-in-the-loop.\n8. **Outputs:** states, outcomes, readiness gates, packs.\n9. **Action and continuity:** workflow triggers, handoffs, resume, cross-channel.\n10. **Breadth:** journeys, products, roles, specialties.\n11. **Control mechanics:** configurability, rules plus AI, guardrails. These sit directly before the Control section.\n\n---\n\n## Part E. Fixed Section Specifications\n\n### E1. Hero (`## 1. Hero`)\n\n**Elements, in order:** Eyebrow · Headline · Subhead · Capability line · Proof strip · CTA pair.\n\n| Element | Specification | Examples from existing PRDs |\n|---|---|---|\n| Eyebrow | `[CATEGORY] · BUILT FOR [INDUSTRY / AUDIENCE]` | AI PERSONAL DISCUSSION · BUILT FOR LENDING · REAL-TIME ALERT INTELLIGENCE · BUILT FOR BFSI · PRE-MEETING INTELLIGENCE · BUILT FOR BFSI FRONTLINES |\n| Headline | One of five formulas below | \"The borrower speaks. The PD builds itself.\" |\n| Subhead | \"Darwix [Product] [verb]s X, [verb]s Y, [verb]s Z, and [verb]s W.\" | \"Darwix Auto PD listens to the conversation..., fills your PD form as they talk, flags what doesn't match...\" |\n| Capability line | 6–9 capabilities in workflow order; include the language capability where relevant | LOS Pre-Fetch · Live Form Filling · Hindi-English-Hinglish · Discrepancy Detection · Evidence Triggers · Officer Nudges · Workflow Actions |\n| Proof strip | 4 items: a \"how it's different\" claim, a traceability claim, an integrity claim, a control claim | Fills out of sequence, as the conversation flows · Every field carries its source · Original application values never silently overwritten · Lender keeps every credit decision |\n| CTA pair | Primary: **Request a [Product] Demo**. Secondary: **See / Watch [signature moment]** (scrolls to §4) | Secondary: **See a PD fill itself** (scrolls to §4) |\n\n**Headline formulas**\n1. **Actor acts, outcome follows:** \"The borrower speaks. The PD builds itself.\" / \"Advisors talk to customers. Darwix completes the proposal.\"\n2. **Triple imperative:** \"Verify the customer. Verify the policy. Verify informed consent.\"\n3. **Outcome in time:** \"Know what needs attention while there's still time to act.\" / \"Walk into every customer meeting already knowing what matters.\"\n4. **Tension, then resolution:** \"Every source says something different. Darwix tells you what's true, and shows the proof.\"\n5. **Single imperative:** \"Verify the asset behind the seller tape.\"\n\n### E2. The Problem (`## 2. The Problem: [Reframing Title]`)\n\n**Elements, in order:** Headline · Copy · Three-line pain strip · Regulatory context line (optional) · Closing line.\n\n- **Title:** reframes the problem in one punchy line. \"The Best Hour in Credit Is Spent on Data Entry\" · \"'Yes' Is Not Understanding\" · \"Video Solved the Connection. Not the Consultation.\" · \"You Don't Have an Alert Problem. You Have an Attention Problem.\"\n- **Headline:** names the hidden cost. \"More notifications didn't make anyone act faster.\"\n- **Copy:** opens with a chain of 3–6 concrete, specific failures (with quoted customer speech where useful), then states the consequence and when it gets discovered (too late, by the wrong person, without proof).\n- **Pain strip:** three bullets in one of two patterns:\n  - **Workflow products:** `Before / During / After`, or `During the X / After the X / At review`.\n  - **Volume products:** `Too many / Too little time / Too little proof`, or `Too late / Too noisy / No follow-through`.\n- **Regulatory context line:** only when a named regulator or legal principle frames the problem (IRDAI on PIVC, utmost good faith, \"as is, where is\"). Always marked `(Legal to review)`.\n- **Closing line:** a two-part motto or a from-to line. \"Let the officer run the discussion. Let AI build the PD.\" · \"From video call to documented, actionable care journey.\"\n\n### E3. How It Works or Framing (`## 3. ...`)\n\nChoose one form.\n\n| Form | Use when | Title pattern | Body |\n|---|---|---|---|\n| **Sequential flow** (default) | The product runs a pipeline | \"How [Product] Works\" / \"How It Works\" | Headline \"From [input] to [output].\" + 6–8 flow steps |\n| **Layers** | Value is several parallel assurances | \"One [Unit]. [N] Layers of [Assurance].\" | Table: `# · Layer · Promise · Proof points` |\n| **Phases** | Value spans before, during and after an interaction | \"One [Unit]. Three Phases. Zero Blind Spots.\" | Three columns: **BEFORE / DURING / AFTER**, each a short title and 3 bullets |\n| **Lenses** | Value is several angles on the same object | \"Two Lenses. One [Case].\" | Two or three bold blocks, each a question it answers |\n\n**Rules**\n- Flow steps start with a bold verb or noun label: `1. **Pre-fetch:** ...`. The first step names the input and systems. The last step names the output and where it goes.\n- A step may carry one italic aside: *First diligence question: do we have the evidence for this account?*\n- If §3 uses Layers, Phases or Lenses, a sequential \"How It Works\" section may appear later (as section 5).\n\n### E4. Signature Section (`## 4. Signature Section: [Title]`)\n\n**Elements, in order:** Headline · Format · Context block · Demo table · Then · Closing line.\n\n- **Title:** names the demo. \"Watch a PD Fill Itself\" · \"One Sentence. One Alert. Three Actions.\" · \"One Account, Eight Sources, One Answer\".\n- **Headline:** \"Watch [a specific thing] [happen].\" / \"See what [the user] knows before they [act].\"\n- **Format:** one or two sentences describing the visual (left and right panels, colour codes such as *pre-filled*, *captured*, *flagged*), then \"Script below.\" and `*(Synthetic data.)*`.\n- **Context block:** what is already known before the demo starts, as a bold-labelled line of `·`-separated values. `**Pre-fetched from LOS before the PD starts:** Home Loan · ₹42 lakh · Self-employed · ...`\n- **Demo table:** 5–8 rows. Column patterns by product type:\n\n| Product type | Columns |\n|---|---|\n| Conversation capture | Moment · What's said · What Darwix does |\n| Verification | Customer says · Proposal records · Darwix flags |\n| Evidence / reconciliation | Field · What the evidence shows · Darwix finding |\n| Alert / signal | Step · What happens |\n| Preparation / brief | Section · Content |\n\n- **Row rules:** each row demonstrates one capability the page later explains. Findings appear as **Bold Title Case Name** with severity where relevant. Include at least two flagged items. For evidence products, include at least one item that is *not* a problem (a variant, a timing difference) to prove discrimination.\n- **Then:** what happens after the demo: confirmation, resolution, handoff, re-run.\n- **Closing line:** \"The [user] had one [conversation]. Darwix produced the [A], the [B] and the [C].\" or \"The [product] didn't just [commodity action]. It [real outcome].\"\n- **Reuse:** later sections reuse this case (same IDs, names and numbers) for continuity.\n\n### E5. Control Section\n\n- **Title formulas:** \"[Darwix verb] the X. [Owner] Decides Y.\" · \"[Role] Control: What AI Does and What It Never Does\" · \"Detect Early. Decide Responsibly.\" · \"Prepare the Professional. Don't Replace Them.\" · \"Your [X]. Your Rules. Your [Decision].\"\n- **Headline:** \"AI [prepares / builds] [the work product]. The [owner] [makes / owns] the [decision].\"\n- **Table:** `| Darwix does | The [owner] controls |`. Left column: 6–8 verbs of preparation (retrieves, extracts, detects, drafts, prepares, triggers configured, routes, records). Right column: the accountable decisions of that domain (sanction, underwriting, claims, diagnosis, prescribing, pricing, legal sufficiency, fraud classification, final approval). Unequal lengths are fine: leave cells blank.\n- **Boundary lines (state on page):** 1–3 bullets. Standard patterns:\n  - \"An [alert / finding] is a [signal / finding for review]. It isn't a [determination] of [fraud / non-compliance / outcome].\"\n  - \"[Opportunities] come from explicit need or approved logic. No speculative profiling.\"\n  - \"[Analytics] show [workflow / data] quality. They are not a score of [employee competence / the seller / clinical quality].\"\n  - \"Darwix does not replace [emergency services / the approved KYC process].\"\n\n### E6. Configuration, Integrations, Security & Governance\n\nMay be one section or split into \"Configured to Your [X]\" and \"Integrations, Security & Governance\".\n\n**Elements, in order (use what applies):**\n1. `**Configurable:**` 8–14 items.\n2. `**Example:**` optional conditional-logic example.\n3. `**Connects to:**` / `**Integrates with:**` / `**Ingests from:**` the systems list.\n4. `**Reads:**` (before or during) and `**Returns:**` / `**Writes:**` (after).\n5. `**Events:**` optional, events available to downstream workflows.\n6. `**Governance tiles:**` 5–8 from the standard pool below.\n7. `**Full audit trail:**` optional, a list of what is logged.\n8. `**Badges:**` fixed line.\n9. Optional one-liner on what happens after the main event (e.g. \"**After the bid (one line):** ...\").\n\n**Standard governance tile pool**\n| Tile | Typical line |\n|---|---|\n| Deployment and residency | On-prem, VPC or cloud, with [client]-defined data location and retention |\n| Encryption / data protection | [Data types] protected in transit and at rest |\n| Role-based access | [Data types] visible only to authorised users |\n| Need-based / purpose-limited access | Only the data the workflow is authorised to read |\n| PII / sensitive-data protection | Configurable masking and redaction |\n| Consent and traceability | Consent events preserved with the session or version |\n| Source integrity / traceability | File identity, version and lineage preserved |\n| Full audit trail | Sources, changes, findings, actions and approvals traceable |\n| Controlled write-back | Define what updates which system and what needs review |\n| Rule and model governance / controlled AI | Logic, thresholds, knowledge and versions under client control |\n| Recording controls | The client decides whether to record, what to retain and who can view it |\n| Reproducible after the event | Reconstruct why a value was adopted, months later |\n\n### E7. Business Impact (`## N. Business Impact`)\n\n- **Headline:** a contrast pair or triple. \"Less time X. More time Y.\" · \"Fewer alerts to watch. More alerts worth acting on.\" · \"Faster proposals. Better disclosures. Fewer downstream clarifications.\"\n- **Value tiles:** 6–8, `**Verb phrase:** one line`. No numbers.\n- **Operational visibility (one line):** the metrics the product can report. Add a disclaimer when metrics could be read as judging people (\"for process visibility. Not a score of clinical quality.\").\n- **Closing line:** optional. \"Reduce PD effort without reducing PD depth.\"\n\n### E8. Why Darwix (`## N. Why Darwix` or `## N. Why Darwix for [Product]`)\n\n- \"Eight pillars, one line each:\" then `**Pillar** (optional gloss) · **Pillar** · ...`.\n- Pillars are one or two words, mostly \"-aware\", \"-native\" or \"-linked\" adjectives. The last pillar is always the control pillar (\"Traceable & lender-controlled\", \"Human-controlled and audit-ready\", \"Pool-aware and ARC-controlled\").\n- **Supporting line:** \"Not [commodity]. [Category claim].\" (\"Not document AI. Decision-grade evidence intelligence.\") or a verb chain (\"Pre-fetch. Listen. Structure. Verify. Evidence. Act.\").\n- May merge with Business Impact as \"Business Impact and Why Darwix\".\n\n### E9. FAQ (`## N. FAQ`)\n\n8–15 items. Fixed positions:\n1. **What is Darwix [Product]?** A category definition matching the header block.\n2. **Is it just / Is it [commodity]?** \"No. [Commodity] is one input / one part. The product ...\"\n\nThen, in this order: one question per major capability · contradiction and new-evidence handling · **Does it make the [accountable decision]?** (\"No. ...\") · actions and write-back · languages (with a confirm flag if unverified) · integrations · data, recording, deployment.\n\nAnswers are 1–3 sentences. Start with \"Yes.\" or \"No.\" where possible. Restate configurability (\"you configure\", \"where authorised\") and the decision boundary.\n\n### E10. Closing CTA Block (`## N. Closing CTA Block`)\n\n```markdown\n**Headline:** [Turn / Make] every [unit] [outcome].\n\n**Copy:** [1–2 sentences, a verb chain of the product's work, ending on the outcome.]\n\n**CTA:** **See [Product] in Action**\n\n**Form:** Reuse the site's standard \"Request a Personalized Demo\" form and value bullets.\n```\n\n### E11. Open Items to Confirm Before Publishing (unnumbered)\n\nBullets in the form `- **Label:** what to confirm, and what to do if unconfirmed.`\n\n| Open item | Include when |\n|---|---|\n| **Metrics** | Always. \"No quantified claims ([list the natural metrics]) are included. Add only measured pilot or production data.\" |\n| **Feature readiness** | Always. Name the specific capabilities to confirm as live vs roadmap |\n| **Customer proof** / **Demo asset** (or combined **Customer proof and demo**) | Always. Named logo or quote only if approved; the §4 demo needs synthetic or anonymised data |\n| **Link to other Darwix products** | The page names other Darwix products as inputs or handoffs |\n| **Language coverage** | The page makes language claims |\n| **Integrations** | The page names systems for read or write-back |\n| **Regulatory / legal / clinical wording** | The page references a regulator, law, guideline or legal concept |\n| **Positioning vs [alternative]** | A known category of competing tools exists |\n| **Audience fit** | The audience sits outside Darwix's stated BFSI positioning |\n| **Capture / delivery / channel surface** | The device or channel is undecided |\n| **Data consent and access** | The page uses conversation data or sensitive data in a new way |\n| **Market claim** | The page cites an industry trend |\n| **One page or two** / **Relationship to [other page]** | The page overlaps another PRD |\n\n---\n\n## Part F. Capability Module Library\n\nEach capability section is one module. A PRD uses 8–12 of them, ordered by the arc in D1. Every module leads with a claim (Headline), proves it with an example or table, and usually ends with a Supporting line.\n\n### F1. Classification Taxonomy\n- **Use when:** the product compares values and must avoid false alarms.\n- **Title examples:** \"Not Every Difference Is a Conflict\" · \"A Different Number Isn't Always a Discrepancy\" · \"Not Every Mismatch Is a Problem. Every Mismatch Gets a Meaning.\"\n- **Pattern:** Headline · short Copy · Table `Class · Meaning · Example` (7–8 rows) · optional \"Same look, different meaning\" pair · Supporting line.\n- **Standard classes:** Agrees · Variant / Typographical · Contextual · Conflict · Stale / Newer · Subsequent Event · Enriched · Missing / Quality.\n\n### F2. Meaning Over Surface\n- **Use when:** the commodity reads words or checkboxes and the product reads meaning.\n- **Title examples:** \"Meaning, Not Keywords\" · \"A Disclosure Isn't a Yes/No Box\".\n- **Pattern:** Headline · Copy · Table `Customer says · A checkbox records · Darwix records` or `Category · Example` · adaptive follow-up rules (\"A 'Yes' to X opens ... A 'No' opens nothing extra.\") · structured output example · Supporting line.\n\n### F3. Discrepancy Matrix\n- **Use when:** the product compares statements or documents against a record.\n- **Title examples:** \"Discrepancy Intelligence\" · \"Catch the Contradiction Before It Becomes an Underwriting Query\" · \"Cross-Source Verification\".\n- **Pattern:** Headline (\"Catch the mismatch while [person] is still [present].\") · Copy · Table `[Source A] says · [Source B] says · Darwix flags` (6–8 rows, flags bold) · \"Nothing is silently overwritten\" statement · Supporting line.\n\n### F4. Discrepancy Families or Diligence Lenses\n- **Use when:** comparisons group naturally into families.\n- **Pattern:** Table `Family · What Darwix compares · Example`, or 6–8 cards each with one line and one italic example finding · optional Boundary line.\n\n### F5. Live Assist and Nudges\n- **Use when:** a human is in a live interaction and gaps can be fixed on the spot.\n- **Title examples:** \"Officer Assist: Nudges, Not Scripts\" · \"Advisor Assist and Live Completeness\" · \"Doctor Assist: Surface, Don't Decide\".\n- **Pattern:** Headline (\"Know what's missing before you leave.\") · 5–7 nudge examples in quotes, each tagged (Missing field / Clarification / Evidence / Completion) · field state Status list · optional readiness gate with an aphorism.\n\n### F6. Evidence Triggered by Conversation\n- **Use when:** statements create a need for proof.\n- **Pattern:** Headline (\"Proof captured at the exact moment it becomes relevant.\") · Copy · Table `[Person] says · Darwix prompts` (5–6 rows) · \"Evidence is stored with:\" list.\n\n### F7. Coverage: What It Captures / What's in a Brief\n- **Use when:** the breadth of data captured or produced is a selling point.\n- **Pattern:** Headline · 6–12 cards or a Table `Block · What it tells the user` / `Category · Captured` · Supporting line.\n\n### F8. Source Lineage and Three Values\n- **Use when:** values change hands or get corrected.\n- **Title examples:** \"Every Field Knows Where It Came From\" · \"Three Values. Nothing Overwritten.\"\n- **Pattern:** Headline · Copy · Table `Value state · Meaning` (Source value · Evidence-supported value · Adopted value) or a field lineage Record card · Example with real numbers · \"Source types tracked:\" list, or a `Source tag · Example` table.\n\n### F9. Show Me the Proof\n- **Use when:** findings must be verifiable.\n- **Title examples:** \"Every Finding Answers: 'Show Me the Proof.'\" · \"Every Alert Explains Itself and Shows Its Proof\".\n- **Pattern:** Headline · Copy · Record card (Finding · Source A with page/timestamp · Source B · Classification · Confidence · Status) · \"Evidence can point to:\" list · \"Confidence, explained:\" line · Supporting line.\n\n### F10. Missing, Stale and Newly Discovered\n- **Use when:** gaps matter as much as mismatches.\n- **Title examples:** \"What's Missing Matters as Much as What's There\" · \"'Document Available' Isn't the Same as Usable Evidence\".\n- **Pattern:** Headline · Three blocks or cards (Missing · Stale / Freshness · Newly discovered or Quality and versions) · document Status list · italic before-and-after example.\n\n### F11. Materiality, Severity, Confidence and Routing\n- **Use when:** volume forces prioritisation.\n- **Title examples:** \"Review by Materiality, Not Document Count\" · \"Severity That Moves, Owners That Exist, Escalation That Follows Consequence\".\n- **Pattern:** Headline · \"Materiality considers:\" / \"Severity reflects:\" list · Example contrast (small number vs critical gap) · \"Confidence, explained:\" · optional blocks for dynamic severity, ownership, SLA and escalation.\n\n### F12. Correlation and Noise Control\n- **Use when:** many signals describe one issue.\n- **Title example:** \"One Issue. One Alert.\"\n- **Pattern:** Headline · Copy · two before-and-after examples (four fragments → one consolidated alert) · \"How noise is cut:\" list · cross-channel line · Supporting line.\n\n### F13. Commitments and Institutional Memory\n- **Use when:** promises are made in conversations.\n- **Title examples:** \"Promises That Don't Disappear When the Call Ends\" · \"Institutional Memory: Both Sides' Promises, Checked Against Reality\".\n- **Pattern:** Headline · Copy · timeline Table `When · What happens` or Example → finding · \"Tracked:\" customer commitments and organisation commitments · \"Shown for each:\" list.\n\n### F14. What Changed\n- **Use when:** users return to an ongoing case.\n- **Pattern:** Headline (\"Lead with what's new since the last touchpoint.\") · \"Detected changes:\" list · \"Recency-weighted:\" line · \"Stays current:\" line · Supporting line.\n\n### F15. Conversation Plan\n- **Use when:** the product prepares what a person should say.\n- **Pattern:** Four blocks: **Ask** (by journey) · **Verify** · **Don't repeat** · **Don't say** (where configured) · Supporting line.\n\n### F16. Clarification Loop\n- **Use when:** findings need answers from another party.\n- **Title examples:** \"Clarify, Resolve, Preserve\" · \"Ask the Seller the Exact Question the Evidence Creates\".\n- **Pattern:** Headline · Copy · query Record card (Account · Finding · Evidence · Request · Priority and due) · \"Response handling:\" list · \"What you can see:\" list · optional reviewer resolution options · Supporting line (\"Detect. Prove. Clarify. Resolve. Preserve.\").\n\n### F17. States, Outcomes and Readiness\n- **Use when:** every case ends in a status.\n- **Title examples:** \"Outcomes: No Unexplained Pass or Fail\" · \"Every Meeting Gets an Objective, Priorities and a Readiness Check\".\n- **Pattern:** Headline · Table `Outcome · Meaning` (5–7 states) or a Status list · aphorism (\"*Form completed doesn't always mean proposal ready.*\") · Supporting line.\n\n### F18. Review-Ready Output and Packs\n- **Use when:** the product hands a package to a reviewer or committee.\n- **Title examples:** \"A Review-Ready Output\" · \"The Evidence Package\" · \"The Acquisition Review Pack\" · \"Human Review: Send the Exception, Not the Whole Video\".\n- **Pattern:** Headline · Three blocks (structured record · exception view · summary or pack contents) · optional sample summary as a blockquote · Principle line (the summary reports; it never recommends the decision).\n\n### F19. Conversation-to-Action Workflow\n- **Use when:** findings trigger downstream work.\n- **Title examples:** \"From Conversation to Action\" · \"From Alert to Action to Resolution\" · \"Agentic Actions After the Call\".\n- **Pattern:** Headline (\"The [event] ends. The workflow doesn't.\") · Flow line · Table `When · What Darwix can trigger` or `Case type · Automatic actions` · optional Lifecycle status list · optional closed-loop line · Supporting line.\n\n### F20. Before, During, After and Handoffs\n- **Use when:** the product connects to other Darwix products or phases.\n- **Pattern:** Three columns (**BEFORE / DURING / AFTER**) each with an example · cross-channel memory example · Supporting line (\"Prepare before. Assist during. Act after.\"). Or a handoff list (\"**Underwriting:** ... **Video PIVC:** ...\").\n\n### F21. Continuity: Pause, Resume, Cross-Channel\n- **Pattern:** Headline · Copy (what is preserved and why it stopped) · \"When the customer returns:\" line · \"Actions during the flow:\" list · \"Status clarity:\" Status list.\n\n### F22. Grounded Answers and Multilingual\n- **Pattern:** Two blocks: **a) Grounded Q&A** (sample questions; answers from approved sources only; \"If it can't ground an answer, it won't invent one and routes the question to [human].\") · **b) Languages** (Hindi, English, Hinglish, code-switching; transcript kept in the language spoken; structured record standardised).\n\n### F23. Consent, Confirmation and Regulatory Controls\n- **Title examples:** \"The Customer Confirms What Goes In Their Name\" · \"Consent and Practice-Guideline Aware\" · \"Compliance and Knowledge, Ready Before the Meeting\".\n- **Pattern:** Headline · Copy (regulatory framing marked for Legal review) · \"Built-in controls:\" bullets or \"What's recorded:\" list · Supporting line.\n\n### F24. Real-Time Intervention\n- **Title example:** \"Alert While the Interaction Is Still Recoverable\".\n- **Pattern:** Headline · Copy · four bold-labelled examples, each \"situation → *who is prompted and how*\" · Supporting line.\n\n### F25. Segment Cards: Journeys, Products, Roles, Specialties\n- **Title examples:** \"Built for Every Lending Journey\" · \"Product-Aware Verification\" · \"Same Customer. Different Role. Different Brief.\" · \"Configured to Your Specialty\".\n- **Pattern:** 4–7 cards, each with what it focuses on and one example finding, or a Table `Role · Focus · Example` · optional depth tiers (*Quick · Standard · Enhanced*) · Supporting line.\n\n### F26. Your Template, Not Ours\n- **Use when:** the client's own form, checklist or taxonomy drives the product.\n- **Pattern:** Headline · Copy listing what is configurable · conditional-logic Example (\"Employment = Salaried → ...\").\n\n### F27. Rules Plus AI\n- **Title examples:** \"AI for Meaning. Rules for Control.\" · \"Rules Where Rules Belong. AI Where Understanding Is Needed.\"\n- **Pattern:** Headline · Table `Deterministic rules handle · AI handles` or a worked arithmetic example · Supporting line (\"AI for understanding. Rules for control. Evidence for proof.\").\n\n### F28. Client-Controlled Guardrails\n- **Title example:** \"Insurer-Controlled Guardrails\".\n- **Pattern:** Headline (\"AI flexibility inside [client]-controlled boundaries.\") · Copy · two-column control list · Supporting line (\"Deterministic where control is required. Intelligent where the conversation needs it.\").\n\n### F29. Agentic Preparation\n- **Pattern:** Headline · \"Where authorised, Darwix can automatically:\" `·`-separated list.\n\n### F30. Pool or Portfolio View (second signature)\n- **Use when:** the product works at portfolio scale.\n- **Title example:** \"From 5,000 Accounts to the Ones That Deserve an Expert\".\n- **Pattern:** Headline · Table `Segment · What it means` · italic drill-down chain (\"₹8.2 crore exposure → 214 accounts → HL-241872 → page 17 → status\") · \"Pool view shows:\" list · deterministic quantification with a boundary line.\n\n### F31. Analytics\n- **Title example:** \"See Where the Business Keeps Needing Intervention\".\n- **Pattern:** Headline · \"Metrics:\" list · Supporting line.\n\n### F32. Multimodal Signals\n- **Title example:** \"Video & Voice Intelligence\".\n- **Pattern:** \"Video signals:\" list · \"Voice signals:\" list · line on how signals are interpreted (client rules only) · Supporting line.\n\n---\n\n## Part G. Fill-In Skeleton\n\n```markdown\n# PRD: Darwix AI [Product Name] Page\n\n**Scope:** Content of the [Product Name] page only. Navigation, entry points, layout and visual design are out of scope.\n**Audience:** Navigation, entry points, layout and visual design are out of scope.\n**Audience:** Heads of Collections, Credit, Compliance, Risk, Customer Service, Field Operations and Digital/Operations leaders at banks, NBFCs, HFCs and insurers. Managers who supervise live interactions are the secondary reader.\n**What the product is:** A real-time signal-detection and action layer for BFSI. It understands what is said and what happens across conversations, field visits, documents and systems, decides what is worth an alert, attaches the proof, routes it to the right owner, triggers the next authorised action, and tracks it to resolution.\n**Page goal:** Make the reader believe one thing: *most alert systems create noise. Darwix alerts on meaning, in time to act, and follows through until it's resolved.*\n**Positioning guardrails (state them on the page):**\n- Not a threshold engine, a keyword spotter or a notification dashboard.\n- An alert is an indicator requiring the configured next step. It is not a determination of fraud, non-compliance or a credit outcome. Accountable decisions stay with authorised people.\n**Voice:** Match darwix.ai: confident, short, outcome-led. Every section leads with a claim, then proof.\n\n---\n\n## 1. Hero\n\n**Eyebrow:** REAL-TIME ALERT INTELLIGENCE · BUILT FOR BFSI\n\n**Headline:** Know what needs attention while there's still time to act.\n\n**Subhead:** Darwix Alert Intelligence understands live conversations, field visits, documents and system events. It detects the signals that matter, checks them against customer and case context, cuts the noise, attaches the exact evidence, and routes each alert to the right person, with the next action ready.\n\n**Capability line:** Live Signal Detection · Context & Correlation · Noise Suppression · Evidence-Linked Alerts · Dynamic Severity · Smart Routing · Action Orchestration · Resolution Tracking\n\n**Proof strip:** Detects meaning, not just keywords · One issue, one alert · Every alert shows its proof · Tracked until resolved\n\n**CTAs:** Primary: **Request an Alert Intelligence Demo**. Secondary: **See an alert fire live** (scrolls to §4).\n\n---\n\n## 2. The Problem: You Don't Have an Alert Problem. You Have an Attention Problem.\n\n**Headline:** More notifications didn't make anyone act faster.\n\n**Copy:** A borrower mentions a car EMI the application never declared. An agent skips a mandatory disclosure. A customer promises to pay on Friday, and Friday passes. Someone says \"third time I'm calling.\" Every one of these is a signal, and most of them are found in a post-call review, buried in call notes, or repeated across five systems as five separate alerts. By then the interaction is over, the customer is gone, and nobody knows who owns it.\n\n**Three-line pain strip:**\n- **Too late:** issues surface in post-call sampling, after the conversation ended.\n- **Too noisy:** the same problem fires from four systems, and teams stop trusting alerts.\n- **No follow-through:** nobody owns it, nobody proves it, nobody knows if it was resolved.\n\n**Closing line:** From event detection to resolution, without drowning teams in noise.\n\n---\n\n## 3. How Alert Intelligence Works\n\n**Headline:** Signal → Context → Decision → Action → Resolution.\n\nSeven steps as a horizontal flow, one line each:\n\n1. **Listen:** Live calls, field and video interactions, documents, and events from LOS, LMS, CRM, claims and payments.\n2. **Understand:** Turn words and events into BFSI signals: an obligation, a commitment, a missed disclosure, a complaint, a discrepancy, an intent.\n3. **Enrich:** Pull the customer, account, product, stage, previous alerts and open commitments before deciding anything.\n4. **Decide:** Combine AI meaning with your business rules, thresholds and time windows. Check for duplicates.\n5. **Prioritise:** Score severity from materiality, impact, urgency and confidence.\n6. **Prove & route:** Attach the exact evidence and send it to the accountable owner.\n7. **Act & track:** Trigger the authorised next step and follow the alert to resolution.\n\n---\n\n## 4. Signature Section: One Sentence. One Alert. Three Actions.\n\n**Headline:** Watch a borrower's sentence become a credit-ready alert while the officer is still in the room.\n\n**Format:** A live-alert card built over a PD conversation. Script below.\n\n**Existing application (from LOS):** Home loan · self-employed · declared income ₹90,000/month · existing obligations: **None**\n\n**Live PD:** **Borrower:** \"Car ka EMI bhi hai, around ₹18,500. Three years aur bacha hai.\"\n\n**Darwix, in seconds:**\n\n| Step | What happens |\n|---|---|\n| **Understand** | Detects an existing vehicle-loan obligation, ₹18,500/month, about 3 years left |\n| **Compare** | Application says no obligations. Bank signal shows a recurring debit of the same size |\n| **Alert** | **Undeclared Existing Obligation** · Severity: High · Evidence: transcript 09:42 + bank signal · Confidence: High |\n| **Nudge the officer** | \"Capture lender, outstanding amount and remaining tenure.\" |\n| **After officer confirmation** | Adds the PD exception · creates a credit-review item · preserves the original application value · attaches the conversation evidence · pushes the structured obligation into the workflow |\n\n**Closing line:** The alert didn't just say \"mismatch.\" It captured the fact, proved it, and moved the workflow.\n\n---\n\n## 5. Meaning, Not Keywords\n\n**Headline:** Customers never say the magic word. Darwix understands anyway.\n\n**Copy:** The same sentence means different things in different contexts. \"I'll pay on Friday\" is a promise, or a repeat of a broken one, or a partial commitment past an escalation date. Darwix reads the signal against customer, product, stage and history before it alerts anyone.\n\n**Signals it understands (categories with a typical example):**\n\n| Category | Example |\n|---|---|\n| **Compliance** | Mandatory disclosure missed · consent not captured · unsupported return promise |\n| **Discrepancy** | \"Business is six years old\" vs. application says 10 |\n| **Commitment** | \"₹20,000 kal, rest after salary\" |\n| **Complaint** | \"Third time I'm calling and nobody has fixed this\" |\n| **Escalation** | \"I want to speak to a manager\" |\n| **Mis-selling** | \"I thought this was a fixed deposit\" |\n| **Risk & fraud indicators** | Changing story · repeated failed verification · account behaviour shift |\n| **Customer intent** | Cancellation, renewal, top-up, higher-amount interest |\n| **Vulnerability** | Explicit statements only: hardship, bereavement, needs language support |\n| **Operational** | Overdue service request · stalled application · SLA breach |\n\n**Supporting line:** Understand the event in context before alerting anyone.\n\n---\n\n## 6. Alert While the Interaction Is Still Recoverable\n\n**Headline:** The best time to catch it is before the customer leaves.\n\n**Copy:** Some alerts shouldn't reach a dashboard first. They should reach the person who can still change the outcome, as a nudge.\n\n**Four examples:**\n- **Missed disclosure:** the interaction is heading to close and a required disclosure isn't done → *agent or field officer is prompted before it closes.*\n- **Evidence needed:** \"This 120 sq ft area is my gardening space\" → *officer is prompted to capture photo evidence on site.*\n- **Product misunderstanding:** \"I thought this was a fixed deposit\" → *approved clarification is prompted, and escalation is triggered if unresolved.*\n- **Manager needed:** a high-value customer asks for escalation, or a settlement crosses authority → *supervisor gets an alert with the customer, the reason, the exact statement and transcript context. Not \"please join this call.\"*\n\n**Supporting line:** Escalate with context, not with a request to \"please join.\"\n\n---\n\n## 7. One Issue. One Alert.\n\n**Headline:** Correlate the story instead of flooding people with fragments.\n\n**Copy:** One weak signal means little. Several together mean something. Darwix combines related signals into one case-level alert, and stops repeat alerts for the same issue.\n\n**Example: collections risk**\n- Customer missed the last promise to pay\n- Customer says income has dropped\n- No payment event after the latest commitment\n- Customer asks for a lower instalment\n→ **One alert: Repayment Difficulty, Repeated Commitment Failure**, not four notifications.\n\n**Example: income exceptions**\nInstead of four alerts (PD income mismatch, salary credit mismatch, income-document exception, application variance) → **one consolidated Income Verification Exception**, with all supporting evidence underneath.\n\n**How noise is cut:** Duplicate and already-acknowledged checks · grouping by customer, account, case and time window · suppression of low-materiality signals · existing-open-alert awareness\n\n**Cross-channel:** A promise on Monday's call, a payment link on Tuesday, no payment on Wednesday, and Thursday's field-visit remark that income is delayed become one alert state for one customer.\n\n**Supporting line:** One customer. Multiple channels. One alert state.\n\n---\n\n## 8. Promises That Don't Disappear When the Call Ends\n\n**Headline:** Connect what was promised with what actually happened.\n\n**Copy:** BFSI conversations create commitments all day: pay on Friday, send documents, call back, visit the branch. Most end up as free-text notes nobody monitors. Darwix turns each into a structured commitment with an owner, date and condition, and watches for the outcome.\n\n**Timeline (collections example):**\n| When | What happens |\n|---|---|\n| **On the call** | Customer: \"Friday ko ₹25,000 pay kar dunga.\" → Darwix creates a structured promise-to-pay: ₹25,000, Friday |\n| **Immediately** | Approved payment link goes out. Commitment monitoring is scheduled |\n| **Friday deadline** | No qualifying payment event in the system |\n| **Alert** | **Promise-to-Pay Not Fulfilled**, with previous broken promises, current overdue status and the linked conversation |\n| **Action** | Routed to the collection owner. Follow-up triggered. Severity rises if it repeats |\n\n**Also tracks:** Customer commitments (documents, KYC, medical tests, visits) and enterprise commitments (callbacks, quotes, escalations, resolutions), so your own promises are watched too.\n\n---\n\n## 9. Every Alert Explains Itself and Shows Its Proof\n\n**Headline:** Never ask anyone to trust an alert they can't verify.\n\n**Anatomy of an alert:**\n\n| | |\n|---|---|\n| **What happened** | Undeclared existing obligation |\n| **Why it matters** | Relevant to credit assessment |\n| **Evidence** | Borrower statement, transcript 09:42 · recurring bank debit |\n| **Context** | Application, product, stage, previous alerts |\n| **Severity & confidence** | High · High |\n| **Owner** | Credit team, assigned |\n| **Next action** | Capture lender, outstanding, tenure |\n| **SLA & status** | Within configured window · Open |\n\n**Evidence can point to:** transcript line · audio or video timestamp · document page and field · ledger entry · system event · visual evidence · previous alert or commitment.\n\n**Supporting line:** The alert is the summary. The evidence is always behind it.\n\n---\n\n## 10. Severity That Moves, Owners That Exist, Escalation That Follows Consequence\n\n**Headline:** Urgency in the alert becomes urgency in the operation.\n\nThree blocks:\n\n**a) Dynamic severity:** Priority rises as new signals confirm the concern, an SLA breaches, a commitment fails or a complaint repeats. It falls when a clarification arrives, a customer fulfils a promise or a reviewer marks it contextual.\n\n**b) Clear ownership:** Every alert routes by product, branch, geography, segment, category, severity or workflow stage, to a person, a team queue, the account owner, an escalation hierarchy or an authorised downstream agent. *No alerts that belong to everybody and therefore to nobody.*\n\n**c) SLA and escalation:** Each category has a response expectation. Critical compliance alerts nudge the frontline immediately and alert the manager before the interaction closes. Escalation considers time open, no acknowledgement, failed action, repeated alerts, customer impact and account value.\n\n---\n\n## 11. From Alert to Action to Resolution\n\n**Headline:** Detection is the beginning of the workflow, not the end.\n\n**Flow line:** Detect → Route → Act → Track → Resolve\n\n**Actions Darwix can trigger (per your permissions):** Create CRM, LOS or LMS tasks · raise a service request · create underwriting or compliance review · request a document or evidence · initiate callback · send an approved WhatsApp, SMS or email · assign a field visit · pause a straight-through workflow · trigger another Darwix agent · write the outcome back to the source system\n\n**Lifecycle:** Detected → Open → Acknowledged → In Progress → Waiting for Customer/Evidence → Escalated → Resolved → Closed → Reopened\n\n**Full timeline on every alert:** Detected, evidence added, owner assigned, acknowledged, action taken, severity changed, escalated, resolved, reopened.\n\n**Closed loop:** Each resolution is tagged (confirmed issue, false positive, explained by context, duplicate, customer clarified). Outcomes feed back into thresholds, routing, suppression and severity logic under your governance.\n\n**Supporting line:** An alert is useful only if somebody knows it was resolved.\n\n---\n\n## 12. One Layer. Every BFSI Journey.\n\n**Headline:** The signals that matter in your business.\n\nSix cards, each with three to four alert types and one example:\n\n**Lending & PD**\nIncome mismatch · undeclared obligation · business-vintage or property-use mismatch · evidence required · PD field incomplete\n*\"Business is six years old, form says ten\" → Business Vintage Mismatch; the clarified value is captured and the original preserved.*\n\n**Collections**\nPromise to pay · broken promise · settlement request · payment dispute · hardship · wrong-party contact · supervisor approval needed\n*\"₹20,000 kal, rest after salary\" → Partial-payment commitment created, monitored, escalated if missed.*\n\n**Insurance**\nDisclosure mismatch · product misunderstanding · premium-term mismatch · unsupported guarantee claim · incomplete PIVC · cancellation or renewal intent\n*\"The agent said I only pay five years\" vs proposal ten → Premium Payment Term Mismatch; approved clarification, review if unresolved.*\n\n**Customer Service**\nRepeat complaint · overdue service request · escalation demand · cancellation threat · failed digital step\n*\"Third time calling, KYC still not updated\" → Repeat Contact, with the open request surfaced and duplicate SR prevented.*\n\n**Field Operations**\nDisclosure skipped · consent missing · evidence not captured · statement vs application mismatch · manager approval needed\n\n**Evidence & Documents**\nNew medical condition found · valuation materially lower · security document missing · claim date inconsistency · document expired\n*Latest valuation ₹61L vs seller's ₹72L → Material Valuation Change routed to review.*\n\n**Opportunity alerts (one line under the cards):** Approved, intent-based triggers such as top-up interest, renewal intent or additional-cover requests, grounded in what the customer actually said and your eligibility rules, never speculative profiling.\n\n---\n\n## 13. AI for Meaning. Rules for Control.\n\n**Headline:** Not a black box. Not a rules engine. Both, working together.\n\nTwo columns:\n\n| Deterministic rules handle | AI handles |\n|---|---|\n| Numeric thresholds and DPD bands | Customer intent and complaint understanding |\n| SLA breaches and deadlines | Semantic contradictions and mis-selling language |\n| Mandatory disclosures and required fields | Commitment extraction |\n| Missing documents and account status | Uncertainty and cross-language meaning (Hindi, English, Hinglish) |\n| Explicit policy and authority rules | Document interpretation and multi-signal context |\n\n**Combined example:** AI hears a customer offer a partial payment next week. Rules check DPD, minimum acceptable payment, existing commitments, collection stage and authority matrix. The output is a partial-payment commitment routed to the configured collection action.\n\n**Supporting line:** AI understands the conversation. Rules protect the operating boundary.\n\n---\n\n## 14. Your Alerts, Your Definitions\n\n**Headline:** Every institution decides what deserves an alert.\n\n**Configurable:** Signal taxonomy · trigger logic and time windows · materiality and severity · confidence thresholds · owners and routing · escalation and SLAs · suppression and deduplication · correlation rules · evidence requirements · action permissions · resolution states and reopen conditions · by product, segment, geography, channel, stage and role\n\n**Works with what you have:** Existing thresholds, mandatory-process rules and risk logic stay in your control framework. Darwix adds conversational and cross-source intelligence around them.\n\n---\n\n## 15. Detect Early. Decide Responsibly.\n\n**Headline:** An alert is a signal. The decision stays with your people.\n\n| Darwix does | Authorised people and systems control |\n|---|---|\n| Detects signals and extracts context | Fraud classification |\n| Correlates evidence | Credit sanction or decline |\n| Applies your rules | Underwriting decisions |\n| Generates, scores and routes alerts | Claim approval or repudiation |\n| Nudges and creates tasks | Legal determinations |\n| Triggers approved operational actions | Investment advice |\n| Monitors commitments and escalates | Policy exceptions, remediation, disciplinary action |\n| Records resolution | Final compliance conclusions |\n\n**Three principles (state on page):**\n- **Fraud and risk:** Darwix surfaces early-warning indicators and prepares the case. An alert isn't a finding of fraud.\n- **Vulnerability:** Alerts rely on explicit customer statements or approved institutional context, never speculative inference about personal traits.\n- **Action control:** You define which alerts may trigger automatic action and which need human approval.\n\n---\n\n## 16. Integrations, Events and Governance\n\n**Headline:** Alerts belong inside the systems your teams already work in.\n\n**Connects to:** CRM · LOS · LMS · collections platform · policy admin · underwriting · claims · service-request and case-management systems · DMS · contact-centre platform · payments · data warehouse · workflow engines · risk, fraud and compliance systems · collaboration tools\n\n**Reads:** Customer, account, product, stage, payments, documents, previous alerts, commitments and interactions, owners and SLAs.\n**Returns:** Alert, severity, evidence, owner, task, status, resolution, structured signal, follow-up and write-back.\n**Events:** Alert created, routed, acknowledged, escalated, commitment breached, alert resolved or reopened, all available to downstream workflows.\n\n**Governance tiles:**\n- **Need-based, least-privilege access:** only the data an alert needs, only the systems and fields required\n- **Role-based visibility:** alerts, evidence and customer data by role\n- **Sensitive-data protection:** configurable masking and redaction\n- **Full audit trail:** signal source, triggering evidence, rule and classifier version, context, owner, actions, escalations, resolution and reopen history\n- **Rule and model governance:** changes to triggers and thresholds tracked\n- **Deployment and residency:** on-prem, VPC or cloud, with enterprise retention and data-location controls\n\n**Badges:** SOC 2 Type II · ISO 27001 (as on the Compliance page) · link to Compliance\n\n---\n\n## 17. See Where the Business Keeps Needing Intervention\n\n**Headline:** Alert analytics that explain why, not just how many.\n\n**Metrics:** Alerts by category, severity, product, channel and team · time to acknowledge and resolve · SLA breach and escalation rates · false-positive and repeat-alert rates · alerts resolved during the interaction · broken-commitment rate · most common compliance gaps and discrepancy types · alert-to-action conversion · outcome distribution\n\n**Supporting line:** Find the recurring gaps, and fix the process behind them.\n\n---\n\n## 18. Business Impact\n\n**Headline:** Fewer alerts to watch. More alerts worth acting on.\n\nValue tiles (bold headline, one line each):\n- **Catch issues during the interaction:** not in next week's sampling\n- **Beat alert fatigue:** consolidated, deduplicated, prioritised\n- **Finish the frontline job:** missing disclosures, evidence and fields fixed while recoverable\n- **Follow through on collections:** every promise monitored, every broken one caught\n- **Give credit and underwriting better files:** discrepancies arrive with evidence\n- **Improve customer experience:** repeat complaints and unresolved journeys surface sooner\n- **Cut manual monitoring:** no more searching for material events across systems\n- **Create accountability:** every alert has an owner, SLA, history and resolution\n\n---\n\n## 19. Why Darwix\n\nEight pillars, one line each:\n**Conversation-native** (understands what people say) · **BFSI-aware** (obligations, commitments, disclosures, mis-selling) · **Cross-channel** (voice, field, video, documents, systems) · **Context-aware** · **Noise-aware** · **Evidence-linked** · **Action-oriented** · **Lifecycle-aware and human-controlled**\n\n**Supporting line:** Not more notifications. Better decisions about what needs attention.\n\n---\n\n## 20. FAQ\n\n1. **What is Darwix Alert Intelligence?** A real-time signal-detection, prioritisation and action-orchestration layer for BFSI. It detects important events across conversations, field interactions, documents and systems, enriches them with case context, creates explainable alerts and triggers the next action.\n2. **Is it just a rules engine?** No. Rules are one part. Darwix combines your deterministic rules with AI that understands intent, commitments, complaints, contradictions and compliance language in natural conversation.\n3. **Can it alert during a live call or field visit?** Yes, where real-time processing is configured. It can nudge the agent or officer before the interaction ends.\n4. **Can it work with our existing alert rules?** Yes. Existing thresholds, SLAs and process rules stay in place. Darwix adds conversational and cross-source intelligence around them.\n5. **How does it avoid too many alerts?** Materiality thresholds, suppression windows, deduplication, correlation and checks for open alerts consolidate related events.\n6. **Can it explain why an alert fired?** Yes. Alerts retain the triggering statement, source field, system event, comparison, rule, confidence and case context.\n7. **Can an alert trigger an action automatically?** Yes, where you authorise it. High-impact actions can stay subject to human approval.\n8. **Can it track customer commitments?** Yes. Promises, document submissions, callbacks and follow-ups are structured, assigned, monitored and alerted on if missed.\n9. **Can it detect fraud?** It detects configured indicators and early-warning signals, correlates evidence and routes cases for investigation. An alert is not an autonomous fraud determination.\n10. **Can it detect compliance issues?** It identifies configured process signals such as missed disclosures, incomplete consent or unsupported statements. Final conclusions stay with your governance process.\n11. **Can severity change?** Yes. It recalculates as evidence arrives, SLAs breach, commitments fail or a reviewer resolves the issue.\n12. **Does every alert need a human?** No. Low-risk operational alerts can trigger approved automatic actions. Material or regulated alerts route to an authorised person.\n13. **Can it integrate with CRM, LOS and LMS?** Yes, through authorised integrations that retrieve context and return alerts, tasks, status and resolution.\n\n---\n\n## 21. Closing CTA Block\n\n**Headline:** Turn every important signal into the right next action.\n\n**Copy:** Detect risk, compliance drift, customer intent, broken commitments and discrepancies in real time, then route, act and track them through resolution.\n\n**CTA:** **See Alert Intelligence in Action**\n\n**Form:** Reuse the site's standard \"Request a Personalized Demo\" form and value bullets.\n\n---\n\n## Open Items to Confirm Before Publishing\n\n- **Metrics:** No quantified claims (alerts per day, noise reduction, resolution time, promise-kept rate) are included. Add only measured pilot or production data.\n- **Feature readiness:** Confirm which items are live versus roadmap: real-time nudges, cross-channel correlation, commitment monitoring against payment events, dynamic severity and closed-loop learning.\n- **Link to the other Darwix products:** The page assumes signals from Sherpa, Voice Automation, Auto PD, Video PIVC, Tele-Medicine and Evidence Intelligence feed this layer. Confirm which are integrated today before the page claims it.\n- **Real-time scope:** Confirm which channels support live in-interaction alerts (voice, field wearable, video) and which are post-event only.\n- **Compliance wording:** Have Compliance and Legal review the fraud, vulnerability and compliance-monitoring language.\n- **Integrations:** Confirm which CRM, LOS, LMS and collections systems are supported for write-back today.\n- **Demo asset:** §4 and §8 need a real or scripted demo on synthetic data.\n- **Customer proof:** Add a named logo or quote only if approved.\n"},{"id":"r-Auto_PD","name":"Auto_PD.md","text":"# PRD: Darwix AI Auto PD Product Page\n\n**Scope:** Content of the Auto PD (PD form-filling agent) page only. Navigation, entry points, layout and visual design are out of scope.\n**Audience:** Lending decision-makers: Chief Credit Officers, Heads of Operations, Product and Technology at banks, NBFCs and HFCs, plus regional credit and sales heads.\n**Page goal:** Make the reader believe one thing: *the officer has the conversation; Darwix fills the PD, catches what doesn't match, asks for proof on the spot, and pushes it into the LOS.*\n**Positioning guardrail (state it on the page):** Auto PD captures, verifies and structures. It never sanctions or rejects. Credit decisions stay with the lender.\n**Voice:** Match darwix.ai: confident, short, outcome-led, BFSI-native. Every section leads with a claim, then proof. No filler lists.\n\n---\n\n## 1. Hero\n\n**Eyebrow:** AI PERSONAL DISCUSSION · BUILT FOR LENDING\n\n**Headline:** The borrower speaks. The PD builds itself.\n\n**Subhead:** Darwix Auto PD listens to the conversation between your officer and the borrower, fills your PD form as they talk, flags what doesn't match the application, asks for photo or document proof on the spot, and writes the finished, evidence-backed record into your LOS.\n\n**Capability line:** LOS Pre-Fetch · Live Form Filling · Hindi-English-Hinglish · Discrepancy Detection · Evidence Triggers · Officer Nudges · Workflow Actions\n\n**Proof strip:** Fills out of sequence, as the conversation flows · Every field carries its source · Original application values never silently overwritten · Lender keeps every credit decision\n\n**CTAs:** Primary: **Request an Auto PD Demo**. Secondary: **See a PD fill itself** (scrolls to §4).\n\n---\n\n## 2. The Problem: The Best Hour in Credit Is Spent on Data Entry\n\n**Headline:** A PD is where credit officers learn what the documents can't tell them. Then they spend the next hour typing it up.\n\n**Copy:** The Personal Discussion exists to understand the borrower beyond the file: does the business really exist, is the income what was declared, what else do they owe, what will the money actually be used for. But the officer has to ask, listen, remember, photograph, and then rebuild it all into a form later. Details slip. Contradictions surface days afterward, when the borrower is no longer in the room. Evidence sits in a phone gallery with no link to what it proves.\n\n**Three-line pain strip:**\n- **During the PD:** the officer splits attention between the borrower and the form.\n- **After the PD:** hours go into re-entering, correcting and chasing missing fields.\n- **At credit review:** reviewers get an incomplete form, loose notes and photos with no context.\n\n**Closing line:** Let the officer run the discussion. Let AI build the PD.\n\n---\n\n## 3. How Auto PD Works\n\n**Headline:** From Application ID to a review-ready PD, in one conversation.\n\nSix steps as a horizontal flow:\n\n1. **Pre-fetch:** Enter the Application ID. Darwix pulls the case from your LOS and CRM: applicant, co-applicant, product, amount, declared income, business details, obligations, property, KYC and document status. No blank form. No re-asking what you already know.\n2. **Converse:** The officer talks to the borrower naturally, in Hindi, English or Hinglish. No reading the form out field by field.\n3. **Structure:** Darwix identifies who said what and maps every relevant statement into the right PD field, in any order.\n4. **Verify:** Each statement is checked against the application, documents and other sources. Contradictions and gaps surface while the borrower is still there.\n5. **Evidence:** When a claim needs proof (\"I have fifteen machines here\"), the officer is prompted to capture it, linked to that exact statement.\n6. **Act:** After officer review, approved fields, exceptions, evidence and next actions flow back into the LOS and workflow.\n\n---\n\n## 4. Signature Section: Watch a PD Fill Itself\n\n**Headline:** One conversation. A structured credit file.\n\n**Format:** Left panel is the live Hinglish conversation with speaker labels. Right panel is the PD form filling in real time, colour-coded as *pre-filled from LOS*, *captured from borrower*, and *flagged*. Content below is the script.\n\n**Pre-fetched from LOS before the PD starts:** Home Loan · ₹42 lakh · Self-employed · Declared income ₹95,000/month · Business vintage 10 years · Existing obligations: None · Property use: Self-occupied · Co-applicant: Spouse\n\n| Moment | What's said | What Darwix does |\n|---|---|---|\n| **Business** | Borrower: \"Garment manufacturing hai. Apna business around seven years se hai. Current unit mein four years ho gaye.\" | Captures type, 7-year vintage, 4 years at current location. **Flags: Business Vintage Mismatch** (application says 10). |\n| **Income** | \"Normal sale four to five lakh hoti hai. Diwali mein seven-eight tak ho jaati hai.\" | Captures normal sales ₹4–5 lakh, seasonal peak ₹7–8 lakh. **Nudges:** business expenses and net income not yet captured. |\n| **Obligation** | \"Car ka EMI bhi hai around eighteen-five.\" | Captures ₹18,500 EMI. **Flags: Undeclared Obligation.** Nudges for lender, outstanding and tenure. |\n| **Property** | \"First floor hum rahenge. Ground floor rent pe de sakte hain.\" | Captures mixed use. **Flags: Property-Use Mismatch.** |\n| **Evidence** | \"Back side mein 120 square feet ka gardening area bhi hai.\" | **Triggers:** capture photo of the stated area, linked to the property section and this statement. |\n| **Close** | Officer wraps up | Shows completed sections, 3 exceptions, 4 evidence items, 1 pending bank statement, and the actions ready to fire. |\n\n**Closing line:** The officer had one conversation. Darwix produced the PD, the evidence trail, the discrepancy list and the next actions.\n\n---\n\n## 5. Discrepancy Intelligence\n\n**Headline:** Catch the mismatch while the borrower is still in front of you.\n\n**Copy:** A PD's real value is the gap between what was applied for and what's actually true. Darwix compares every statement with the application, uploaded documents and existing records, live.\n\n| Application says | Borrower says | Darwix flags |\n|---|---|---|\n| Income ₹90,000/month | \"Average around seventy, seventy-five thousand.\" | **Income Mismatch** |\n| No existing loans | \"Car ka ₹18,500 EMI chal raha hai.\" | **Undeclared Obligation** |\n| Business vintage 12 years | \"Business started six years back.\" | **Business Vintage Mismatch** |\n| Self-owned residence | \"Ye house mere father ke naam pe hai.\" | **Residence Ownership Mismatch** |\n| Fully self-occupied property | \"Ground floor rent pe denge.\" | **Property-Use Mismatch** |\n| Home improvement | \"Some amount business mein bhi use karna hai.\" | **Loan-Purpose Discrepancy** |\n| Co-applicant income ₹45,000 | Co-applicant: \"I stopped working three months ago.\" | **Co-Applicant Income Mismatch** |\n| Shop rent ₹15,000 (stated) | Rent agreement shows ₹22,000 | **Premises Rent Mismatch (document vs statement)** |\n\n**Supporting line:** Don't bury contradictions in a transcript. Surface them as credit-ready exceptions.\n\n---\n\n## 6. Evidence, Triggered by the Conversation\n\n**Headline:** Proof captured at the exact moment it becomes relevant.\n\n**Copy:** Darwix turns what the borrower says into a specific evidence request while the officer is still on site. Each photo or document is linked to the statement and PD field it supports, so it never sits in a gallery without context.\n\n| Borrower says | Darwix prompts |\n|---|---|\n| \"This whole floor is my tailoring unit.\" | Capture business premises |\n| \"I keep around fifteen machines here.\" | Capture machinery |\n| \"This is the stock I normally maintain.\" | Capture inventory |\n| \"I live upstairs and rent out the ground floor.\" | Capture occupancy and property use |\n| \"My shop board is outside.\" | Capture signage |\n| \"Eight years from this location.\" | Capture business-establishment proof |\n\n**Evidence is stored with:** Application ID · PD ID · related field · related statement · timestamp · officer · category · review status\n\n---\n\n## 7. Officer Assist: Nudges, Not Scripts\n\n**Headline:** Know what's missing before you leave the borrower's door.\n\n**Copy:** Darwix tracks the PD against your mandatory fields and nudges only when it matters. It also notices when a question was *spoken to* but not *answered*.\n\n**Nudge examples:**\n- **Missing field:** \"Monthly household expenses not yet captured.\"\n- **Real question unanswered:** Borrower gave sales of ₹5 lakh. \"Sales isn't income. Business expenses still needed.\"\n- **Clarification:** \"Two different business-vintage values stated. Please clarify.\"\n- **Obligation gap:** \"Vehicle EMI mentioned. Lender and outstanding missing.\"\n- **Co-applicant:** \"Co-applicant income is in the application but hasn't been discussed.\"\n- **Evidence:** \"Capture the machinery the borrower referenced.\"\n- **Completion:** \"3 mandatory fields remain.\"\n\n**Live completeness view:** Each field shows one status: *Pre-filled and confirmed · Captured · Needs clarification · Contradiction unresolved · Evidence pending · Missing*\n\n---\n\n## 8. What Auto PD Captures\n\n**Headline:** The financial story, the borrower story and the on-ground story, in one PD.\n\nEight compact cards, each with a one-line description and a few examples:\n\n- **Profile & household:** Age, family, dependents, residence type and vintage\n- **Salaried:** Employer, designation, CTC vs in-hand, fixed vs variable pay, bonus, job stability\n- **Self-employed:** Business model, vintage (total and current location), sales, expenses, seasonality, employees, premises, inventory, machinery, credit vs cash sales\n- **Income & expenses:** Every income source, household outflows, co-applicant contribution\n- **Obligations & banking:** Existing loans, EMIs, tenure, informal borrowing, banking relationships and behaviour\n- **Property & end use:** Financed property, usage, occupancy, own contribution and its source, loan purpose, end use of funds\n- **Co-applicant:** Relationship, income, ownership, contribution to repayment\n- **Officer observations & references:** What the officer saw, plus reference context\n\n**Supporting line:** Separate CTC from take-home, sales from income, application from reality.\n\n---\n\n## 9. Every Field Knows Where It Came From\n\n**Headline:** Value plus source, for every material field.\n\n**Copy:** Auto PD never silently overwrites an application value. It keeps the original, captures the new value, marks the difference and records how it was resolved.\n\n**Example card:**\n\n| Field | Business Vintage |\n|---|---|\n| Original application | 10 years |\n| Borrower statement | 7 years (08:14) |\n| Officer confirmation | 7 years |\n| Evidence | Business document reviewed |\n| Final PD value | 7 years |\n| Status | Application value corrected during PD |\n\n**Source types tracked:** LOS value · CRM · Borrower · Co-applicant · Officer observation · Document extraction · Bank statement · Bureau data provided by the lender · Visual evidence\n\n---\n\n## 10. A Review-Ready Output\n\n**Headline:** Send credit the exceptions and the story, not a 40-minute recording and a half-filled form.\n\nThree blocks:\n\n**a) Structured PD:** Fully mapped to your template, with pre-filled vs captured vs corrected clearly marked.\n\n**b) Exception view:** Field · application value · borrower value · document value · severity · evidence · transcript timestamp · resolution status.\n\n**c) Auto-generated PD summary:** A factual narrative for officer review.\n\n> *Applicant is self-employed and runs a garment-manufacturing business for about seven years, four at the current rented premises. Borrower states normal monthly sales of ₹4–5 lakh with higher festive-season sales. An existing vehicle EMI of ₹18,500 was disclosed during the PD but is absent from the application. The borrower stated the property will be partly self-occupied and partly rented, differing from the application. Business-premises and machinery evidence were captured.*\n\n**Principle (state on page):** The summary reports what was captured and what doesn't match. It never recommends sanction or rejection.\n\n---\n\n## 11. From Conversation to Action\n\n**Headline:** The PD ends. The workflow doesn't wait.\n\n**Flow line:** Conversation → PD Form → Evidence → Exception → Action\n\n| When | What Darwix can trigger |\n|---|---|\n| **During the PD** | Borrower says \"bank statement abhi nahi hai\" → mark document pending, send upload link. Co-owner not present → create follow-up task. Application value contradicted → preserve original, log correction for review |\n| **After the PD, post officer review: LOS** | Write approved fields · attach PD summary and evidence · push exception codes · update PD status |\n| **CRM & documents** | Update customer context · update checklist · request pending documents |\n| **Credit & verification** | Create credit-review task · route material discrepancies · trigger residence, business, technical or legal verification · create revisit task |\n\n**Supporting line:** Complete the operational work the PD creates, instead of handing it off by hand.\n\n---\n\n## 12. Your PD Template, Not Ours\n\n**Headline:** One intelligence layer, mapped to your credit process.\n\n**Copy:** Auto PD adapts to the PD you already run. Sections, mandatory and conditional fields, salaried vs self-employed flows, evidence rules, discrepancy rules, completion rules and write-back are all configurable by product and segment.\n\n**Example:** Employment = Salaried → the PD prioritises employer, salary structure, job vintage and obligations. Employment = Self-Employed → it prioritises business type, vintage, sales, expenses, premises, inventory and evidence.\n\n---\n\n## 13. Built for Lending, Not Against It: Credit Control Stays Yours\n\n**Headline:** AI builds the evidence-backed credit file. The lender makes the credit decision.\n\nTwo columns:\n\n| Darwix does | The lender controls |\n|---|---|\n| Pre-fetches application context | Credit policy and underwriting methodology |\n| Listens, transcribes, separates speakers | Eligibility criteria |\n| Extracts and structures PD fields | Income treatment, FOIR and LTV policy |\n| Detects gaps and discrepancies | Deviations and risk grading |\n| Triggers evidence capture | Sanction, decline and conditions |\n| Drafts the PD summary | Final credit decision |\n| Prepares approved system updates | |\n\n**Also:** Auto PD structures calculation-ready inputs (income, obligations, EMI comfort, loan amount, property value, own contribution) that your policy engine can use for FOIR, LTV and eligibility.\n\n---\n\n## 14. Built for Every Lending Journey\n\nFive compact use-case cards:\n\n- **Home Loans:** Income, obligations, property purchase, own contribution, co-applicant\n- **Self-Employed Housing:** Business economics, informal income context, seasonality, premises evidence\n- **Loan Against Property:** Collateral use, end use of funds, cash flow, co-owner context\n- **Affordable Housing:** Semi-formal income, household contributors, on-ground evidence, vernacular conversation\n- **Business & MSME Loans:** Business model, sales and expenses, working capital, machinery and inventory evidence\n\n---\n\n## 15. Integrations, Security & Governance\n\n**Headline:** Sits inside your lending stack, under your controls.\n\n**Integrates with:** LOS · CRM · lead management · KYC · document management · bureau layer · bank-statement analysers · Account Aggregator workflows · rule engine · verification workflows · data platforms. *(The Non-Voice Agents page already states LOS integrations with Finnone, Newgen and Lentra. Confirm they apply to Auto PD before reusing.)*\n\n**Reads before the PD:** Application, customer, loan, income, obligation, property, KYC and document context.\n**Writes after the PD:** Completed fields, corrections, discrepancies, evidence references, pending items, summary, status, workflow triggers.\n\n**Governance tiles:**\n- **Consent-aware:** Lender-configured borrower notice and consent\n- **Need-based access:** Only the data the PD workflow is authorised to read\n- **Role-based access:** Recordings, documents and evidence limited to authorised users\n- **PII protection:** Configurable masking and redaction\n- **Encryption:** Data protected in transit and at rest\n- **Full audit trail:** Sources, changes, discrepancies, evidence and actions traceable\n- **Deployment and residency:** On-prem, VPC or cloud with lender-defined data location and retention\n\n**Badges:** SOC 2 Type II · ISO 27001 (as on the existing Compliance page) · link to Compliance\n\n---\n\n## 16. Business Impact\n\n**Headline:** More time understanding the borrower. Less time rebuilding the conversation into a form.\n\nSix value tiles (bold headline plus one line):\n- **Cut manual form filling:** the PD is structured while it's happening\n- **Raise first-visit completion:** gaps and evidence needs surface on site\n- **Catch discrepancies earlier:** before they travel downstream\n- **Improve evidence quality:** context-linked, not gallery-buried\n- **Speed credit review:** exceptions and summary, not raw notes\n- **Support vernacular field teams:** natural Hindi, English and Hinglish, no forced formal English\n\n**Closing line:** Reduce PD effort without reducing PD depth.\n\n---\n\n## 17. Why Darwix for Auto PD\n\nEight pillars, one line each:\n**Context-aware** (starts from your LOS) · **Conversation-native** (no field-by-field reading) · **Multilingual** (Hinglish native) · **Discrepancy-aware** · **Evidence-aware** · **Officer-assisted** · **Workflow-aware** (PD becomes actions) · **Traceable & lender-controlled**\n\n**Supporting line:** Pre-fetch. Listen. Structure. Verify. Evidence. Act.\n\n---\n\n## 18. FAQ\n\n1. **What is Darwix Auto PD?** An AI Personal Discussion and PD form-filling solution for lending. It pre-fetches application context, listens to the live borrower discussion, fills your PD fields, detects discrepancies, prompts for missing information and evidence, and prepares structured outputs for downstream workflows.\n2. **Does the officer have to follow the form in order?** No. Darwix maps information to the right field regardless of the order in which topics come up.\n3. **Can it pre-fill from our LOS?** Yes. Through authorised integrations it retrieves the configured application, customer, loan, KYC, property and document context before the discussion starts.\n4. **Does it understand Hindi and Hinglish?** Yes. It supports code-switched conversation and maps it into standardised fields. *(Confirm the exact regional language list before publishing.)*\n5. **Can it work with our PD format?** Yes. Sections, mandatory fields, conditional logic, evidence rules and discrepancy rules are configurable per lender, product and segment.\n6. **How does it handle a borrower saying something different from the application?** It flags the discrepancy, keeps both values and follows your configured correction or review process. It doesn't silently overwrite source data.\n7. **Does it decide eligibility or sanction the loan?** No. It structures the inputs your policy engine and credit team use. All credit decisions stay with the lender.\n8. **Can it update our LOS after the PD?** Yes. After your configured review step, approved fields, summary, discrepancies, evidence references and status can be written back.\n9. **What if mandatory information is missing?** The officer is nudged during the discussion. Anything still open is carried into the output and the follow-up workflow.\n\n---\n\n## 19. Closing CTA Block\n\n**Headline:** Turn every Personal Discussion into structured credit intelligence.\n\n**Copy:** Capture the conversation, complete the PD automatically, surface what doesn't match, collect proof in context and move verified information straight into your next workflow.\n\n**CTA:** **See Auto PD in Action**\n\n**Form:** Reuse the site's standard \"Request a Personalized Demo\" form and value bullets.\n\n---\n\n## Open Items to Confirm Before Publishing\n\n- **Capture surface:** Does Auto PD run on the Sherpa wearable, a mobile app, or both? The page currently av
