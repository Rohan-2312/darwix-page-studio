| **Don't repeat** | Address and contact already verified |\n| **Watch-outs** | Don't make settlement promises outside authorised limits. Don't dismiss the open charge dispute |\n| **Likely next action** | Record the new commitment, route the dispute to the owner, schedule follow-up |\n\n**Every line shows its source:** *\"₹25,000 by Friday: collection call, 18 Sep, 07:14.\"*\n\n**Closing line:** The officer arrives knowing the account, the promise, the broken promise and the unresolved objection.\n\n---\n\n## 5. What's in a Brief\n\n**Headline:** One brief. No CRM archaeology.\n\nCompact table, one line each:\n\n| Block | What it tells the user |\n|---|---|\n| **Customer snapshot** | Segment, tenure, language and channel preference, owner, existing products |\n| **Meeting context** | Type, date, channel, journey stage, **primary objective** |\n| **Account / product state** | The exact loan, policy, claim, application or request status, key values, next due event |\n| **Last interaction** | Date, channel, what the customer asked, promised and objected to, and the outcome |\n| **Commitments** | Customer's and organisation's, with owner, due date and fulfilment status |\n| **What changed** | New since the last touch, ranked |\n| **Open actions** | Pending documents, approvals, payments, clarifications, service items |\n| **Watch-outs** | Complaints, discrepancies, compliance points, broken promises, active alerts |\n| **Opportunity** | Approved, eligible or explicitly requested next steps |\n| **Questions** | What to ask, what to verify, what **not** to ask again |\n| **Knowledge pack** | The policies and FAQs relevant to this exact meeting |\n| **Next actions** | What the meeting should unlock |\n\n---\n\n## 6. Institutional Memory: Both Sides' Promises, Checked Against Reality\n\n**Headline:** Your organisation should remember what it promised, not just what the customer did.\n\n**Copy:** A customer shouldn't have to remind you what your representative said. Darwix extracts commitments from prior interactions and checks them against system events.\n\n**Example:** Previous agent commitment: \"The sanction letter will be shared by end of day.\" System check: no outbound document event found. → **Organisation Commitment Still Open.** *Recommended: resolve it before or during the meeting.*\n\n**Tracked:**\n- **Customer commitments:** payment by a date, document submission, branch visit, medical test, KYC completion, signature, co-applicant availability\n- **Organisation commitments:** callback, document sharing, approval update, payment link, service resolution, manager follow-up, claim update\n\n**Shown for each:** Commitment · owner · due date · status · source and timestamp · whether it needs follow-up in this meeting.\n\n**Supporting line:** Know what was promised before making the next promise.\n\n---\n\n## 7. Show What Changed. Don't Make Them Reread What Didn't.\n\n**Headline:** The brief leads with what's new since the last touchpoint.\n\n**Detected changes:** Payment received or missed · new overdue amount · document uploaded or rejected · valuation or legal check completed · proposal value corrected · medical requirement raised · claim moved a stage · service request breached SLA · complaint opened · new offer approved · renewal approaching · new discrepancy · commitment breached\n\n**Recency-weighted:** Latest transactions, conversations, documents and status changes outrank old history. If the underlying data is stale, the brief says so.\n\n**Stays current:** The brief refreshes when a payment lands, a document arrives, an alert fires or a workflow stage changes, so it isn't an old snapshot.\n\n**Supporting line:** If nothing changed, don't make the user reread it.\n\n---\n\n## 8. Ask This. Verify That. Don't Repeat That. Don't Say That.\n\n**Headline:** A conversation plan, not a data dump.\n\nFour blocks with examples:\n\n**Ask (moves the case forward)**\n- *Lending:* Has your income changed since application? Is the vehicle EMI still active?\n- *Insurance:* Have you reviewed the premium payment term? Is the pending income document ready?\n- *Collections:* What changed after the last commitment? What's payable now?\n- *Wealth:* Is the upcoming maturity for reinvestment or withdrawal?\n\n**Verify (turn unknowns into an agenda)**\nCurrent income · co-applicant employment · property usage · nominee · that the customer received the sanction letter · payment date\n\n**Don't repeat (respect what's known)**\nAddress already confirmed · nominee already captured · business vintage verified · required document already received · complaint details already recorded\n\n**Don't say (known policy boundaries, where configured)**\nDon't state approval is guaranteed · don't promise unsupported returns · don't state a loan amount as approved before sanction · don't change settlement terms outside authority · don't state a claim outcome before the authorised decision\n\n**Supporting line:** Ask the questions that move the case forward, not the ones the organisation already knows the answer to.\n\n---\n\n## 9. Every Meeting Gets an Objective, Priorities and a Readiness Check\n\n**Headline:** Don't confuse having a meeting with progressing the journey.\n\nThree blocks:\n\n**a) Objective:** One primary objective from journey stage and open actions (complete PD and resolve the obligation discrepancy · secure a realistic repayment commitment · complete the medical requirement and reconfirm the payment term · resolve the escalated service request), plus a secondary one only when the first is closed. Where an action is regulated, your workflow defines the allowed action set.\n\n**b) Topic priority:** The brief ranks topics *inside the meeting*, not customers: resolve the open complaint → collect the missing KYC document → discuss the approved renewal option.\n\n**c) Readiness:**\n- **Ready:** required context available\n- **Ready with open items:** meeting can proceed, specific items need attention\n- **Preparation required:** critical context or a source is unavailable\n\n*Meeting scheduled doesn't mean meeting ready.*\n\n---\n\n## 10. Same Customer. Different Role. Different Brief.\n\n**Headline:** A collector, a credit officer and an advisor need different preparation.\n\n| Role | The brief focuses on | Example |\n|---|---|---|\n| **Collections** | DPD, outstanding, payment history, promise-to-pay, dispute, approved action band | \"Last promise broken. Dispute open. Reassess plan.\" |\n| **Credit / field lending** | Application, obligations, evidence, discrepancies, pending credit items | \"Vehicle EMI seen in earlier call but not in the application. Bank statement pending.\" |\n| **Insurance advisor** | Proposal state, disclosures, customer questions, pending medical or documents | \"Hypertension disclosed. Medical report pending. Customer asked about payment term.\" |\n| **Relationship manager / wealth** | Relationship, upcoming maturity, stated goals, service items | \"Maturity due. Home-purchase goal mentioned. KYC address update open.\" |\n| **Service executive** | Complaint history, SLA, previous promises, required resolution | \"Third contact. Promise of 48-hour fix missed.\" |\n| **Claims** | Claim stage, documents pending, previous queries, SLA | \"Two documents pending. Explain current stage.\" |\n| **Branch** | Appointment reason, failed digital step, open request, KYC status | \"Continue the earlier request, not a new ticket.\" |\n\n**Dynamic depth:** *Quick* (routine touchpoint), *Standard* (sales, service, collections), *Enhanced* (high-value, complaint, credit or underwriting exception, high DPD, repeat broken commitment, compliance-sensitive journeys).\n\n---\n\n## 11. Grounded in Evidence and Alerts. Honest About Unknowns.\n\n**Headline:** Know what's proven and what still needs verification.\n\n**Copy:** The brief carries forward what your other systems already know. From Evidence Intelligence it shows evidence-supported fields, conflicts, missing or stale evidence and reviewer-adopted values. From Alert Intelligence it shows open compliance, commitment, complaint and discrepancy alerts relevant to this meeting.\n\n**Example:** *Open alert: Promise-to-Pay Not Fulfilled. Promised ₹25,000 by 20 Sep. Payment received: none. Alert age: 3 days.*\n\n**Every brief item carries a status:** Confirmed · Customer-stated · Document-supported · System-derived · Conflicting · Stale · Missing · Needs verification\n\n**And a source:** CRM · LOS · LMS · policy or claims system · prior transcript · voice or field interaction · document · workflow event, with date and timestamp.\n\n**Supporting line:** Preparation should be grounded in evidence, not AI memory.\n\n---\n\n## 12. Compliance and Knowledge, Ready Before the Meeting\n\n**Headline:** The right rules and answers, loaded before the customer asks.\n\nTwo blocks:\n\n**a) Compliance preparation:** For configured journeys, the brief lists mandatory disclosures, consents, required documents, acknowledgements, restricted statements and steps that can't be skipped. *Insurance: premium payment term confirmation, benefit explanation, declaration pending. Lending: consent required before an authorised data action, relevant disclosure pending.*\n\n**b) Meeting-specific knowledge pack:** Not the whole knowledge base, just the few items this meeting needs (EMI-date change rule, prepayment rule, disbursement condition, rider condition, claim document list), from approved sources only.\n\n**Objections with history:** Previous objections (rate, premium, lock-in, \"need to discuss with family\") appear with what was explained before, whether it was resolved and the approved answer, so nobody restarts a pitch that already has history.\n\n---\n\n## 13. Before → During → After\n\n**Headline:** Preparation becomes live assistance the moment the meeting starts.\n\nThree columns:\n\n**BEFORE (Pre Meet)**\nBuilds the brief. *Customer objected to the EMI date last time. Policy allows dates 5–12. Salary date on record is the 7th. Sanction letter is an open commitment.*\n\n**DURING (live assist)**\nThe same context powers live assist (Sherpa and other Darwix agents). If the customer asks about the EMI date again, the approved policy is surfaced instantly. If they ask for the sanction letter, the system already knows it's an open commitment.\n\n**AFTER (post-meet continuity)**\nThe outcome writes into the next brief: new commitments (both sides), updated preferences, new discrepancies, documents received or pending, new objections, next action, owner, due date.\n\n**Cross-channel memory:** A customer asks for a branch appointment on a call, receives a document link on WhatsApp and uploads the document. The field officer already knows the document is in.\n\n**Supporting line:** Prepare before. Assist during. Act after. Every meeting makes the next one smarter.\n\n---\n\n## 14. Preparation Work Done Before They Ask\n\n**Headline:** Agentic prep, so the officer doesn't have to chase.\n\n**Where authorised, Darwix can automatically:** Fetch the latest account and proposal state · check whether the promised payment arrived · check whether the promised document was received · check the open service request · retrieve the latest valuation or document · generate the missing-document list · prepare approved follow-up links or communication templates · assemble the knowledge pack\n\n---\n\n## 15. Prepare the Professional. Don't Replace Them.\n\n**Headline:** AI prepares the meeting. The frontline professional owns the conversation and the decision.\n\n| Darwix does | The professional and institution control |\n|---|---|\n| Retrieves and summarises context | Credit and underwriting decisions |\n| Extracts commitments | Claims decisions |\n| Detects changes and open actions | Settlement authority |\n| Suggests questions | Regulated advice and product recommendation |\n| Surfaces risks and approved opportunities | Legal and fraud conclusions |\n| Prepares knowledge and next-action context | Customer remediation and material exceptions |\n\n**Principles (state on page):**\n- **Evidence-backed risk only:** the brief shows existing exceptions, alerts and discrepancies. It doesn't label or speculate about a customer.\n- **Opportunity from explicit need or approved logic:** renewal, an approved offer, or a product the customer asked about. No speculative profiling and no blind pitch.\n- **Preparation isn't a scorecard:** briefing analytics show workflow quality. They don't score employee competence.\n\n---\n\n## 16. Configured to Your Frontline\n\n**Headline:** Preparation that fits the role, journey and product.\n\n**Configurable:** Brief sections and length · data sources and lookback period · required product fields · objective rules · risk and opportunity rules · compliance and document checklists · question templates · role-specific views · source priority and recency weighting · escalation rules · live-assist handoff · post-meeting actions\n\n**Integrations:** CRM · LOS · LMS · policy admin · underwriting · claims · collections and service systems · wealth and portfolio platforms · KYC · DMS · payment and communication platforms · data warehouse · knowledge base · Darwix Sherpa, Voice, Evidence Intelligence and Alert Intelligence\n\n**Governance tiles:**\n- **Role-based context:** users see only the data they're authorised to see\n- **Need-based retrieval:** the meeting's context, not the whole customer record\n- **Sensitive-data controls:** masking and restricted display for financial, medical, identity and legal data\n- **Source traceability and audit:** what was retrieved, what the brief said and when, and refresh history\n- **Deployment and residency:** on-prem, VPC or cloud per your policy\n\n**Badges:** SOC 2 Type II · ISO 27001 (as on the Compliance page) · link to Compliance\n\n---\n\n## 17. Business Impact\n\n**Headline:** Better preparation creates better conversations. Better conversations create faster outcomes.\n\nValue tiles (bold headline, one line each):\n- **Cut preparation time:** one brief replaces tab-hunting\n- **Continue, don't restart:** customers stop repeating themselves\n- **Raise first-meeting completion:** documents, open tasks and questions known in advance\n- **Keep promises visible:** yours and the customer's\n- **Surface risk early:** discrepancies, alerts and unresolved issues before the conversation\n- **Prepare for compliance:** mandatory steps known before the meeting\n- **Sell with relevance:** approved opportunities tied to what the customer actually said\n- **Recover service failures:** full complaint history in hand\n\n**Operational visibility (one line):** Meetings briefed, brief freshness, open commitments and missing documents surfaced, meetings with a defined objective, follow-up completion, and the most common blockers and objections carried forward.\n\n---\n\n## 18. Why Darwix\n\nEight pillars, one line each:\n**Omnichannel** (field, voice, video, branch, systems) · **Journey-aware** (lending, insurance, collections, service, claims, wealth) · **Commitment-aware** (both sides) · **Change-aware** · **Role-aware** · **Evidence- and alert-aware** · **Action-oriented** (objective, questions, next steps) · **Live-assist ready**\n\n**Supporting line:** Not another customer summary. Intelligence for the next conversation.\n\n---\n\n## 19. FAQ\n\n1. **What is Darwix Pre Meet Intelligence?** A preparation layer that combines customer, account, interaction, commitment, document, evidence, alert and workflow context into a concise brief before a BFSI customer meeting.\n2. **Is it just a CRM summary?** No. A CRM summary reflects one system. This combines CRM, LOS, LMS, policy, claims, service, prior conversations, documents, evidence and alerts, and turns them into objectives, questions and next actions.\n3. **What does the brief contain?** Depending on the role: customer snapshot, account state, last interaction, commitments, open actions, what changed, risks, missing documents, approved opportunities, questions, compliance watch-outs and next actions.\n4. **Can it use previous call or field conversations?** Yes, where authorised. It surfaces key statements, objections, commitments, open questions and outcomes.\n5. **Can it show commitments made by our own agents?** Yes. Organisation commitments appear next to customer commitments, checked against system events.\n6. **Can it show what changed since the last meeting?** Yes. It ranks payments, documents, alerts, stage changes, complaints, evidence and breached commitments.\n7. **Can it prepare different briefs for different roles?** Yes. Credit, collections, advisor, RM, service, claims and branch users each get their own focus.\n8. **Can it tell the user what to ask, and what not to repeat?** Yes, from unresolved information and information already captured and confirmed.\n9. **Can it work with Sherpa?** Yes. Pre-meeting context can power live field assist during the conversation.\n10. **Can it surface compliance requirements?** Yes, for configured journeys: mandatory disclosures, consents, documents and process steps.\n11. **Does it make credit or underwriting decisions?** No. It prepares the user. Accountable decisions stay with your authorised people and systems.\n12. **Can it surface cross-sell or renewal opportunities?** Only institution-approved ones grounded in explicit customer need or approved eligibility logic, never speculative recommendations.\n13. **How current is the brief?** It refreshes when source systems report new payments, documents, alerts, workflow changes or customer responses.\n\n---\n\n## 20. Closing CTA Block\n\n**Headline:** Make every customer meeting start with context.\n\n**Copy:** Bring customer history, account status, previous conversations, commitments, open actions, evidence, alerts and next steps into one actionable brief before the interaction begins.\n\n**CTA:** **See Pre Meet Intelligence in Action**\n\n**Form:** Reuse the site's standard \"Request a Personalized Demo\" form and value bullets.\n\n---\n\n## Open Items to Confirm Before Publishing\n\n- **Positioning vs CRM-native meeting prep:** AI meeting briefs already exist inside CRMs, mostly for wealth RMs and sales teams. Confirm the page leans on what's distinct: field and branch frontlines, LOS/LMS/policy/claims context (not just CRM), commitments checked against system events, and live-assist handoff.\n- **Metrics:** No quantified claims (prep time saved, first-meeting completion, repeat-question reduction) are included. Add only measured pilot data. Third-party figures on prep time shouldn't be reused without a citable source.\n- **Feature readiness:** Confirm which items are live versus roadmap: commitment extraction and system-event checking, what-changed ranking, role-specific briefs, and the Sherpa live-assist handoff.\n- **Link to other Darwix products:** The page relies on Sherpa, Voice, Evidence Intelligence and Alert Intelligence as sources. Confirm which integrations exist today.\n- **Delivery surface:** Confirm where the user receives the brief (mobile for field teams, desktop, or in the CRM), since field users have minutes between visits.\n- **Data consent and access:** Confirm what previous conversation data can lawfully feed briefs and what role-based access rules apply, and have Compliance review the \"what not to say\" and compliance-prep language.\n- **Customer proof and demo:** Add a named logo or quote only if approved. The §4 demo needs synthetic data.\n"},{"id":"r-Retail_Asset_Document_Discrepancy","name":"Retail_Asset_Document_Discrepancy.md","text":"# PRD: Darwix AI Retail Asset Evidence Intelligence Page (Document Discrepancy for ARCs)\n\n**Scope:** Content of the Retail Asset Evidence Intelligence page for ARCs only. Navigation, entry points, layout and visual design are out of scope.\n**Version note:** This is the same product as the earlier Retail Asset Evidence Intelligence PRD, reframed around the \"Document Discrepancy\" name. Where the earlier version led with *seller tape vs documents*, this one leads with **documents disagreeing with each other** inside the loan file (names, amounts, dates, property descriptions, execution, missing pages), and then adds the tape lens. Use one page. Do not publish both.\n**Audience:** Asset Reconstruction Companies: acquisition and investment heads, legal, credit and valuation diligence heads, and portfolio/analytics teams evaluating retail stressed-asset pools. Selling banks and NBFCs are a secondary reader.\n**What the product is:** A diligence layer for retail stressed-asset pools. It matches every file in a seller data room to its account, reads each document, and finds where documents disagree with each other, with the seller tape, or with what should exist. It tells you which discrepancies are harmless variants, which are timing, and which touch ownership, security, enforceability or value, each traced to the exact page.\n**Page goal:** Make the reader believe one thing: *in an \"as is, where is\" purchase, every unresolved discrepancy in a loan file is your risk. Darwix finds them across the whole pool before you bid.*\n**Positioning guardrails (state them on the page):**\n- Not OCR, not a legal opinion and not a pricing engine. Darwix surfaces and sequences evidence. Your legal team decides sufficiency and enforceability. Your committee decides value and price.\n- A discrepancy is a finding for review, not a conclusion.\n**Voice:** Match darwix.ai: confident, short, outcome-led, in ARC diligence language. Every section leads with a claim, then proof.\n\n---\n\n## 1. Hero\n\n**Eyebrow:** DOCUMENT DISCREPANCY INTELLIGENCE · BUILT FOR ARCs\n\n**Headline:** Every loan file has documents that disagree. Find them before you bid.\n\n**Subhead:** Darwix reads the whole retail data room, matches each document to its account, and finds where the sanction letter, agreement, mortgage, title, valuation, ledger and legal notice contradict each other or the seller tape. Every finding is classified, prioritised by consequence and linked to the exact page, row or transaction.\n\n**Capability line:** Document-to-Account Matching · Cross-Document Discrepancy Detection · Seller Tape Reconciliation · Missing & Stale Evidence · Evidence Lineage · Seller Clarification · Pool Triage · ARC-Adopted Case\n\n**Proof strip:** Documents checked against each other, not just the tape · Harmless variants separated from real conflicts · Every finding traced to page and row · The ARC decides value, price and legal sufficiency\n\n**CTAs:** Primary: **Request a Retail Asset Diligence Demo**. Secondary: **See a loan file swept** (scrolls to §4).\n\n---\n\n## 2. The Problem: A Loan File Is Made by Many Hands. The Tape Shows None of the Gaps.\n\n**Headline:** In an \"as is, where is\" sale, whatever the file gets wrong becomes your risk.\n\n**Copy:** A retail loan file is assembled over years by different people: the sanction letter, the agreement, the mortgage, the title chain, a valuation, a legal scrutiny report, statements, notices. When they disagree, the question stops being clerical. A borrower's name spelt three ways. A flat number with two digits swapped between the mortgage and the valuation. A mortgage executed before the sanction date. An amount secured that differs from the amount sanctioned. A demand notice quoting a different figure than the ledger. The seller tape carries none of this, portfolios are sold without recourse, and the diligence window is short. Teams sample a handful of files and hope the rest are clean.\n\n**Three-line pain strip:**\n- **Too many files:** a pool can run to thousands of accounts, and manual review reaches a fraction.\n- **Discrepancies hide in plain sight:** each document looks fine alone. The problem is between them.\n- **No proof trail:** findings sit in spreadsheets, without the page that shows them.\n\n**Closing line:** Review every file, not a sample. Explain every finding, not just flag it.\n\n---\n\n## 3. Two Lenses. One Evidence Case.\n\n**Headline:** Find discrepancies between documents, and between documents and the tape.\n\nTwo blocks and a third:\n\n**Lens 1: Document vs document (inside the file)**\nDo the parties, amounts, terms, dates, property description and execution details agree across the sanction letter, agreement, mortgage, title, valuation, legal report and statements?\n\n**Lens 2: Document vs seller tape (against the claim)**\nDoes the tape's balance, last payment, valuation, ownership, legal stage and \"documents complete\" flag match what the documents and ledgers show, allowing for the tape's cut-off date?\n\n**Plus: what should exist but doesn't**\nMissing documents, missing pages and annexures, unreadable scans, duplicates, superseded versions and stale evidence, checked against your diligence checklist.\n\n**Supporting line:** Verify the tape. Reconcile the file. Understand the asset.\n\n---\n\n## 4. Signature Section: One Loan File, Eight Discrepancies\n\n**Headline:** Watch one retail mortgage file get swept.\n\n**Format:** A file view. The documents are shown as a stack on the left and the discrepancy register builds on the right, each row linked to the pages that disagree. *(Synthetic data.)*\n\n**The file (account HL-241872):** Sanction letter · loan agreement · mortgage deed · title document · valuation report · legal report · SOA and repayment ledger · demand notice · seller tape\n\n| # | What the documents say | Darwix finding |\n|---|---|---|\n| 1 | Borrower: \"Rakesh Kumar Sharma\" (sanction), \"Rakesh K. Sharma\" (agreement), \"Rakesh Sharma\" (title) | **Name Variant.** Same party likely. Low severity. Confirm against KYC |\n| 2 | Property: \"Flat 402, Tower B\" (mortgage) vs \"Flat 204, Tower B\" (valuation) | **Property Description Mismatch.** Digits transposed or a different unit. **High.** Security identity in question |\n| 3 | Sanction ₹30.0L. Mortgage secures ₹28.0L. Disbursement advice ₹30.0L | **Secured Amount Differs from Sanction.** **High.** Security may not cover the full exposure |\n| 4 | Interest 10.50% (agreement) vs 10.25% (sanction letter) | **Loan Term Mismatch.** Medium. Confirm which governs |\n| 5 | Mortgage executed 04 Mar. Sanction dated 11 Mar | **Date Sequence Anomaly.** Security created before sanction. Review |\n| 6 | Agreement names a guarantor. No guarantee document in the file | **Guarantor Document Missing.** High |\n| 7 | Demand notice quotes ₹27.4L. Ledger on the notice date shows ₹26.9L | **Notice Amount vs Ledger Difference.** High. Flag for legal review |\n| 8 | Agreement page 7 (repayment schedule annexure) absent from the scan | **Missing Page / Annexure.** Medium |\n\n**Then the tape lens:** Tape shows outstanding ₹24.8L and property owner \"Borrower\". The latest SOA shows ₹24.1L after a recovery on 28 Aug, and the title shows borrower + spouse. → **Stale/Newer** balance and an **Additional Co-Owner**.\n\n**Result:** Eleven raw differences become a prioritised list. Two are harmless. Five affect security, ownership or enforcement and go to legal. The rest go to the seller as precise queries.\n\n**Closing line:** Nothing here is exotic. It's just hidden between documents no one had time to compare.\n\n---\n\n## 5. Seven Families of Document Discrepancy\n\n**Headline:** Where loan files disagree with themselves.\n\n| Family | What Darwix compares | Example |\n|---|---|---|\n| **Parties & identity** | Borrower, co-borrower, guarantor names, relationships and identifiers across KYC, sanction, agreement, mortgage, title | Guarantor named in agreement, missing from guarantee |\n| **Amounts & terms** | Sanction, disbursement, secured amount, rate, tenure, EMI, moratorium, charges | Mortgage secures less than sanctioned |\n| **Property & security** | Address, unit, area, survey or plot details, owner, co-owner, charge and title reference across sanction, mortgage, title, valuation, legal report | Flat number differs between mortgage and valuation |\n| **Dates & sequence** | Sanction → agreement → disbursement → security → default → notice → filing | Security executed before sanction |\n| **Execution & completeness** | Missing pages, annexures, schedules, execution indicators (where configured), unreadable sections | Repayment schedule annexure missing |\n| **Financial records** | SOA, ledger, receipts, demand and settlement statements | Notice amount differs from ledger |\n| **Legal & enforcement documents** | Notice dates and amounts, case details, stage, subsequent events | Enforcement moved after the tape cut-off |\n\n**Supporting line:** Each document looks fine alone. Darwix finds the problem between them.\n\n---\n\n## 6. Not Every Mismatch Is a Problem. Every Mismatch Gets a Meaning.\n\n**Headline:** Classify the difference, then rank it by consequence.\n\n**Same look, different meaning:**\n- \"Rakesh K. Sharma\" vs \"Rakesh Kumar Sharma\" → **Name Variant** (low, confirm)\n- \"Rakesh Sharma\" vs \"Rajesh Sharma\" → **Different Party?** (high, review)\n\n| Class | Meaning | Example |\n|---|---|---|\n| **Agrees** | Sources support the same fact | Sanction amount matches agreement |\n| **Variant / Typographical** | Same fact, different spelling or formatting | Name initials, date formats, address abbreviations |\n| **Contextual** | Related but different concepts | Principal vs total dues including interest |\n| **Conflict** | Incompatible values for the same fact | Flat 402 vs Flat 204 |\n| **Stale / Newer** | A later source supersedes an earlier value | August tape balance vs September SOA |\n| **Subsequent Event** | The account changed after the cut-off | Later legal stage |\n| **Enriched** | A document adds a fact the tape lacks | Co-owner on the title |\n| **Missing / Quality** | Expected evidence absent, partial or unreadable | Guarantee deed not in the file |\n\n**Severity reflects consequence:** ownership · security identity and coverage · enforceability-relevant documents · financial exposure · recovery path · evidence incompleteness. A discrepancy touching security identity outranks a larger number that only reflects timing.\n\n---\n\n## 7. The Tape Lens: Claims vs Evidence, With the Cut-Off in Mind\n\n**Headline:** A tape correct at cut-off can still be wrong today.\n\nCompact table:\n\n| Tape claims | Evidence shows | Finding |\n|---|---|---|\n| Outstanding ₹24.80L (31 Aug) | SOA ₹24.10L (15 Sep). Ledger: ₹70,000 recovery on 28 Aug | **Stale / Newer.** Evidence-supported ₹24.10L |\n| Last payment 10 Jul | Ledger: recovery 28 Aug | **Last-Payment Stale** |\n| Property value ₹72L | Latest valuation ₹61L (3 Sep) | **Material Valuation Difference** |\n| Valuation \"available\" | Only a 3-year-old report in the room | **Stale Valuation Evidence** |\n| Legal: demand notice issued | Legal report shows later enforcement action | **Subsequent Event** |\n| Security documents: complete | Mortgage deed absent | **Critical Document Missing** |\n| Settlement: none | OTS accepted after cut-off | **Subsequent Settlement Event** |\n\n**Three values, nothing overwritten:** *Seller value* (what the tape said) → *evidence-supported value* (what the documents currently support) → *ARC-adopted value* (what your reviewer accepts, with reason and evidence). The seller's original stays on record.\n\n---\n\n## 8. Show Me the Proof\n\n**Headline:** Every finding carries the exact page.\n\n**Copy:** For each discrepancy Darwix keeps the two (or more) source locations side by side: document and version, page, table or row, ledger entry, extracted and normalised values, date, confidence, reviewer action and clarification history. The reviewer opens the finding, sees the conflicting pages together and decides.\n\n**Example finding card:**\n\n| | |\n|---|---|\n| **Finding** | Property Description Mismatch |\n| **Mortgage deed** | \"Flat 402, Tower B\" → page 3, schedule of property |\n| **Valuation report** | \"Flat 204, Tower B\" → page 2, property details |\n| **Title document** | \"Flat 402, Tower B\" → page 5 |\n| **Classification / Severity** | Conflict · High |\n| **Confidence** | High (two of three sources agree; valuation is the outlier) |\n| **Status** | Legal / valuation review |\n\n**Confidence, explained:** extraction quality, source agreement, document quality, freshness and rule certainty, not one opaque score.\n\n---\n\n## 9. What's Missing, Incomplete or Out of Date\n\n**Headline:** \"Document available\" isn't the same as usable evidence.\n\nThree blocks:\n\n**a) Match evidence to accounts:** Every file linked to the right loan account. Duplicates, unmatched files, files that fit several accounts and accounts with incomplete packs are surfaced. *First diligence question: do we have the evidence for this account?*\n\n**b) Your checklist, per asset type:** Each document shows *Available · Missing · Partial · Unreadable · Wrong account · Duplicate · Old version · Missing page · Review required.* *Tape: \"Security documents complete.\" Room: mortgage deed absent → Critical Security Document Missing → seller query.*\n\n**c) Freshness and versions:** Valuations, legal reports and SOAs carry their dates against thresholds you set. A valuation that matches the tape can still be too old. Duplicates and superseded versions are identified so an old copy never quietly becomes the source of truth.\n\n---\n\n## 10. From 5,000 Files to the Ones That Need an Expert\n\n**Headline:** See the shape of the pool. Then prove it account by account.\n\n**Pool triage:**\n\n| Segment | Meaning |\n|---|---|\n| **Low exception** | Documents agree with each other and the tape |\n| **Financial reconciliation required** | Balance, recovery or notice-amount differences |\n| **Security review required** | Property description, ownership, secured amount or charge issues |\n| **Valuation review required** | Stale, missing or materially different |\n| **Legal review required** | Enforcement documents stale, missing or conflicting |\n| **Seller clarification required** | Material evidence missing |\n| **High evidence gap** | Document coverage below your standard |\n\n**Pool discrepancy view:** Discrepancies by family, by severity, by seller, product and geography · accounts with security-identity conflicts · exposure affected by each finding category · accounts blocked and accounts ready for review.\n\n**Drill-down (illustrative):** *₹8.2 crore exposure with property-description or security conflicts → 214 accounts → HL-241872 → mortgage vs valuation → page 3 vs page 2 → status.*\n\n**Quantify what changed (deterministic only):** Seller vs evidence-supported outstanding · aggregate post-cut-off recoveries · exposure with missing security documents · exposure on stale valuations · aggregate property-value delta. Your team decides how these affect pricing.\n\n---\n\n## 11. Ask the Seller the Exact Question the Evidence Creates\n\n**Headline:** Clarification that stays in the evidence trail.\n\n**Copy:** Unresolved findings become structured queries, with responses re-entering the same trail and re-running only the affected checks.\n\n**Example query:**\n\n| | |\n|---|---|\n| **Account** | HL-241872 |\n| **Finding** | Property Description Mismatch |\n| **Evidence** | Mortgage p.3 and title p.5: Flat 402. Valuation p.2: Flat 204 |\n| **Request** | Confirm the correct unit and provide the corrected valuation or supporting note |\n| **Priority · Due** | High · configured date |\n\n**Response handling:** Link the response to the finding · ingest new documents · re-run only affected comparisons · update the evidence-supported value · preserve the history · close or reopen.\n\n**What you can see:** Open queries · time awaiting the seller · critical queries overdue · accounts and exposure blocked by unanswered queries.\n\n---\n\n## 12. The ARC-Adopted Case and Review Pack\n\n**Headline:** Move from data room to committee pack without rebuilding the file by hand.\n\nThree blocks:\n\n**a) Account status:** Evidence Complete · Complete with Findings · Clarification Required · Blocked: Critical Document Missing · Blocked: Material Conflict · Ready for ARC Review · Reviewed with Exception\n\n**b) Reviewer resolution:** Accept seller value · accept evidence-supported value · adopt another supported value · mark as variant or timing · accept with exception · request evidence · route to legal, valuation or financial diligence · defer. Each records reviewer, reason, evidence and date.\n\n**c) Packs:** *Account pack:* seller snapshot, discrepancy register, seller vs evidence comparison, financial reconciliation, property and security evidence, legal timeline, missing documents, clarifications, adopted values, source index, audit trail. *Pool pack:* portfolio summary, segmentation, discrepancy categories, exposure affected, document-completeness and valuation-age summaries, open queries, blocked and ready accounts.\n\n**Asset timeline:** Sanction, disbursement, security, repayment, default, notice, recovery, settlement, valuation, tape cut-off and later events in one view. *When the chronology is visible, many apparent discrepancies explain themselves.*\n\n---\n\n## 13. AI Prepares the Evidence. Your Experts Decide.\n\n**Headline:** Judgment stays with the ARC.\n\n| Darwix does | The ARC controls |\n|---|---|\n| Ingests and matches the data room | Legal sufficiency and enforceability of security and documents |\n| Extracts and normalises fields | Valuation acceptance |\n| Finds discrepancies across documents and the tape | Recovery assumptions |\n| Detects missing, stale and superseded evidence | Haircuts, pricing and bid value |\n| Calculates deterministic deltas | Policy exceptions |\n| Generates findings and seller queries | Account inclusion or exclusion |\n| Reprocesses seller responses | Acquisition and committee decisions |\n| Builds account and pool packs | |\n\n**Boundary lines (state on page):**\n- Darwix surfaces and sequences legal and enforcement documents. It doesn't give a legal opinion.\n- It surfaces delinquency chronology. It doesn't make a regulatory NPA classification unless your configured rules define one.\n- Seller evidence-quality analytics show data quality. They are not an automated rating of the seller.\n\n**How it decides:** Deterministic rules for amounts, dates, sequence and thresholds. AI for reading documents, matching names and entities, and understanding messy tape schemas. Both are recorded in the trail.\n\n---\n\n## 14. Configured to Your Diligence Standards. Governed Like a Data Room.\n\n**Headline:** Your checklist, your thresholds, your controls.\n\n**Configurable:** Asset type and product · seller field mapping · mandatory documents · source hierarchy · financial and date tolerances · name-variant thresholds · valuation-age and materiality thresholds · severity by discrepancy family · seller-query templates · reviewer and adopted-value permissions · review-ready rules · pool segmentation\n\n**Integrations:** Virtual data rooms · SFTP · DMS · ARC asset-management platform · LMS · collection, recovery and legal case systems · valuation platforms · data warehouse · workflow tools. Returns structured evidence, findings, adopted values, seller queries, review status and packs.\n\n**Governance tiles:**\n- **Data-room confidentiality:** process only data authorised for diligence, deployable in your own environment\n- **Role-based access:** borrower, property, legal and reviewer data by role\n- **Sensitive-data protection:** PII and financial data protected in transit and at rest\n- **Source integrity:** file identity and version preserved\n- **Full audit trail:** tape version, files and versions, extraction and rule versions, findings, queries and responses, reviewer actions, adopted values\n- **Reproducible after the deal:** reconstruct why a value was adopted, months later\n- **Residency and retention:** on-prem, VPC or cloud per your policy\n\n**Badges:** SOC 2 Type II · ISO 27001 (as on the Compliance page) · link to Compliance\n\n**After the bid (one line):** The structured case carries into onboarding, recovery strategy, legal follow-up, valuation refresh and audit.\n\n---\n\n## 15. Business Impact and Why Darwix\n\n**Headline:** More files reviewed. More proof behind every bid.\n\nValue tiles (bold headline, one line each):\n- **Cover the pool, not a sample:** every file checked, not a handful\n- **Find what sits between documents:** discrepancies no single-document review catches\n- **Prioritise by consequence:** security identity and ownership before formatting noise\n- **Catch what changed after cut-off:** recoveries, settlements, legal events\n- **Cut seller query cycles:** precise, evidence-linked questions\n- **Focus specialists:** legal, valuation and financial experts on real exceptions\n- **Use the bid window for judgment:** not for rebuilding the data room\n- **Defend every adopted value:** source, reviewer and reason on record\n\n**Why Darwix (eight pillars):** **Retail-scale** · **Cross-document** · **Tape-aware** · **Time-aware** · **Variant-aware** (harmless vs real) · **Evidence-linked** · **Clarification- and resolution-aware** · **Pool-aware and ARC-controlled**\n\n**Supporting line:** Not document extraction. Evidence-grade retail asset diligence.\n\n---\n\n## 16. FAQ\n\n1. **What is Retail Asset Evidence Intelligence for ARCs?** An AI diligence platform for retail stressed-asset pools. It finds discrepancies between the documents in each loan file, and between those documents and the seller tape, then produces an explainable, review-ready case per account and per pool.\n2. **Is it OCR?** No. OCR is one input. The product matches documents to accounts, compares them with each other and the tape, classifies differences, detects missing or stale evidence, manages seller queries and preserves lineage.\n3. **What kinds of discrepancies does it find?** Parties and identity, amounts and terms, property and security description, dates and sequence, execution and completeness, financial records, and legal or enforcement documents.\n4. **How does it avoid false alarms?** It classifies each difference (variant, contextual, conflict, stale or newer, subsequent event, enriched, missing) and ranks by consequence, with name and format variants separated from real conflicts.\n5. **Can it process any seller tape format?** Seller fields are mapped into a standard model, and original field names and values are kept.\n6. **Can it reconcile balances and recoveries after the cut-off?** Yes. It compares tape outstanding with SOAs, ledgers and receipts and identifies whether a difference is a conflict, a stale value or a later transaction.\n7. **Can it tell if security documents are complete?** You configure the checklist. Darwix shows what's available, missing, partial, duplicated or mismatched. Legal sufficiency stays with your legal team.\n8. **Can it check property and ownership consistency?** It compares address, unit, owner and co-owner across the mortgage, title, valuation, legal report and tape. Title conclusions stay with counsel.\n9. **Can it flag stale valuations?** Yes, against thresholds you set.\n10. **Can it analyse legal documents?** It classifies them, extracts configured events, dates and amounts, builds a timeline and flags missing or stale evidence. Interpretation stays with your lawyers.\n11. **What happens when the seller sends a new document?** It's linked to the account, processed as evidence, and only the affected findings re-run. History is preserved.\n12. **Does it overwrite the tape?** No. Seller, evidence-supported and ARC-adopted values are kept separately.\n13. **Can it work across the whole pool?** Yes. Findings roll up into segments, discrepancy categories, exposure affected, open queries and review readiness.\n14. **Does it recommend a bid price?** No. It quantifies deterministic evidence impacts. Pricing and bid decisions stay with your committee.\n15. **Can it run in our environment?** Deployment options include on-prem, VPC and cloud, with data-room confidentiality and access controls.\n\n---\n\n## 17. Closing CTA Block\n\n**Headline:** Turn every retail data room into an evidence-backed acquisition case.\n\n**Copy:** Sweep every loan file for the discrepancies between documents, reconcile them with the seller tape, and put the accounts that deserve expert attention in front of your team before you bid.\n\n**CTA:** **See Retail Asset Evidence Intelligence in Action**\n\n**Form:** Reuse the site's standard \"Request a Personalized Demo\" form and value bullets.\n\n---\n\n## Open Items to Confirm Before Publishing\n\n- **One page or two:** This PRD and the earlier Retail Asset Evidence Intelligence PRD describe the same product. Publish one. This version leads with cross-document discrepancies. The earlier one leads with tape vs evidence and pool triage. Both lenses are included here.\n- **Metrics:** No quantified claims (files per hour, discrepancy rates, diligence days saved, extraction accuracy) are included. The pool figures (5,000 accounts, ₹8.2 crore, 214 accounts) and file examples are synthetic. Replace with pilot data or keep clearly labelled.\n- **Capability claims to verify:** Confirm what Darwix actually does today before publishing the discrepancy families: name-variant matching across documents, property-description comparison, date-sequence checks, and detection of missing pages and annexures. Do not claim signature or stamp/registration verification unless it exists.\n- **Indian legal and document specifics:** Have legal advisers review references to legal scrutiny, title, mortgage, demand notice and enforcement wording. Confirm document types and languages supported, including regional-language and handwritten documents.\n- **Data-room confidentiality:** Confirm the deployment and data-handling story that satisfies seller NDAs.\n- **Feature readiness:** Confirm which items are live versus roadmap: document-to-account matching, pool triage, seller-query workflow and quantified impact.\n- **Customer proof and demo:** Add a named ARC logo or quote only if approved. The §4 demo needs a synthetic or anonymised loan file.\n"},{"id":"r-Retail_Asset_Evidence_Intelligence","name":"Retail_Asset_Evidence_Intelligence.md","text":"# PRD: Darwix AI Retail Asset Evidence Intelligence Page\n\n**Scope:** Content of the Retail Asset Evidence Intelligence page only. Navigation, entry points, layout and visual design are out of scope.\n**Audience:** Asset Reconstruction Companies (ARCs): acquisition and investment heads, diligence and credit heads, legal and valuation heads, and portfolio/analytics teams evaluating retail stressed-asset pools. Banks and NBFCs selling portfolios are a secondary reader.\n**What the product is:** The pre-acquisition diligence layer for retail stressed-asset pools. It matches every account in a seller's data room to its underlying evidence, reconciles the seller tape against loan, repayment, property, security, valuation and legal documents, classifies differences with the tape's cut-off date in mind, finds what's missing or stale, and turns thousands of accounts into a prioritised, evidence-backed acquisition view.\n**Page goal:** Make the reader believe one thing: *in an \"as is, where is\" sale, the seller tape is a claim. Darwix lets you verify it, account by account, inside the bid window.*\n**Positioning guardrails (state them on the page):**\n- Not OCR, and not a pricing engine. It prepares and verifies evidence. Pricing, haircuts, recovery assumptions, legal sufficiency and the acquisition decision stay with the ARC.\n- It surfaces and structures legal and security evidence. It doesn't give legal opinions.\n**Voice:** Match darwix.ai: confident, short, outcome-led, in the language of ARC diligence (tape, cut-off, data room, bid). Every section leads with a claim, then proof.\n\n---\n\n## 1. Hero\n\n**Eyebrow:** RETAIL ASSET EVIDENCE INTELLIGENCE · BUILT FOR ARCs\n\n**Headline:** Verify the asset behind the seller tape.\n\n**Subhead:** Darwix turns a retail seller data room into an evidence-backed acquisition case. It matches every account to its documents, reconciles tape values against loan, repayment, property, security, valuation and legal evidence, and shows you what agrees, what changed after the cut-off, what's missing and what deserves an expert's time before you bid.\n\n**Capability line:** Seller Tape Reconciliation · Document-to-Account Matching · Balance & Recovery Validation · Property & Security Verification · Valuation Freshness · Legal Timeline · Missing-Evidence Detection · Seller Clarification · Pool Triage\n\n**Proof strip:** Built for pool scale, not one file at a time · Time-aware: tape cut-off vs later events · Every finding traced to page, row or transaction · The ARC decides value and price\n\n**CTAs:** Primary: **Request a Retail Asset Diligence Demo**. Secondary: **See a pool triaged** (scrolls to §4).\n\n---\n\n## 2. The Problem: \"As Is, Where Is\" Puts the Diligence on You\n\n**Headline:** The seller tape is where diligence starts. It is not where it can stop.\n\n**Copy:** Retail is now a growth engine for India's ARC industry, and the pools are granular: thousands of accounts, each with its own loan file, repayment history, property, security, valuation and legal trail. Portfolios are sold on an \"as is where is, without recourse\" basis, from a data room, against a cut-off date, inside a diligence window of a few weeks. Whatever the tape doesn't show becomes your risk. A recovery after the cut-off. A stale valuation. A co-owner on the title. A security document the tape marks \"complete\" that isn't in the room. Finding these account by account, in spreadsheets, doesn't scale, so teams sample, and sampling misses.\n\n**Three-line pain strip:**\n- **Too many accounts:** manual diligence can't cover a retail pool, so coverage is partial.\n- **Too little time:** the bid window is short and the data room is messy.\n- **Too little proof:** findings live in spreadsheets and emails, not tied to source evidence.\n\n**Closing line:** Go deep enough to understand the asset. Move fast enough to evaluate the pool.\n\n---\n\n## 3. How It Works\n\n**Headline:** From raw data room to review-ready acquisition case.\n\nEight steps as a horizontal flow, one line each:\n\n1. **Ingest the data room:** Seller tape, loan and sanction documents, SOAs, ledgers, property, security, valuation and legal files, collection notes, spreadsheets, scans and folders.\n2. **Match evidence to accounts:** Link every file to the right loan account, flag duplicates, unmatched files and accounts with incomplete packs. *First diligence question: do we have the evidence for this account?*\n3. **Extract and normalise:** Pull material fields, standardise formats, keep the source location.\n4. **Reconcile against the tape:** Compare each seller value with the underlying evidence and with other sources.\n5. **Classify each difference:** Agrees, contextual, conflict, stale/newer, subsequent event, enriched, or missing.\n6. **Score materiality:** Apply your thresholds so a ₹1,000 variance and a missing co-owner aren't treated alike.\n7. **Clarify with the seller:** Turn unresolved findings into precise, evidence-linked queries. Responses re-enter the same trail.\n8. **Review and pack:** Record adopted values and build the account and pool acquisition packs.\n\n---\n\n## 4. Signature Section: One Retail Mortgage Account, Six Findings\n\n**Headline:** Watch a seller tape meet the documents behind it.\n\n**Format:** A case timeline. Left shows the tape claim and right shows Darwix's finding. Script below. *(Synthetic data.)*\n\n**Seller tape, account HL-241872 (cut-off 31 Aug):** Outstanding principal ₹24.80L · last payment 10 Jul · property market value ₹72L · owner: borrower · legal stage: demand notice issued · security documents: complete · settlement: none\n\n| Field | What the evidence shows | Darwix finding |\n|---|---|---|\n| **Outstanding principal** | SOA (15 Sep): ₹24.10L. Ledger: ₹70,000 recovery on 28 Aug | **Stale / Newer.** Evidence-supported value ₹24.10L. Explained by a recovery, not a ₹70,000 error |\n| **Last payment** | Ledger: recovery on 28 Aug, later than the tape's 10 Jul | **Last-Payment Date Stale** |\n| **Property owner** | Title document: borrower + spouse | **Additional Co-Owner Identified** (Conflict / Enrichment) |\n| **Valuation** | Latest valuation ₹61L (3 Sep), page 17 | **Material Valuation Difference,** ₹11L below the tape. Reviewer decision required |\n| **Legal stage** | Legal report records a later enforcement event | **Subsequent Event.** Tape status is stale, not wrong |\n| **Security** | Checklist expects a mortgage document that isn't in the room | **Critical Security Evidence Missing** → seller query raised |\n\n**Then:** The seller supplies the document. Darwix links it, re-runs only the affected finding, and keeps the query history. The reviewer opens the account with every finding, every source link and one open valuation decision.\n\n**Closing line:** The product didn't just extract the files. It reconstructed the evidence behind the asset.\n\n---\n\n## 5. Signature Section 2: From 5,000 Accounts to the Ones That Deserve an Expert\n\n**Headline:** Don't spend equal effort on every account.\n\n**Copy:** After reconciliation, Darwix segments the pool by what the evidence says, so specialists go where judgment is needed.\n\n| Segment | What it means |\n|---|---|\n| **Evidence-aligned** | Source evidence broadly supports the tape |\n| **Financial reconciliation required** | Balance or recovery differences to review |\n| **Security review required** | Property or security evidence has gaps |\n| **Valuation review required** | Valuation stale, missing or materially different |\n| **Legal review required** | Legal status stale, incomplete or conflicting |\n| **Seller clarification required** | Material evidence missing |\n| **High evidence gap** | Document coverage below your diligence standard |\n\n**Drill-down (illustrative):** *Pool finding: ₹8.2 crore exposure on stale valuations → 214 accounts → HL-241872 → tape ₹72L vs latest ₹61L → report page 17 → review status.*\n\n**Pool view shows:** Seller-reported vs evidence-supported outstanding · accounts fully reconciled · accounts with material conflict, missing critical documents, stale valuations, security gaps, ownership differences, newer recoveries or legal-stage changes · open seller queries · accounts ready for review · exposure affected by each finding category\n\n**Supporting line:** See the portfolio impact. Then prove it at account level.\n\n---\n\n## 6. Three Values. Nothing Overwritten.\n\n**Headline:** Know what was offered, what the evidence supports and what the ARC adopts.\n\n| Value | Meaning |\n|---|---|\n| **Seller value** | What the tape or dataset represented |\n| **Evidence-supported value** | What the latest relevant documents and transactions currently support |\n| **ARC-adopted value** | What your authorised reviewer accepts for the diligence case, with reason and evidence |\n\n**Example:** Outstanding principal. Seller ₹24.80L → evidence-supported ₹24.10L → adopted ₹24.10L. Reason: later recovery supported by ledger and SOA. The seller's ₹24.80L stays on record.\n\n---\n\n## 7. A Different Number Isn't Always a Discrepancy\n\n**Headline:** Time-aware reconciliation. The cut-off date changes what a difference means.\n\n| Class | Meaning | Retail-ARC example |\n|---|---|---|\n| **Agrees** | Sources support the same fact | Sanction amount matches the letter and agreement |\n| **Contextual** | Related but different concepts | Principal vs total dues including interest and charges |\n| **Conflict** | Incompatible values, same fact and time | Tape says borrower-owned, title says borrower + spouse |\n| **Stale / Newer** | A later source supersedes the tape value | August balance vs September SOA |\n| **Subsequent Event** | The account moved after the cut-off | Enforcement progressed after the tape snapshot |\n| **Enriched** | Evidence adds a fact the tape lacks | Documents reveal an extra co-owner |\n| **Missing / Quality** | Evidence absent, incomplete or unreadable | Valuation \"available\" on tape, not in room |\n\n**Supporting line:** Explain the difference before deciding what it's worth. Distinguish stale data from incorrect data.\n\n---\n\n## 8. Eight Diligence Lenses on Every Account\n\n**Headline:** Every place a retail asset can differ from its tape.\n\nEight compact cards, one line and one example finding each:\n\n- **Balance & recovery:** Rebuild what's owed from SOA, ledger and receipts. *\"₹50,000 recovery on 8 Sep not in tape.\"*\n- **DPD & NPA chronology:** Check delinquency dates against repayment history. *\"NPA date needs review against servicing evidence.\"* Surfaces the evidence. Doesn't make a regulatory classification.\n- **Sanction & loan terms:** Verify sanction, tenure, rate, EMI and co-borrowers against agreement and disbursement. *\"Sanctioned amount differs from tape.\"*\n- **Property & ownership:** One view of address, owner, co-owner, usage and possession. *\"Property in security schedule differs from tape address.\"*\n- **Security & document completeness:** Check the checklist you define. *\"Mortgage deed missing though tape says complete.\"*\n- **Valuation & freshness:** Know which value is current and how old it is. *\"Numbers match, but the report is three years old.\"*\n- **Legal & enforcement timeline:** Sequence notices, filings and events. *\"Possession-related action after cut-off.\"*\n- **Settlement/OTS & collections:** Bring settlements and recovery notes into the view. *\"OTS accepted after cut-off, not on tape.\"*\n\n**Boundary (state on page):** Darwix surfaces and sequences legal and security evidence. Your legal team decides sufficiency, validity and enforceability.\n\n---\n\n## 9. What's Missing Matters as Much as What's There\n\n**Headline:** \"Document available\" isn't the same as usable evidence.\n\nTwo blocks:\n\n**a) Missing evidence:** Against your checklist per asset type, each account shows each document as *Available · Missing · Partial · Unreadable · Wrong account · Duplicate · Old version · Missing page*.\n*Tape: \"Security documents complete.\" Data room: mortgage deed absent → **Critical Security Document Missing** → seller query.*\n\n**b) Quality and versions:** Blurred scans, cut-off pages, missing annexures, partial ledger periods, documents belonging to another account, no source date, duplicates and superseded versions are flagged so an old copy never silently becomes the source of truth.\n\n**Freshness:** Every critical source carries its date. A valuation that matches the tape can still be stale, and freshness thresholds are yours to set.\n\n---\n\n## 10. Review by Impact, Not by Number\n\n**Headline:** Materiality and confidence guide where reviewers look first.\n\n**Materiality considers:** Financial difference and percentage · exposure · property-value impact · security and legal relevance · document criticality · your policy thresholds. *A ₹1,000 dues variance may be below threshold. A missing co-owner on the security is high priority at any amount.*\n\n**Confidence, explained:** Not one opaque score. It reflects extraction quality, source agreement, document quality, freshness and rule certainty. *Title and loan agreement agree on owner → high. Only an old, low-quality valuation → low, refresh required.*\n\n**Every finding shows its proof:** Seller field and value · source document, version, page, table, row or ledger entry · date · extracted and normalised value · confidence · reviewer action · adopted-value history.\n\n---\n\n## 11. Seller Clarification That Lives in the Evidence Trail\n\n**Headline:** Ask the seller the exact question the evidence creates.\n\n**Copy:** Findings become structured queries instead of a spreadsheet of emails. Responses become new evidence, re-run only the affected checks, and keep the history.\n\n**Example query:**\n\n| | |\n|---|---|\n| **Account** | HL-008174 |\n| **Finding** | Property Ownership Conflict |\n| **Tape says** | Borrower only |\n| **Evidence shows** | Borrower + spouse (title, page 3) |\n| **Request** | Confirm the security ownership representation and provide the latest title / security documentation |\n| **Priority · Due** | High · configured date |\n\n**What you can see:** Open queries · awaiting seller · average response time · critical queries overdue · accounts and exposure blocked by unanswered queries.\n\n**Supporting line:** See exactly what is blocking the acquisition review.\n\n---\n\n## 12. Quantify What Changed. Keep the Pricing Yours.\n\n**Headline:** Turn evidence differences into numbers your committee can use.\n\n**Deterministic impacts Darwix can total across the pool:** Seller vs evidence-supported outstanding · aggregate post-cut-off recoveries · exposure with missing security documents · exposure on stale valuations · aggregate property-value delta · accounts with changed legal stage · accounts with settlements not on the tape · accounts blocked by missing evidence\n\n**Boundary (state on page):** Darwix quantifies the evidence impact. The ARC decides pricing, haircuts, expected recovery, bid value and the acquisition.\n\n---\n\n## 13. The Acquisition Review Pack\n\n**Headline:** Move from data room to committee pack without rebuilding the case by hand.\n\nThree blocks:\n\n**a) Account status:** Evidence Complete · Complete with Findings · Clarification Required · Blocked: Critical Document Missing · Blocked: Material Conflict · Ready for ARC Review · Reviewed with Exception\n\n**b) ARC-adopted case per account:** Seller, evidence-supported and adopted values side by side, with an asset timeline (sanction, repayment, NPA, recovery, settlement, notice, valuation, tape cut-off, later events), open and resolved findings, clarification history and evidence links.\n\n**c) Pool pack:** Portfolio summary, segmentation, total exposure, value affected by findings, document-completeness, valuation-age and legal-stage distributions, open seller queries, blocked and ready accounts, material unresolved risks.\n\n**Reviewer resolution options:** Accept seller value · accept evidence-supported value · adopt another supported value · mark timing difference · accept with exception · request evidence · route to legal, valuation or financial diligence · defer.\n\n---\n\n## 14. Your Diligence Standards. Rules for Control, AI for Understanding.\n\n**Headline:** Configured to your acquisition discipline.\n\n**Configurable:** Asset type and product · seller field mapping · mandatory documents · source hierarchy · financial tolerance · valuation-age and materiality thresholds · finding taxonomy and severity · seller-query templates · reviewer and adopted-value permissions · review-ready rules · pool segmentation\n\n**How it decides:** Deterministic logic for balances, dates and thresholds (a ₹50,000 recovery after cut-off explains a lower balance, with no guessing). AI for document understanding, entity matching and messy tape schemas. Both are recorded in the evidence trail.\n\n**Supporting line:** AI for understanding. Rules for control. Evidence for proof.\n\n---\n\n## 15. AI Prepares the Evidence. The ARC Decides What the Asset Is Worth.\n\n**Headline:** Judgment stays with your committee.\n\n| Darwix does | The ARC controls |\n|---|---|\n| Ingests and matches the data room | Legal sufficiency and enforceability |\n| Classifies and extracts documents | Valuation acceptance |\n| Reconciles values and detects missing or stale evidence | Recovery assumptions |\n| Calculates deterministic deltas | Haircuts, pricing and bid value |\n| Identifies subsequent events | Policy exceptions |\n| Generates findings and seller queries | Account inclusion or exclusion |\n| Reprocesses seller responses | Acquisition and committee decisions |\n| Builds pool summaries and packs | |\n\n**Also:** Seller-quality analytics (most frequent tape differences, missing documents, stale valuations, query turnaround) are evidence-quality visibility. They are not an automated rating of the seller.\n\n---\n\n## 16. Integrations, Security and Audit\n\n**Headline:** Built to work with seller data rooms and ARC systems, under NDA-grade controls.\n\n**Ingests from:** Virtual data rooms · SFTP · DMS · loan, collection, recovery and legal systems · valuation platforms · data warehouse · authorised external sources\n**Returns:** Structured evidence · account matches · document status · findings · evidence-supported and adopted values · seller queries · review status · pool summary · acquisition pack\n\n**Governance tiles:**\n- **Data-room confidentiality:** process only data authorised for diligence, with deployment in your own environment\n- **Role-based access:** borrower, property, legal and reviewer data by role\n- **Sensitive-data protection:** PII and financial data masked and protected in transit and at rest\n- **Source integrity:** file identity, version and lineage preserved\n- **Full audit trail:** seller tape version, source files, extraction and rule versions, findings, seller queries and responses, reviewer actions, adopted values\n- **Reproducible after the deal:** months later, reconstruct why a value was adopted\n- **Residency and retention:** on-prem, VPC or cloud per your policy\n\n**Badges:** SOC 2 Type II · ISO 27001 (as on the Compliance page) · link to Compliance\n\n**After the bid (one line):** The structured case carries into onboarding, recovery strategy, legal follow-up, valuation refresh and audit.\n\n---\n\n## 17. Business Impact\n\n**Headline:** More accounts evidenced. Fewer hours spent reconstructing the data room.\n\nValue tiles (bold headline, one line each):\n- **Cover the pool, not a sample:** structured diligence across far more accounts\n- **Use the bid window for judgment:** not manual tape reconciliation\n- **Catch what changed after cut-off:** recoveries, settlements, legal events\n- **See document gaps early:** know which accounts lack critical evidence\n- **Connect property, ownership and security:** one evidenced view\n- **Cut seller query cycles:** precise, evidence-backed questions\n- **Focus specialists:** legal, valuation and financial experts on real exceptions\n- **Defend the bid:** every adopted value traceable to source\n\n**Operational visibility (one line):** Accounts and documents processed, evidence completeness, financial reconciliation rate, findings by seller, product and geography, query ageing, review turnaround.\n\n---\n\n## 18. Why Darwix\n\nEight pillars, one line each:\n**Retail-scale** · **Tape-aware** (maps any seller schema, keeps the original) · **Cross-source** · **Time-aware** (cut-off, newer sources, later events) · **Discrepancy-aware** · **Evidence-linked** · **Clarification- and resolution-aware** · **Pool-aware and ARC-controlled**\n\n**Supporting line:** Not document extraction. Evidence-grade retail asset diligence.\n\n---\n\n## 19. FAQ\n\n1. **What is Retail Asset Evidence Intelligence?** An AI diligence platform for ARCs evaluating retail stressed-asset pools. It compares seller-provided account data with underlying financial, property, security, valuation, legal and recovery evidence and creates an explainable, review-ready case per asset and per pool.\n2. **Is it OCR?** No. OCR is one input. The product matches documents to accounts, reconciles tape values with evidence, classifies differences, detects missing or stale information, manages seller clarification and preserves the trail.\n3. **Can it process our seller tape format?** Yes. Seller fields are mapped into a standard evidence model, and the original field name and value are preserved.\n4. **Can it reconcile outstanding balances?** Yes. It compares tape outstanding with SOAs, ledgers and recovery entries and tells you whether a difference is a conflict, a stale value or a later transaction.\n5. **Can it find recoveries after the cut-off?** Yes. They surface as subsequent events and update the evidence-supported view.\n6. **Can it check if security documents are complete?** You configure the checklist. Darwix shows what's available, missing, partial, duplicated or mismatched. Legal sufficiency stays with your legal team.\n7. **Can it verify property ownership?** Where title documents are available, it extracts owners and compares them to the tape and security evidence.\n8. **Can it flag stale valuations?** Yes, against freshness thresholds you set.\n9. **Can it analyse legal documents?** It classifies them, extracts configured dates and events, builds a timeline and flags missing or stale evidence. Legal interpretation stays with your lawyers.\n10. **Can it draft seller queries?** Yes, each with the account, field, source difference, evidence reference and the requested document or clarification.\n11. **What happens when the seller sends a new document?** It links to the account, is processed as evidence, and re-runs only the affected findings. History is preserved.\n12. **Does it overwrite the tape?** No. Seller, evidence-supported and ARC-adopted values are kept separately.\n13. **Can it work at pool level?** Yes. Account findings roll up to document gaps, balance differences, valuation and legal issues, open queries and review readiness across the pool.\n14. **Does it recommend a bid price?** No. It quantifies deterministic evidence impacts. Pricing and bid decisions stay with your committee.\n15. **Can it run in our environment?** Deployment options include on-prem, VPC and cloud, with data-room confidentiality and access controls.\n\n---\n\n## 20. Closing CTA Block\n\n**Headline:** Turn every retail asset data room into an evidence-backed acquisition case.\n\n**Copy:** Reconcile seller tapes with loan, repayment, security, property, valuation, legal and recovery evidence, and surface the accounts, discrepancies and gaps that deserve expert attention before you bid.\n\n**CTA:** **See Retail Asset Evidence Intelligence in Action**\n\n**Form:** Reuse the site's standard \"Request a Personalized Demo\" form and value bullets.\n\n---\n\n## Open Items to Confirm Before Publishing\n\n- **Relationship to the general Evidence Intelligence page:** This page goes deep on ARC retail pools. Confirm how messaging is split so the two pages don't repeat the same account story. Consider a different signature example on whichever is second.\n- **Metrics and proof:** No quantified claims (accounts per hour, extraction accuracy, diligence days saved, discrepancy rates) are included, and the pool numbers (5,000 accounts, ₹8.2 crore, 214 accounts) are illustrative. Replace with real pilot data, or keep clearly labelled as synthetic.\n- **Market claim:** \"Retail is a growth engine for ARCs\" rests on recent industry reporting. Verify against a current, citable source before launch.\n- **Document coverage:** Confirm which document types and scan quality Darwix handles today, especially regional-language documents, handwritten entries and unusual seller schemas.\n- **Legal and regulatory wording:** Have Legal review all wording on SARFAESI, enforcement, security and NPA-date treatment. Confirm nothing implies a legal opinion or regulatory classification.\n- **Data-room confidentiality:** Confirm the deployment and data-handling story that satisfies seller NDAs, since bid documents place strict confidentiality on data-room material.\n- **Feature readiness:** Confirm which items are live versus roadmap: document-to-account matching, freshness rules, seller-query workflow, pool triage and quantified impact.\n- **Customer proof and demo:** Add a named ARC logo or quote only if approved. The §4 and §5 demos need a synthetic or anonymised data room.\n"},{"id":"r-TeleMedi_Assist","name":"TeleMedi_Assist.md","text":"# PRD: Darwix AI Video Tele-Medicine Page\n\n**Scope:** Content of the Video Tele-Medicine (AI teleconsultation agent) page only. Navigation, entry points, layout and visual design are out of scope.\n**Audience:** Hospital and telehealth decision-makers: CMOs, medical directors, digital-health and operations heads, CIOs and product owners at hospital groups, telehealth providers and care-delivery companies. Practising doctors are the secondary reader.\n**Page goal:** Make the reader believe one thing: *the video call is the easy part. Darwix prepares the context before it, documents the consultation during it, and completes the workflow after it, while every clinical decision stays with the doctor.*\n**Positioning guardrail (state it on the page):** Darwix is not an AI doctor. It does not diagnose, prescribe or triage emergencies. It supports the Registered Medical Practitioner (RMP), who remains responsible for every clinical decision.\n**Voice:** Match darwix.ai: confident, short, outcome-led. Tone is calm and clinical-grade, never hype. Every section leads with a claim, then proof.\n\n---\n\n## 1. Hero\n\n**Eyebrow:** AI VIDEO TELE-MEDICINE · BUILT FOR CONNECTED CARE\n\n**Headline:** Let the doctor focus on the patient. Darwix runs the rest of the consultation.\n\n**Subhead:** Darwix Video Tele-Medicine prepares patient context before the call, structures symptoms, history and medications as the conversation happens, drafts the clinical note for the doctor's approval, and turns approved decisions into prescriptions, investigations, referrals and follow-ups.\n\n**Capability line:** Pre-Consult Intake · Patient Context · Live Documentation · Hindi-English-Hinglish · Doctor Assist · Consent Capture · Doctor-Approved Workflows · Audit-Ready Records\n\n**Proof strip:** Doctor reviews and approves everything · Every field carries its source · Consent captured in the record · Multilingual conversations, structured output\n\n**CTAs:** Primary: **Request a Video Tele-Medicine Demo**. Secondary: **See a consultation end to end** (scrolls to §4).\n\n---\n\n## 2. The Problem: Video Solved the Connection. Not the Consultation.\n\n**Headline:** Most telemedicine gets the doctor and patient on a call. The hard work is everything around it.\n\n**Copy:** The patient repeats what the hospital already knows. Reports sit in PDFs the doctor opens mid-call. The doctor listens, types and thinks at the same time, then finishes the note after hours. Prescriptions, test orders, referrals and follow-ups are handled afterwards across separate systems. The consultation ends. The care workflow starts over.\n\n**Three-line pain strip:**\n- **Before the call:** history is re-collected and reports are unread.\n- **During the call:** the doctor splits attention between the patient and the keyboard.\n- **After the call:** notes, prescriptions, orders and reminders are rebuilt by hand.\n\n**Closing line:** From video call to documented, actionable care journey.\n\n---\n\n## 3. One Consultation. Three Phases. Zero Blind Spots.\n\n**Headline:** Darwix works before, during and after the call.\n\nThree columns:\n\n**BEFORE: Arrive prepared**\n- Pulls the authorised record: history, allergies, medications, past consultations, reports\n- Runs an intake conversation with the patient in their own language\n- Extracts values from uploaded reports and prior prescriptions\n\n**DURING: Document without disrupting**\n- Live transcription with doctor and patient separated\n- Symptoms, history, medications and allergies structured as they're spoken\n- Relevant past context surfaced to the doctor at the moment it matters\n\n**AFTER: Complete the workflow**\n- Drafts the note for doctor review and approval\n- Prepares the prescription, test orders, referral and follow-up from the doctor's decisions\n- Sends the patient one clear summary, and writes back to your systems\n\n---\n\n## 4. Signature Section: One Follow-Up, Start to Finish\n\n**Headline:** Watch a hypertension follow-up run end to end.\n\n**Format:** A three-stage story panel (Before → During → After), scripted below.\n\n**Case:** Returning patient · Hypertension · Previous plan: continue medication, log home BP, get kidney-function tests, follow up in four weeks · Preferred language: Hindi + English\n\n**BEFORE the call**\n- Darwix pulls the previous consultation summary, current medication list and plan.\n- It reads the uploaded kidney-function report and lists the extracted values.\n- The intake asks the patient for an update. **Patient:** \"Medicine regular le raha hoon. BP usually 145–150 aa raha hai. Last two days se thoda headache bhi hai.\"\n- **Doctor sees:** adherence reported · home BP 145–150 (patient-reported) · new symptom: headache, 2 days · report attached · previous plan · *all marked patient-reported and awaiting review*.\n\n**DURING the call**\n- **Doctor:** \"Are these readings before or after your medication?\" **Patient:** \"Morning mein, medicine lene se pehle.\"\n- Darwix records: *Measurement timing: morning, pre-medication.*\n- The doctor reviews the report, assesses and decides. Darwix captures what the doctor says or enters.\n\n**AFTER the call, on doctor approval**\n- Note saved to the EMR · prescription generated for the doctor to issue · investigation order created · home-monitoring instructions sent to the patient · next follow-up scheduled · consent trail preserved.\n\n**Closing line:** The patient saw one doctor. The platform coordinated the entire workflow around that conversation.\n\n---\n\n## 5. Pre-Consultation Intake\n\n**Headline:** Use the waiting time to prepare the consultation, not replace it.\n\n**Copy:** Before the doctor joins, Darwix runs a short, configurable intake in the patient's language and hands the doctor a structured summary.\n\n**Captures:** Reason for visit · symptoms, onset, duration and severity · existing conditions · current medicines and adherence · allergies · recent investigations · patient-reported vitals · uploaded reports · questions the patient wants to ask\n\n**Example:** **Patient:** \"Three days se cough hai. Kal fever bhi tha. Paracetamol le raha hoon, aur koi medicine nahi.\" → **Structured:** Cough · 3 days · associated fever · self-reported medication: paracetamol · other medication: none.\n\n**Boundary (state on page):** Intake prepares information for the doctor. It does not diagnose, and it does not decide whether a teleconsultation is appropriate.\n\n---\n\n## 6. Reports & History, Ready Before the Call\n\n**Headline:** From attached report to consultation-ready context.\n\nTwo blocks:\n\n**a) Medical document intelligence:** Extracts test name, result, unit, reference range, report date and facility from lab and radiology reports, discharge summaries, prescriptions and referral letters. The doctor gets the values, not a PDF to hunt through. Interpretation of significance stays with the doctor.\n\n**b) Longitudinal view:** For returning patients, Darwix summarises previous complaints, medication changes, investigations advised, follow-up adherence and open actions, so the doctor sees *what changed*, not just what the patient says today.\n\n**Supporting line:** Continuity, not another isolated call.\n\n---\n\n## 7. Live Consultation Intelligence\n\n**Headline:** Go beyond transcription. Structure what matters to care.\n\n**Copy:** Darwix doesn't just store a transcript. It understands the conversation in clinical categories and keeps who said what.\n\n| Category | Captured |\n|---|---|\n| **Symptoms** | Complaint, onset, duration, severity, progression, associated symptoms |\n| **History** | Conditions, previous episodes, surgical, family and relevant lifestyle history |\n| **Medications** | Current and recently stopped drugs, dose, frequency, adherence, self-medication |\n| **Allergies** | Drug, food and other allergies, with reactions where stated |\n| **Investigations** | Previous tests, reports available, new tests the doctor advises |\n| **Care plan** | Doctor's advice, medication decisions, referral, follow-up, patient instructions |\n\n**Example (Hinglish):** **Pat
