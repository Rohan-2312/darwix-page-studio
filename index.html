<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>html,body{margin:0}</style></head><body><script>/* Standalone host shim: gives the app the same window.claude surface using the visitor's own Anthropic API key. */
(function () {
  if (window.claude && window.claude.use) return;
  var KEY = 'dxps_api_key', DB = 'dxps_db';
  function ls(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} return null; }
  var mem = {}; try { mem = JSON.parse(ls(DB) || '{}'); } catch (e) {}
  function persist() { ls(DB, JSON.stringify(mem)); }
  var clone = function (o) { return JSON.parse(JSON.stringify(o)); };
  function docRef(path) { return { id: path.split('/').pop(), path: path,
    get: async function () { return { id: path.split('/').pop(), exists: Object.prototype.hasOwnProperty.call(mem, path), data: function () { return mem[path]; } }; },
    set: async function (d) { mem[path] = clone(d); persist(); }, update: async function (d) { mem[path] = Object.assign(mem[path] || {}, clone(d)); persist(); }, delete: async function () { delete mem[path]; persist(); } }; }
  function coll(path) { var q = { _lim: 999, _ord: null, orderBy: function (f, d) { this._ord = [f, d]; return this; }, limit: function (n) { this._lim = n; return this; },
    get: async function () { var docs = Object.keys(mem).filter(function (k) { return k.indexOf(path + '/') === 0 && k.split('/').length === path.split('/').length + 1; }).map(function (k) { return { id: k.split('/').pop(), exists: true, data: function () { return mem[k]; } }; });
      if (q._ord) { var f = q._ord[0], d = q._ord[1]; docs.sort(function (a, b) { return ((a.data()[f] || 0) - (b.data()[f] || 0)) * (d === 'desc' ? -1 : 1); }); }
      return { docs: docs.slice(0, q._lim), size: docs.length, empty: !docs.length }; }, doc: function (id) { return docRef(path + '/' + id); } }; return q; }
  var db = { doc: docRef, collection: coll };

  /* ---- key dialog ---- */
  function askKey() {
    return new Promise(function (res) {
      var w = document.createElement('div'); w.style.cssText = 'position:fixed;inset:0;z-index:200;background:rgba(10,11,25,.6);display:flex;align-items:center;justify-content:center;padding:16px';
      w.innerHTML = '<div role="dialog" aria-label="Connect Claude" style="background:var(--panel,#fff);color:var(--fg,#2B2B2E);border:1px solid var(--line,#E6E7F0);border-radius:16px;width:min(480px,100%);padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.4);font:14px/1.5 Manrope,system-ui,sans-serif">' +
        '<h3 style="margin:0 0 6px;font-size:18px">Connect Claude</h3><p style="margin:0 0 12px;color:var(--mut,#686868)">Paste your Anthropic API key to generate. It is stored only in this browser and sent only to api.anthropic.com. Get one at console.anthropic.com.</p>' +
        '<input id="dxk" type="password" autocomplete="off" placeholder="sk-ant-..." style="width:100%;box-sizing:border-box;height:44px;border:1px solid var(--line,#E6E7F0);background:var(--panel2,#F4F5F9);color:inherit;border-radius:10px;padding:0 14px;font:inherit">' +
        '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap"><button id="dxk-x" class="btn">Cancel</button>' + (ls(KEY) ? '<button id="dxk-r" class="btn danger">Remove key</button>' : '') + '<button id="dxk-s" class="btn pri">Save key</button></div></div>';
      document.body.appendChild(w); var inp = w.querySelector('#dxk'); inp.focus();
      function done(v) { w.remove(); res(v); }
      w.querySelector('#dxk-x').onclick = function () { done(null); };
      var r = w.querySelector('#dxk-r'); if (r) r.onclick = function () { ls(KEY, null); done(null); badge(); };
      w.querySelector('#dxk-s').onclick = function () { var v = inp.value.trim(); if (v) { ls(KEY, v); badge(); } done(v || null); };
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') w.querySelector('#dxk-s').click(); if (e.key === 'Escape') done(null); });
    });
  }
  function badge() {
    var b = document.getElementById('dxk-badge');
    if (!b) { b = document.createElement('button'); b.id = 'dxk-badge'; b.className = 'lnk'; b.style.cssText = 'position:fixed;right:16px;bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:90;background:var(--panel,#fff);border:1px solid var(--line,#E6E7F0);border-radius:99px;padding:8px 14px;box-shadow:0 4px 14px rgba(14,19,48,.12);font-size:12.5px'; b.onclick = askKey; document.body.appendChild(b); }
    b.textContent = ls(KEY) ? 'Claude key connected' : 'Connect Claude to generate';
  }
  document.addEventListener('DOMContentLoaded', badge);

  var MODEL = { quick: 'claude-haiku-5-5', default: 'claude-sonnet-5-5', complex: 'claude-opus-5-5' };
  function b64(blob) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.onerror = rej; r.readAsDataURL(blob); }); }
  async function sample(input, opts) {
    opts = opts || {};
    var key = ls(KEY); if (!key) key = await askKey(); if (!key) throw { code: 'not_granted', message: 'Add your Anthropic API key to generate.' };
    var msgs = typeof input === 'string' ? [{ role: 'user', content: input }] : input.map(function (m) { return { role: m.role, content: m.content }; });
    if (opts.images && opts.images.length) {
      var blocks = []; for (var i = 0; i < opts.images.length; i++) { var bl = opts.images[i]; blocks.push({ type: 'image', source: { type: 'base64', media_type: bl.type || 'image/jpeg', data: await b64(bl) } }); }
      var last = msgs[msgs.length - 1]; last.content = blocks.concat([{ type: 'text', text: last.content }]);
    }
    var tier = opts.modelTier || 'default';
    var resp; try { resp = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', signal: opts.signal,
      headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: opts.model || MODEL[tier] || MODEL.default, max_tokens: tier === 'quick' ? 8000 : 32000, stream: true, messages: msgs }) }); } catch (e) { if (e && e.name === 'AbortError') throw { code: 'cancelled', message: 'Cancelled.' }; throw { code: 'error', message: 'Could not reach Claude. Check your connection.' }; }
    if (!resp.ok) { var t = ''; try { t = (await resp.json()).error.message; } catch (e) {} if (resp.status === 401) ls(KEY, null), badge(); throw { code: resp.status === 401 ? 'not_granted' : resp.status === 429 ? 'rate_limited' : 'error', message: resp.status === 401 ? 'The API key was rejected. Check it and try again.' : (t || 'Request failed (' + resp.status + ').') }; }
    var rd = resp.body.getReader(), dec = new TextDecoder(), buf = '', text = '', stop = '';
    for (;;) {
      var c = await rd.read(); if (c.done) break; buf += dec.decode(c.value, { stream: true });
      var parts = buf.split('\n\n'); buf = parts.pop();
      parts.forEach(function (p) { var m = p.match(/^data: (.*)$/m); if (!m) return; var j; try { j = JSON.parse(m[1]); } catch (e) { return; }
        if (j.type === 'content_block_delta' && j.delta && j.delta.text) { text += j.delta.text; if (opts.onText) opts.onText({ text: text, delta: j.delta.text }); }
        if (j.type === 'message_delta' && j.delta && j.delta.stop_reason) stop = j.delta.stop_reason;
        if (j.type === 'error') throw { code: 'error', message: (j.error && j.error.message) || 'Claude returned an error.' }; });
    }
    return { text: text, truncated: stop === 'max_tokens' };
  }
  sample.limits = async function () { return { maxPromptBytes: 3000000, images: { maxCount: 8, maxInputBytes: 5000000, mediaTypes: ['image/jpeg', 'image/png', 'image/webp'] } }; };
  sample.json = async function (input, opts) { var r = await sample(input, opts); var m = r.text.match(/\{[\s\S]*\}/); try { return JSON.parse(m[0]); } catch (e) { throw { code: 'invalid_json', text: r.text }; } };
  var downloads = { save: async function (x) { var u = URL.createObjectURL(new Blob([x.data], { type: /\.html?$/.test(x.filename) ? 'text/html' : 'text/markdown' })); var a = document.createElement('a'); a.href = u; a.download = x.filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(u); }, 4000); return { status: 'saved' }; } };
  var user = { can: function () { return true; }, isOwner: function () { return true; } };
  window.claude = { use: async function (n) { return { sample: sample, db: db, user: user, downloads: downloads }[n] || null; } };

  var CLAUDE_URL = 'https://claude.ai/artifact/SqS9yMKwf5t2sHNucV4mqs';
  (function addLink() { var c = document.querySelector('.cta'); if (!c) { setTimeout(addLink, 150); return; } if (document.getElementById('dx-inclaude')) return;
    var a = document.createElement('a'); a.id = 'dx-inclaude'; a.href = CLAUDE_URL; a.target = '_blank'; a.rel = 'noopener'; a.className = 'lnk'; a.textContent = 'Or generate in Claude \u2014 no API key needed \u2197'; a.style.fontSize = '13px'; c.appendChild(a); })();
  window.__DXHOST__ = true;
})();
</script><title>Darwix Page Studio</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400&display=swap">
<style>:root{--bg:#FAFAFB;--panel:#FFFFFF;--panel2:#F4F5F9;--fg:#2B2B2E;--ink:#111111;--lab:#515153;--mut:#686868;--faint:#949395;--line:#E6E7F0;--dash:#C5CAD8;--stage:#EEEFF5;--acc:#565ADD;--acc-h:#4A4ECF;--acc-p:#4344B8;--tint:#EEEFFF;--tint-b:#DCDDFB;--ok:#12803A;--ok-bg:#E6F6EC;--warn:#9A6700;--warn-bg:#FFF4D6;--err:#B42318;--err-bg:#FDEAEA;--navy:#1B1F3B;--shadow:0 1px 2px rgba(14,19,48,.04);--lift:0 12px 32px rgba(14,19,48,.12);--code:#F4F5F9;--r:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1020;--panel:#171829;--panel2:#1E2035;--fg:#ECEDFA;--ink:#F6F6FF;--lab:#B9BBD3;--mut:#A3A6C4;--faint:#7D809D;--line:#2B2D47;--dash:#3A3D5E;--stage:#12132A;--acc:#8A8DF5;--acc-h:#9B9EFA;--acc-p:#7477E8;--tint:#242650;--tint-b:#34376F;--ok:#4ADE80;--ok-bg:#12301F;--warn:#F5C451;--warn-bg:#3A2E10;--err:#FF7B7B;--err-bg:#3A1717;--navy:#0B0C1B;--shadow:0 1px 2px rgba(0,0,0,.4);--lift:0 12px 32px rgba(0,0,0,.45);--code:#1B1D33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1020;--panel:#171829;--panel2:#1E2035;--fg:#ECEDFA;--ink:#F6F6FF;--lab:#B9BBD3;--mut:#A3A6C4;--faint:#7D809D;--line:#2B2D47;--dash:#3A3D5E;--stage:#12132A;--acc:#8A8DF5;--acc-h:#9B9EFA;--acc-p:#7477E8;--tint:#242650;--tint-b:#34376F;--ok:#4ADE80;--ok-bg:#12301F;--warn:#F5C451;--warn-bg:#3A2E10;--err:#FF7B7B;--err-bg:#3A1717;--navy:#0B0C1B;--shadow:0 1px 2px rgba(0,0,0,.4);--lift:0 12px 32px rgba(0,0,0,.45);--code:#1B1D33;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font:400 14px/1.55 "Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;padding:0;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
.app{max-width:1440px;margin:0 auto;padding:40px clamp(16px,7.8vw,112px) 64px;display:flex;flex-direction:column;gap:24px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:16px;padding:14px 0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.02em}
.brand i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 50% 50%,var(--acc) 0 34%,var(--tint) 36% 100%);box-shadow:inset 0 0 0 1px var(--tint-b)}
.brand small{font-weight:600;color:var(--faint);font-size:12px;letter-spacing:.02em;margin-left:2px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-inline:auto}
.tab{border:0;background:none;padding:8px 18px;border-radius:9px;font-weight:700;color:var(--mut);cursor:pointer;display:flex;gap:8px;align-items:center}
.tab[aria-selected="true"]{background:var(--acc);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--acc) 35%,transparent)}
.tab:focus-visible,.btn:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid color-mix(in srgb,var(--acc) 60%,transparent);outline-offset:2px}
.top-r{display:flex;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-weight:700;font-size:13px;cursor:pointer;transition:background .14s,transform .14s,border-color .14s;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 30%,transparent)}
.btn.pri:hover{background:var(--acc-h);color:#fff}
.btn.pri[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{height:32px;padding:0 12px;font-size:12px;border-radius:8px}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--err);color:var(--err)}
.btn.lg{height:52px;padding:0 28px;font-size:15px;border-radius:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.view[hidden]{display:none}
.banner{margin:0 0 14px;padding:12px 16px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:13px}
/* start */
.start{max-width:860px;margin:28px auto 40px;padding:36px;text-align:center}
.eyebrow{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:99px;background:var(--tint);border:1px solid var(--tint-b);color:var(--acc);font-weight:700;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.start h1{font-size:clamp(28px,4.6vw,46px);line-height:1.1;letter-spacing:-.035em;font-weight:800;margin:18px 0 10px;text-wrap:balance}
.start h1 em{font-style:normal;color:var(--acc)}
.lead{color:var(--mut);max-width:620px;margin:0 auto 26px;font-size:15px;text-wrap:pretty}
.namebox{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:stretch}
.namebox input{flex:1 1 320px;min-width:0;height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 18px;font-size:16px;font-weight:600}
.namebox input:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 18%,transparent)}
.drop{margin-top:14px;border:1.5px dashed var(--tint-b);border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;justify-content:center;color:var(--mut);cursor:pointer;background:color-mix(in srgb,var(--tint) 50%,transparent);transition:border-color .15s,background .15s;flex-wrap:wrap;text-align:left}
.drop:hover,.drop.on{border-color:var(--acc);background:var(--tint)}
.drop b{color:var(--fg)}
.drop .ic{width:36px;height:36px;border-radius:10px;background:var(--panel);display:grid;place-items:center;color:var(--acc);border:1px solid var(--tint-b);flex:none}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center}
.fchip{display:inline-flex;align-items:center;gap:8px;padding:6px 8px 6px 6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:12px;font-weight:600;max-width:100%}
.fchip img{width:28px;height:28px;object-fit:cover;border-radius:6px}
.fchip .k{width:28px;height:28px;border-radius:6px;background:var(--tint);color:var(--acc);display:grid;place-items:center;font-size:9px;font-weight:800;letter-spacing:.04em}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.fchip button{border:0;background:none;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
.fchip small{color:var(--faint);font-weight:500}
.more{margin-top:14px;text-align:left}
.more summary{cursor:pointer;color:var(--mut);font-weight:600;font-size:13px;text-align:center;list-style:none}
.more textarea{width:100%;min-height:96px;margin-top:10px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:12px 14px;resize:vertical}
.srcline{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:700;color:var(--mut);cursor:pointer}
.chip b{color:var(--fg)}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chip.off .dot{background:var(--err)}
.examples{margin-top:16px;color:var(--faint);font-size:12px}
.examples button{border:0;background:none;color:var(--acc);font-weight:700;cursor:pointer;padding:2px 4px}
/* run */
.run{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;margin:8px 0 40px}
.steps{padding:20px;display:flex;flex-direction:column;gap:2px;align-self:start;position:sticky;top:76px}
.steps h3{font-size:15px;margin-bottom:10px}
.step{display:flex;gap:12px;padding:10px 0;align-items:flex-start;opacity:.5;transition:opacity .2s}
.step.on,.step.done{opacity:1}
.step .n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;color:var(--mut);background:var(--panel)}
.step.on .n{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 15%,transparent);animation:pulse 1.4s infinite}
.step.done .n{background:var(--acc);border-color:var(--acc);color:#fff}
.step b{display:block;font-size:13px}
.step small{color:var(--mut);font-size:12px}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--acc) 6%,transparent)}}
.bar{height:4px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#7B7EF0);transition:width .4s}
.stream{padding:0;overflow:hidden;display:flex;flex-direction:column;min-height:420px;max-height:calc(100vh - 140px)}
.stream header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800;gap:10px;flex-wrap:wrap}
.stream pre{margin:0;padding:18px;overflow:auto;flex:1;font:400 12.5px/1.65 "JetBrains Mono",ui-monospace,monospace;white-space:pre-wrap;word-break:break-word;color:var(--mut)}
.stream pre .cur{display:inline-block;width:7px;height:14px;background:var(--acc);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.planbox{padding:14px 18px;border-bottom:1px solid var(--line);background:var(--tint);font-size:12.5px;display:grid;gap:4px}
.planbox b{color:var(--acc)}
/* result */
.res-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.res-bar h2{font-size:20px;letter-spacing:-.02em;margin-right:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.score{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800;background:var(--ok-bg);color:var(--ok)}
.score.w{background:var(--warn-bg);color:var(--warn)}
.score.e{background:var(--err-bg);color:var(--err)}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:18px;align-items:start}
.pane{display:flex;flex-direction:column;overflow:hidden;min-height:560px}
.pane-h{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pane-h .sp{margin-inline:auto}
.seg{display:flex;gap:2px;padding:3px;background:var(--panel2);border-radius:9px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-weight:700;font-size:12px;color:var(--mut);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.doc{padding:22px 24px;overflow:auto;max-height:calc(100vh - 230px);min-height:480px}
.doc h1{font-size:20px;letter-spacing:-.02em;margin-bottom:12px}
.doc h2{font-size:15px;margin:26px 0 8px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.doc h2 .sn{width:24px;height:24px;border-radius:7px;background:var(--tint);color:var(--acc);display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}
.doc h3{font-size:13px;margin:16px 0 6px;color:var(--acc)}
.doc p{margin:6px 0;color:var(--mut)}
.doc ul,.doc ol{margin:6px 0;padding-left:20px;color:var(--mut)}
.doc li{margin:3px 0}
.doc table{border-collapse:collapse;width:100%;font-size:12.5px;margin:10px 0}
.doc .tw{overflow-x:auto;margin:10px 0}
.doc th,.doc td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.doc th{background:var(--panel2);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.doc strong{color:var(--fg)}
.doc blockquote{margin:8px 0;padding:6px 14px;border-left:3px solid var(--acc);color:var(--mut);background:var(--tint)}
.doc hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.doc code{font:400 12px "JetBrains Mono",monospace;background:var(--code);padding:1px 5px;border-radius:5px}
.raw{width:100%;min-height:480px;max-height:calc(100vh - 230px);border:0;outline:0;padding:18px 20px;resize:vertical;background:var(--panel);font:400 12.5px/1.65 "JetBrains Mono",monospace;color:var(--fg)}
.checks{padding:16px 18px;overflow:auto;max-height:calc(100vh - 230px);display:grid;gap:14px}
.cgrp h4{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.crow{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:13px}
.crow i{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-style:normal;font-weight:800;margin-top:1px}
.crow.ok i{background:var(--ok-bg);color:var(--ok)}
.crow.bad i{background:var(--err-bg);color:var(--err)}
.crow.adv i{background:var(--warn-bg);color:var(--warn)}
.crow small{display:block;color:var(--faint)}
.refine{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.refine input{flex:1 1 220px;min-width:0;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel);padding:0 12px}
.pv-wrap{background:var(--panel2);padding:14px;display:flex;justify-content:center;flex:1;min-height:520px;overflow:auto}
.pv-frame{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:100%;transition:width .3s;box-shadow:var(--shadow);height:calc(100vh - 250px);min-height:520px}
.pv-frame iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.pv-ph{height:100%;display:grid;place-items:center;color:var(--faint);text-align:center;padding:30px}
.rotate{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* modal */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,11,25,.6);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px))}
.modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(960px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.mbox.full{width:100%;height:100%}
.mh{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mh h3{font-size:15px;margin-right:auto}
.mb{padding:18px;overflow:auto;flex:1;min-height:0}
.mb pre{margin:0;white-space:pre-wrap;word-break:break-word;font:400 12.5px/1.65 "JetBrains Mono",monospace;color:var(--mut)}
.mb img{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.mfull{flex:1;background:var(--panel2);display:flex;justify-content:center;min-height:0}
.mfull iframe{height:100%;border:0;background:#fff;transition:width .3s;width:100%}
/* customize */
.cust{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;margin:8px 0 40px;align-items:start}
.side{padding:12px;display:grid;gap:4px;position:sticky;top:76px}
.side button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer}
.side button[aria-selected="true"]{background:var(--tint)}
.side b{display:block;font-size:13px}
.side small{color:var(--mut);font-size:11.5px}
.side .ct{margin-left:auto;font-size:11px;font-weight:800;color:var(--acc);background:var(--tint);border-radius:99px;padding:1px 8px}
.panel{padding:22px}
.panel>header{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.panel>header div{margin-right:auto;min-width:240px;flex:1}
.panel h2{font-size:20px;letter-spacing:-.02em}
.panel header p{color:var(--mut);margin-top:4px}
.instr{margin:0 0 18px;padding:14px;border:1px solid var(--tint-b);background:var(--tint);border-radius:12px}
.instr label{font-weight:800;font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.instr label small{font-weight:600;color:var(--mut)}
.instr textarea{width:100%;min-height:96px;margin-top:8px;border-radius:10px;border:1px solid var(--tint-b);background:var(--panel);padding:10px 12px;resize:vertical}
.items{display:grid;gap:10px}
.item{display:flex;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);flex-wrap:wrap}
.item.off{opacity:.55}
.item .ico{width:38px;height:38px;border-radius:10px;background:var(--tint);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:10px;letter-spacing:.04em;flex:none}
.item .meta{flex:1;min-width:180px}
.item .meta b{display:block;font-size:13.5px;word-break:break-word}
.item .meta small{color:var(--mut);font-size:12px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--panel2);color:var(--mut);margin-left:6px;vertical-align:1px}
.tag.new{background:var(--tint);color:var(--acc)}
.tag.ed{background:var(--warn-bg);color:var(--warn)}
.sw{position:relative;width:38px;height:22px;border-radius:99px;background:var(--line);border:0;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--acc)}
.sw[aria-checked="true"]::after{transform:translateX(16px)}
.zone{margin-top:14px;border:1.5px dashed var(--tint-b);border-radius:12px;padding:18px;text-align:center;color:var(--mut);cursor:pointer;background:color-mix(in srgb,var(--tint) 40%,transparent)}
.zone:hover,.zone.on{border-color:var(--acc);background:var(--tint)}
.zone b{color:var(--fg)}
.removed{margin-top:16px;color:var(--mut);font-size:12.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.wcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
.wcard.off{opacity:.55}
.wcard .th{height:150px;background:var(--panel2);overflow:hidden;cursor:pointer;position:relative}
.wcard .th img{width:100%;display:block}
.wcard .th::after{content:"";position:absolute;inset:auto 0 0;height:40px;background:linear-gradient(transparent,var(--panel))}
.wcard .bd{padding:10px 12px;display:grid;gap:8px}
.wcard .bd b{font-size:12.5px;word-break:break-word}
.wcard .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.swatches{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.swatches i{width:22px;height:22px;border-radius:6px;border:1px solid var(--line);display:block}
.dsrow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:start;flex:1;min-width:260px}
.dsrow img{width:150px;border-radius:8px;border:1px solid var(--line);display:block}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.35);max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.hist{display:grid;gap:8px}
.hist .item{cursor:default}
.spin{width:14px;height:14px;border:2px solid color-mix(in srgb,currentColor 25%,transparent);border-top-color:currentColor;border-radius:50%;display:inline-block;animation:spin .8s linear infinite}
@media (max-width:980px){.split{grid-template-columns:minmax(0,1fr)}.run{grid-template-columns:minmax(0,1fr)}.steps{position:static}.cust{grid-template-columns:minmax(0,1fr)}.side{position:static;grid-template-columns:repeat(2,minmax(0,1fr))}.doc,.checks,.raw{max-height:none}.pv-frame{height:70vh}.tabs{order:3;width:100%;margin:0}.tab{flex:1;justify-content:center}.top-r{margin-left:auto}}
@media (max-width:560px){.start{padding:22px 16px}.side{grid-template-columns:minmax(0,1fr)}.dsrow{grid-template-columns:minmax(0,1fr)}.dsrow img{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}

<script>window.__DEFAULTS__={"structure":[{"id":"s-skill","name":"SKILL.md (PRD builder rules)","text":"---\nname: darwix-product-page-prd\ndescription: Builds a Darwix AI website product-page PRD in Markdown from an uploaded product details document, using the house structure, voice, synthetic-demo style and guardrails of existing Darwix page PRDs. Use when the user shares product notes, specs or a brief and asks for a product page PRD, landing page PRD or page content spec for a Darwix product.\n---\n\n# Darwix Product Page PRD Builder\n\nThis skill turns a product details document into a complete, publish-ready-for-review **product page PRD** for darwix.ai, matching the nine existing Darwix page PRDs (Auto PD, Video PIVC, Video Tele-Medicine, Evidence Intelligence, Alert Intelligence, Pre Meet Intelligence, Life Insurance Proposal Automation, Retail Asset Evidence Intelligence, and its Document Discrepancy variant) in structure, depth, voice and discipline.\n\nA Darwix page PRD specifies the **content** of one product page: every headline, line of copy, table, example and FAQ, in page order. It does not specify navigation, layout or visual design.\n\n---\n\n## 1. Inputs and Output\n\n**Input:** one or more documents describing a product (notes, a spec, a deck export, a sales brief, a call transcript, an older PRD). They may be messy, partial or written for another purpose.\n\n**Output:** one Markdown file named `Darwix_<Product_Name>_Page_PRD.md` (Title Case words joined by underscores, e.g. `Darwix_Collections_Voice_Agent_Page_PRD.md`), written with the file tool and sent to the user. Then a short reply (3–5 lines): the archetype chosen, the signature demo case, the main assumptions made, and how many open items need confirmation. Do not paste the PRD into the chat.\n\n**Modes**\n- **New page (default):** build from the source document.\n- **Variant:** the product already has a page and the user wants a reframed version. Add a `**Version note:**` to the header block and a \"One page or two\" open item.\n- **Revision:** the user uploads an existing PRD plus new information. Keep the structure and section numbering, change only what the new information affects, and update Open Items.\n\n---\n\n## 2. Workflow\n\nFollow these steps in order. Steps 2–7 are internal planning; do not show them to the user unless asked.\n\n### Step 1. Read everything\nRead the whole source document, every page and table. If a file's content isn't visible in context, open it with the file tools. Note what the document **states** versus what it **implies**.\n\n### Step 2. Build a fact sheet\nExtract the following. Mark each item **Stated** (in the source), **Inferred** (a natural consequence of what is stated) or **Unknown**.\n\n| Field | What to capture |\n|---|---|\n| Product name | Full name and short name (e.g. \"Darwix Auto PD\" / \"Auto PD\") |\n| Category | The noun phrase the product belongs to (agent, layer, platform, engine) and what it is not |\n| Industry and institutions | Banks, NBFCs, HFCs, insurers, ARCs, hospitals, telehealth providers... |\n| Primary buyers | Real titles (Chief Credit Officer, Head of Collections, CMO, Head of New Business) |\n| Secondary reader | Managers, enablement, frontline leaders, data and technology leaders |\n| Frontline users | Who touches it daily (field officer, advisor, collector, doctor, reviewer) |\n| The moment of value | The interaction or event where the product does its work |\n| Inputs | Systems, documents, conversations and events it reads |\n| Workflow | What it does, step by step, in order |\n| Outputs | Records, alerts, briefs, packs, write-backs, actions |\n| Core differentiator | The thing the commodity alternative cannot do |\n| Commodity alternatives | What a buyer might mistake it for (OCR, chatbot, CRM summary, rules engine, scripted bot) |\n| Decision boundary | What it never decides, and who does |\n| Regulation and law | Regulators, guidelines or legal concepts that frame the use case |\n| Languages and channels | Hindi, English, Hinglish, regional; voice, video, field, app, desktop |\n| Integrations | Named systems and other Darwix products it connects to |\n| Live vs roadmap | Anything the source marks as planned, pilot or future |\n| Proof | Measured metrics, customer names, quotes (usually absent) |\n\n### Step 3. Decide whether to ask first\nAsk the user **one** short question before writing only if the source lacks something you cannot reasonably infer and that would change most of the page: what the product actually does, or which industry and buyer it is for. In every other case, proceed, make the most reasonable assumption, and record it in Open Items. Never ask about metrics, logos or integrations: those become open items.\n\n### Step 4. Classify the archetype\nPick the archetype the product most resembles (Section 4). It decides the §3 framing, the signature demo format and the default capability modules. For hybrids, pick the dominant one and borrow modules from the other.\n\n### Step 5. Write the positioning core\nBefore drafting any section, write these four things. Everything else must serve them.\n1. **What the product is:** a category definition plus the workflow in order.\n2. **Page goal:** one belief, ideally a tension: *\"[Commodity] does X. Darwix does Y, with proof / in time / under your control.\"*\n3. **Two guardrails:** \"Not [commodity A], [B] or [C].\" and the decision boundary.\n4. **Hero headline:** using one of the five formulas in Section 6.\n\n### Step 6. Design the signature demo (§4)\nThis is the most important section. Follow Section 7 exactly. Pick one realistic synthetic case that exercises 5–8 of the product's main capabilities. Every later capability section should be able to point back to a row of this demo.\n\n### Step 7. Plan the sections\nChoose 8–12 capability modules from the library (Section 10), ordered by the narrative arc (Section 9.2). Write a one-line plan per section: number, title, headline, the proof element (table, card, example). Check that each major capability from the fact sheet has a home, and that no two sections make the same point.\n\n### Step 8. Draft\nWrite the full PRD in page order using the structure in Section 9 and the voice rules in Section 6. Reuse the signature case (same names, IDs and numbers) in later examples where it fits. Write every example with specific, synthetic, Indian-context values.\n\n### Step 9. Write Open Items\nUse the catalog in Section 11. Name specifics: list the exact capabilities to confirm as live, the exact integrations, the exact regulatory lines. Every **Inferred** capability that appears on the page must be named under Feature readiness.\n\n### Step 10. Run the quality checklist\nGo through Section 12 line by line and fix every miss before delivering.\n\n### Step 11. Deliver\nWrite the file, send it, and reply briefly (see Section 1).\n\n---\n\n## 3. Truthfulness Rules (non-negotiable)\n\nThese keep the PRD safe to publish after review.\n\n1. **No invented metrics.** No accuracy, speed, time saved, volume, conversion, cost or percentage claims unless the source gives measured figures. Value tiles and impact lines stay qualitative. List the natural metrics under the Metrics open item.\n2. **No invented customers.** No logos, names or quotes unless the source supplies approved ones.\n3. **No invented certifications.** Badges are always and only: SOC 2 Type II · ISO 27001 (as on the Compliance page) · link to Compliance.\n4. **Synthetic demo data is labelled.** Every demo Format line ends with `*(Synthetic data.)*`. Illustrative pool figures carry \"(illustrative)\". Never use real customer, patient or borrower data.\n5. **Inferred capabilities are flagged.** You may describe capabilities that follow naturally from the product (a PD agent that keeps the original application value, an alert layer that deduplicates), because a page PRD describes the full intended product. Every one of them goes into the Feature readiness open item by name.\n6. **Unverified specifics get inline flags.** Language lists, integration names and regulatory wording that aren't confirmed carry `*(Confirm ... before publishing.)*` or `(Legal to review)` in place, plus an open item.\n7. **The decision boundary is always stated.** The product prepares, captures, detects, verifies, drafts and routes. Accountable decisions (credit, underwriting, claims, diagnosis, prescribing, pricing, legal sufficiency, fraud classification, final compliance conclusions) stay with authorised people. Say so in the header guardrails, the Control section and at least one FAQ.\n8. **No speculative profiling.** Risk is evidence-backed. Opportunities come from explicit customer need or approved eligibility logic. Vulnerability relies on explicit statements only. Analytics measure process or data quality, never people.\n\n---\n\n## 4. Product Archetypes\n\n| Archetype | Existing examples | §3 framing | Signature demo | Default modules (in arc order) |\n|---|---|---|---|---|\n| **A. Conversation-to-record agent:** listens to a live conversation and fills a form or record | Auto PD, Life Insurance Proposal Automation, Video Tele-Medicine | 6–8 step flow (pre-fetch → converse → structure → verify → evidence → confirm → act), or BEFORE / DURING / AFTER phases | Split panel: Hinglish conversation with speaker labels on the left, form filling on the right, colour-coded *pre-filled*, *captured*, *flagged*. Table: Moment · What's said · What Darwix does | F2 Meaning over surface · F3 Discrepancy matrix · F6 Evidence triggers · F5 Live assist · F7 What it captures · F8 Source lineage · F18 Review-ready output · F23 Consent / confirmation · F19 Conversation to action · F21 Continuity · F25 Journeys / products · F26 Your template |\n| **B. Verification and assurance agent:** checks a person's understanding or identity against a record before an event | Video PIVC | Layers table (# · Layer · Promise · Proof points), with sequential How It Works at §5 | Customer says · Proposal records · Darwix flags. Optional second signature: an end-to-end story with numbered turns and an outcome | F22 Grounded Q&A and multilingual · F25 Product-aware cards · F28 Client guardrails · F32 Multimodal signals · F3 Cross-source verification · F17 Outcomes · F18 Evidence package · Human review card · F19 Agentic actions |\n| **C. Evidence and reconciliation platform:** compares many sources and explains differences | Evidence Intelligence, Retail Asset Evidence Intelligence, Document Discrepancy | 8-step flow (ingest → match → extract → reconcile → classify → score → clarify → pack), or Two Lenses | Case timeline or file view. Table: Field · What the evidence shows · Darwix finding, with a synthetic account ID. Include at least one harmless difference | F1 Classification · F4 Families / lenses · F9 Proof card · F8 Three values · F10 Missing and stale · F11 Materiality and confidence · F16 Clarification loop · F30 Pool view · F18 Packs · F27 Rules plus AI · F25 Journeys |\n| **D. Signal and alert layer:** detects events across channels and drives action | Alert Intelligence | Signal → Context → Decision → Action → Resolution, 7 steps | One sentence → alert → actions. Context block from the system of record, the quote, then Step · What happens | F2 Meaning, not keywords · F24 Real-time intervention · F12 Correlation and noise · F13 Commitments · F9 Alert anatomy · F11 Severity, owners, SLA · F19 Alert to resolution · F25 Journeys · F27 Rules plus AI · F26 Your definitions · F31 Analytics |\n| **E. Preparation and context layer:** assembles context before an interaction | Pre Meet Intelligence | 8-step flow (trigger → retrieve → rebuild history → detect change → set objective → build → refresh → hand off) | A brief card: sources on the left, the finished brief on the right. Table: Section · Content. \"Every line shows its source\" | F7 What's in the brief · F13 Institutional memory · F14 What changed · F15 Ask / Verify / Don't repeat / Don't say · F17 Objective and readiness · F25 Role-specific briefs · F8 Status and source tags · F23 Compliance prep · F20 Before → During → After · F29 Agentic prep |\n\n**Products outside these five** (for example a collections voice bot, a sales coaching layer, a quality-audit engine): pick the nearest archetype, keep its §3 and signature format if they fit, and build the module set from the product's own differentiators using the library.\n\n---\n\n## 5. Darwix Context (verify before relying on it)\n\nFacts referenced across the existing PRDs. Use them for consistency; flag anything new.\n\n- **Site and positioning:** darwix.ai, positioned as \"Built for BFSI\". Pages outside BFSI (e.g. healthcare) need an **Audience fit** open item.\n- **Products referenced:** Sherpa (live field assist; a wearable is implied), Voice / Voice Automation (the site's 22-language claim belongs to Voice only), Auto PD, Video PIVC, Video Tele-Medicine, Evidence Intelligence, Alert Intelligence, Pre Meet Intelligence, Life Insurance Proposal Automation, Retail Asset Evidence Intelligence. Products feed each other (PD and PIVC outputs into Evidence Intelligence; Evidence and Alert Intelligence into Pre Meet briefs; Pre Meet into Sherpa live assist). Any cross-product claim needs a **Link to other Darwix products** open item.\n- **Integrations on record:** the Non-Voice Agents page names LOS integrations with Finnone, Newgen and Lentra. Don't reuse for a new product without a confirm flag.\n- **Compliance page:** SOC 2 Type II and ISO 27001.\n- **Demo form:** \"Request a Personalized Demo\" (Full Name, Company, Business Email, Phone, Use Case) with three value bullets. Always reuse it.\n- **Deployment options:** on-prem, VPC or cloud.\n- **Languages:** Hindi, English and Hinglish with code-switching are the standard claim. Anything more needs a **Language coverage** open item.\n\n---\n\n## 6. Voice and Style\n\n### 6.1 Voice rules\n1. **Claim, then proof.** Every section opens with a claim (the Headline) and proves it with a concrete example, table or card. No section is all assertion.\n2. **Short.** Most sentences under 20 words. Fragments are allowed in strips, tiles and taglines.\n3. **Outcome-led.** Lead with what changes for the buyer, not with features.\n4. **Speak the buyer's language.** Lending: PD, LOS, LMS, FOIR, LTV, sanction, DPD. Collections: promise-to-pay, DPD band, settlement authority. Insurance: proposal, PIVC, PPT, rider, disclosure, underwriting, utmost good faith. ARCs: seller tape, cut-off, data room, bid window, \"as is, where is\", SOA. Health: RMP, EMR, teleconsultation, prescribing rules.\n5. **Darwix is the subject.** Name the product in full on first use in the Subhead (\"Darwix Alert Intelligence ...\"), then \"Darwix\" or the short name.\n6. **\"Your\" for the client's assets:** your PD template, your rules, your thresholds, your underwriting.\n7. **Negated guardrails build trust:** \"never silently overwrites\", \"won't invent an answer\", \"not a determination of fraud\".\n8. **Contrast pairs and verb chains** land sections: \"AI for understanding. Rules for control. Evidence for proof.\" / \"Detect. Prove. Clarify. Resolve. Preserve.\"\n9. **Aphorisms** for readiness and gates: \"*Form completed doesn't always mean proposal ready.*\" / \"*Meeting scheduled doesn't mean meeting ready.*\"\n10. **Calm register for sensitive domains** (health, vulnerability, claims): clinical-grade, never hype.\n\n### 6.2 Mechanics\n- No em dashes anywhere. Use colons, periods or commas. En dashes only for numeric ranges (₹4–5 lakh).\n- British/Indian spelling: prioritise, normalise, organisation, colour, behaviour, authorised.\n- No serial comma.\n- Inline lists use ` · `. Flows and results use ` → `.\n- H2 titles in Title Case. Headlines and copy in sentence case.\n- Bold labels end with a colon: `**Headline:**`.\n\n### 6.3 Banned words and patterns\nrevolutionary · game-changing · cutting-edge · seamless · seamlessly · leverage · empower · robust · best-in-class · world-class · next-generation · state-of-the-art · harness · supercharge · \"AI-powered\" as filler · \"in today's fast-paced world\" · rhetorical questions as headlines · exclamation marks · emoji · any unmeasured number.\n\n### 6.4 Before and after\n\n| Weak | Darwix voice |\n|---|---|\n| \"Our cutting-edge AI seamlessly transforms PD workflows.\" | \"The borrower speaks. The PD builds itself.\" |\n| \"Reduces underwriting queries by 40%.\" (unmeasured) | \"**Fewer underwriting queries:** gaps and contradictions resolved before submission\" |\n| \"Advanced discrepancy detection capabilities.\" | \"Catch the mismatch while the borrower is still in front of you.\" |\n| \"The system may identify potential issues.\" | \"Darwix flags it, keeps both values and routes it to review.\" |\n| \"Darwix decides which value is correct.\" | \"Darwix shows what the evidence supports. Your reviewer adopts the value.\" |\n\n### 6.5 Copy formulas\n**Hero headline (pick one)**\n1. Actor acts, outcome follows: \"The borrower speaks. The PD builds itself.\" / \"Advisors talk to customers. Darwix completes the proposal.\" / \"Let the doctor focus on the patient. Darwix runs the rest of the consultation.\"\n2. Triple imperative: \"Verify the customer. Verify the policy. Verify informed consent.\"\n3. Outcome in time: \"Know what needs attention while there's still time to act.\" / \"Walk into every customer meeting already knowing what matters.\"\n4. Tension, then resolution: \"Every source says something different. Darwix tells you what's true, and shows the proof.\" / \"Every loan file has documents that disagree. Find them before you bid.\"\n5. Single imperative: \"Verify the asset behind the seller tape.\"\n\n**Problem section title:** \"The Problem: [reframing]\" · \"The Best Hour in Credit Is Spent on Data Entry\" · \"Video Solved the Connection. Not the Consultation.\" · \"You Don't Have an Alert Problem. You Have an Attention Problem.\" · \"The Meeting Is Often Decided Before It Starts\".\n\n**Problem closing line:** \"Let the [human] [do the human part]. Let AI [do the mechanical part].\" / \"From [current state] to [future state].\" / \"Never start a [X] from a blank screen.\"\n\n**Signature closing line:** \"The [user] had one [conversation]. Darwix produced the [A], the [B] and the [C].\" / \"The [product] didn't just [commodity verb]. It [real outcome].\"\n\n**Capability headline:** \"Catch the [problem] while [person] is still [present].\" · \"Don't [old way]. [New way].\" · \"Know [X] before [Y].\" · \"[Thing] isn't [commodity thing].\"\n\n**Control headline:** \"AI [prepares X]. The [owner] [decides Y].\"\n\n**Impact headline:** \"Less time [drudgery]. More time [judgment].\" / \"Fewer [noise]. More [signal].\" / \"Faster [X]. Better [Y]. Fewer [Z].\"\n\n**Why Darwix supporting line:** \"Not [commodity]. [Category claim].\" / a six-verb chain of the workflow.\n\n**Closing CTA headline:** \"Turn every [unit] into [outcome].\" / \"Make every [unit] [outcome].\"\n\n---\n\n## 7. Building the Signature Demo (§4)\n\nThe signature demo is a scripted walkthrough of one synthetic case that proves the page goal. Build it like this.\n\n1. **Pick a realistic case** in the product's core journey, with a specific product, amount and person: a ₹42 lakh self-employed home loan, a ₹1 crore term plan, a DPD-47 collections account, HL-241872 under ARC diligence, a returning hypertension patient.\n2. **Write the context block:** what is already known before the interaction, from named systems. `**Pre-filled from CRM/KYC:** Existing customer · term plan · sum assured ₹1 crore · CRM income ₹18 lakh · occupation: self-employed`.\n3. **Write 5–8 rows.** Each row shows one capability in action. Across the rows, cover: a plain capture or confirmation, two or three flagged mismatches, a nudge or follow-up question, an evidence request, and an action or handoff. For evidence products, include at least one difference that turns out harmless (a name variant, a timing difference).\n4. **Speech:** frontline customers speak natural romanised Hinglish, short and unpolished: \"Car ka EMI bhi hai, around eighteen-five.\" / \"Regularly nahi. Month mein maybe 2–3 cigarettes.\" Enterprise users speak English.\n5. **Flags:** name each finding in **Bold Title Case** with a type or severity: **Undeclared Obligation** · **Income Disclosure Mismatch** · **Property Description Mismatch. High.**\n6. **Then:** one or two sentences on what happens next: the customer confirms, the seller sends the document and only the affected finding re-runs, the case routes to review.\n7. **Closing line:** using a formula from 6.5.\n8. **Reuse:** carry the case's IDs, names and numbers into later sections' examples.\n\n**Column patterns**\n| Archetype | Columns |\n|---|---|\n| A. Conversation-to-record | Moment · What's said · What Darwix does |\n| B. Verification | Customer says · Proposal records · Darwix flags |\n| C. Evidence | Field · What the evidence shows · Darwix finding (or # · What the documents say · Darwix finding) |\n| D. Alert | Step · What happens |\n| E. Preparation | Section · Content |\n\n---\n\n## 8. Document Conventions\n\n- **Title:** `# PRD: Darwix AI [Product Name] Page`\n- **Sections:** H2 only, numbered: `## N. Section Title`. No H3; sub-blocks use bold labels.\n- **Rules:** `---` after the header block, between every section, and before Open Items.\n- **Count:** 17–21 numbered sections plus the unnumbered `## Open Items to Confirm Before Publishing`. Roughly 3,000–4,000 words.\n- **Currency and dates:** ₹18,500 · ₹24.80L / ₹24.8 lakh · ₹8.2 crore · 14 Aug · 18 Sep, 07:14 · timestamps 09:42.\n- **IDs:** HL-241872 · FIN-DUE-0048 · PD and proposal IDs in the same style.\n- **Italics:** examples, scenarios, the page-goal belief, aphorisms, status lists.\n- **Inline flags:** `(state on page)` · `(Legal to review)` · `*(Confirm ... before publishing.)*` · `*(Synthetic data.)*`\n- **Cross-references:** \"(scrolls to §4)\", \"the §4 demo\".\n\n### 8.1 Content elements\n| Element | Format | Rule |\n|---|---|---|\n| Eyebrow | `**Eyebrow:** CATEGORY · BUILT FOR AUDIENCE` | ALL CAPS |\n| Headline | `**Headline:** ...` | One claim, 6–14 words |\n| Subhead | `**Subhead:** Darwix [Product] ...` | 1–2 sentences, workflow order |\n| Capability line | `**Capability line:** A · B · C` | 6–9 Title Case capabilities, workflow order |\n| Proof strip | `**Proof strip:** A · B · C · D` | Exactly 4 short proofs |\n| CTA pair | `**CTAs:** Primary: **...**. Secondary: **...** (scrolls to §4).` | Demo request + jump to demo |\n| Copy | `**Copy:** ...` | 50–130 words |\n| Pain strip | `**Three-line pain strip:**` + 3 bullets | `**Label:** one line` |\n| Closing / Supporting line | `**Closing line:**` / `**Supporting line:**` | One sentence |\n| Flow steps | `1. **Label:** one line` | 5–8 steps, \"as a horizontal flow, one line each:\" |\n| Flow line | `**Flow line:** A → B → C` | 3–6 nodes |\n| Table | Markdown | 2–4 columns, 4–8 rows |\n| Record card | Two-column table, empty header `\\| \\| \\|` or a first row naming the record | 5–8 rows |\n| Blocks | `**a) Title:** text` | 2–4 blocks, \"Two blocks:\" / \"Three blocks:\" |\n| Cards | `- **Name:** one line. *Example.*` | 4–8, \"N compact cards, one line each:\" |\n| Status list | *State · State · State* | 5–9 states |\n| Value tiles | `- **Headline:** one line` | 6–8, no numbers |\n| Pillars | `**Pillar** (gloss) · ...` | 8, last one is the control pillar |\n| Governance tiles | `- **Label:** one line` | 5–8 |\n| Badges | Fixed line | `**Badges:** SOC 2 Type II · ISO 27001 (as on the Compliance page) · link to Compliance` |\n| FAQ | `N. **Question?** Answer.` | 8–15 items |\n| Form line | Fixed line | `**Form:** Reuse the site's standard \"Request a Personalized Demo\" form and value bullets.` |\n\n---\n\n## 9. PRD Structure\n\n### 9.1 Header block\n```markdown\n# PRD: Darwix AI [Product Name] Page\n\n**Scope:** Content of the [Product Name] page only. Navigation, entry points, layout and visual design are out of scope.\n**Version note:** [Variant mode only.]\n**Audience:** [Primary titles] at [institution types]. [Secondary reader] are the secondary reader.\n**What the product is:** [A [category] [layer / agent / platform] for [domain].] [Workflow in order, 1–2 sentences.]\n**Page goal:** Make the reader believe one thing: *[one belief]*\n**Positioning guardrails (state them on the page):**\n- Not [commodity A], [commodity B] or [commodity C]. [What it is instead.]\n- [Decision boundary.]\n**Voice:** Match darwix.ai: confident, short, outcome-led[, domain nuance]. Every section leads with a claim, then proof.\n\n---\n```\n\n### 9.2 Section order\n| Position | Section | Required |\n|---|---|---|\n| 1 | Hero | Yes |\n| 2 | The Problem | Yes |\n| 3 | How It Works, or a framing section (Layers / Phases / Lenses) | Yes |\n| 4 | Signature Section | Yes |\n| 5 to n−6 | Capability modules (8–12), from Section 10 | Yes |\n| (inside the run) | Second signature (pool view or end-to-end story) | Optional |\n| n−5 | Control section | Yes |\n| n−4 | Configuration, Integrations, Security & Governance (one or two sections) | Yes |\n| (optional) | Analytics | Optional |\n| n−3 | Business Impact | Yes |\n| n−2 | Why Darwix (may merge with Business Impact) | Yes |\n| n−1 | FAQ | Yes |\n| n | Closing CTA Block | Yes |\n| Unnumbered | Open Items to Confirm Before Publishing | Yes |\n\n**Narrative arc for capability modules.** Skip stages that don't apply; never reorder.\n1. Core differentiator (what the commodity can't do)\n2. Depth (what it understands, captures or compares)\n3. Real-time and assist\n4. Trust (proof, lineage, values never overwritten)\n5. Gaps (missing, stale, newly discovered)\n6. Prioritisation (materiality, severity, confidence, routing)\n7. Resolution (clarification, review)\n8. Outputs (states, readiness, packs)\n9. Action and continuity (workflow, handoffs, resume)\n10. Breadth (journeys, products, roles)\n11. Control mechanics (configurability, rules plus AI, guardrails), directly before the Control section\n\n### 9.3 Fixed section specifications\n\n**§1 Hero** (`## 1. Hero`)\nEyebrow · Headline · Subhead · Capability line · Proof strip · CTAs.\n- Eyebrow examples: AI PERSONAL DISCUSSION · BUILT FOR LENDING / AI VIDEO PIVC · BUILT FOR INSURANCE / CROSS-SOURCE EVIDENCE INTELLIGENCE · BUILT FOR BFSI.\n- Proof strip mix: one \"how it's different\" claim, one traceability claim, one integrity claim, one control claim. Example: \"Fills out of sequence, as the conversation flows · Every field carries its source · Original application values never silently overwritten · Lender keeps every credit decision\".\n- CTAs: Primary **Request a [Short Name] Demo**. Secondary **See / Watch [the signature moment]** (scrolls to §4).\n\n**§2 The Problem** (`## 2. The Problem: [Reframing Title]`)\nHeadline · Copy · Three-line pain strip · Regulatory context line (optional, `(Legal to review)`) · Closing line.\n- Copy: a chain of 3–6 concrete failures with specifics (quotes, numbers, systems), then the consequence and when it surfaces.\n- Pain strip patterns: *Before / During / After* (workflow products) or *Too many / Too little time / Too little proof* and *Too late / Too noisy / No follow-through* (volume products).\n\n**§3 How It Works or Framing**\n- Sequential (default): \"## 3. How [Product] Works\" · Headline \"From [input] to [output].\" · \"[N] steps as a horizontal flow, one line each:\" · 6–8 steps with bold labels. First step names inputs and systems; last names output and destination.\n- Layers: \"One [Unit]. [N] Layers of Assurance.\" · Table `# · Layer · Promise · Proof points`. Put sequential How It Works at §5.\n- Phases: \"One [Unit]. Three Phases. Zero Blind Spots.\" · **BEFORE / DURING / AFTER** columns, each a short title and three bullets.\n- Lenses: \"Two Lenses. One [Case].\" · two or three bold blocks, each a question, plus \"what should exist but doesn't\" where relevant.\n\n**§4 Signature Section** (`## 4. Signature Section: [Title]`)\nHeadline · Format (visual, \"Script below.\", `*(Synthetic data.)*`) · Context block · Demo table · Then · Closing line. See Section 7.\n\n**Control section**\n- Title: \"[Darwix verb] the X. [Owner] Decides Y.\" / \"[Role] Control: What AI Does and What It Never Does\" / \"Detect Early. Decide Responsibly.\" / \"Prepare the Professional. Don't Replace Them.\" / \"Your [X]. Your Rules. Your [Decision].\"\n- Headline: \"AI [prepares X]. The [owner] [makes the decision].\"\n- Table `| Darwix does | The [owner] controls |`: 6–8 rows; right column lists the domain's accountable decisions; blank cells allowed.\n- Boundary lines (state on page), 1–3 bullets: \"An [alert] isn't a finding of [fraud].\" / \"[Opportunities] only from explicit need or approved logic.\" / \"[Analytics] show [process] quality, not a score of [people].\" / \"Not a replacement for [emergency services / the approved KYC process].\"\n\n**Configuration, Integrations, Security & Governance**\n`**Configurable:**` (8–14 items) · optional `**Example:**` · `**Connects to:**` · `**Reads:**` / `**Returns:**` (or `**Writes:**`) · optional `**Events:**` · `**Governance tiles:**` (5–8) · optional `**Full audit trail:**` · `**Badges:**` · optional one line on what happens afterwards (\"**After the bid (one line):** ...\").\nGovernance tile pool: Deployment and residency (on-prem, VPC or cloud) · Encryption / data protection · Role-based access · Need-based or purpose-limited access · PII / sensitive-data protection (masking, redaction) · Consent and traceability · Source integrity · Full audit trail · Controlled write-back · Rule and model governance · Recording controls · Reproducible after the event.\n\n**Business Impact** (`## N. Business Impact`)\nHeadline (contrast) · \"Value tiles (bold headline, one line each):\" 6–8 tiles · `**Operational visibility (one line):**` metrics the product reports, with \"not a score of [people / clinical quality]\" where needed · optional Closing line.\n\n**Why Darwix** (`## N. Why Darwix` or `## N. Why Darwix for [Product]`)\n\"Eight pillars, one line each:\" then bold pillars separated by ` · `, optional parenthetical glosses, last pillar = control · Supporting line.\n\n**FAQ** (`## N. FAQ`), 8–15 items\n1. What is Darwix [Product]? 2. Is it just [commodity]? Then one per major capability · contradictions and new evidence · Does it make the [decision]? (\"No.\") · actions and write-back · languages (confirm flag) · integrations · data, recording, deployment. Answers 1–3 sentences, starting \"Yes.\" or \"No.\" where possible.\n\n**Closing CTA Block** (`## N. Closing CTA Block`)\n`**Headline:**` \"Turn / Make every [unit] [outcome].\" · `**Copy:**` verb chain · `**CTA:** **See [Product] in Action**` · Form line.\n\n---\n\n## 10. Capability Module Library\n\nEvery module: Headline (claim) → proof (table, card, blocks, example) → usually a Supporting line. Titles below are proven examples; write new ones in the same style for new products.\n\n| ID | Module | Use when | Title examples | Pattern |\n|---|---|---|---|---|\n| F1 | Classification taxonomy | Comparisons must avoid false alarms | \"Not Every Difference Is a Conflict\" · \"A Different Number Isn't Always a Discrepancy\" | Table `Class · Meaning · Example` with Agrees · Variant/Typographical · Contextual · Conflict · Stale/Newer · Subsequent Event · Enriched · Missing/Quality. Optional \"Same look, different meaning\" pair |\n| F2 | Meaning over surface | The commodity reads words or boxes | \"Meaning, Not Keywords\" · \"A Disclosure Isn't a Yes/No Box\" | Table `Customer says · A checkbox records · Darwix records` or `Category · Example`; adaptive follow-up rules; structured output example |\n| F3 | Discrepancy matrix | Statements or documents compared against a record | \"Discrepancy Intelligence\" · \"Catch the Contradiction Before It Becomes an Underwriting Query\" | Table `[Source A] says · [Source B] says · Darwix flags` (6–8 rows, bold flags); \"Nothing is silently overwritten\" line |\n| F4 | Families or lenses | Comparisons group into families | \"Seven Families of Document Discrepancy\" · \"Eight Diligence Lenses on Every Account\" | Table `Family · What Darwix compares · Example` or cards with one italic example finding each; boundary line |\n| F5 | Live assist and nudges | A human is mid-interaction | \"Officer Assist: Nudges, Not Scripts\" · \"Advisor Assist and Live Completeness\" | 5–7 quoted nudges tagged by type; field state Status list; readiness gate + aphorism |\n| F6 | Evidence triggered by conversation | Statements need proof | \"Evidence, Triggered by the Conversation\" · \"Documents That Prove the Fields\" | Table `[Person] says · Darwix prompts`; \"Evidence is stored with:\" list |\n| F7 | Coverage | Breadth captured or produced matters | \"What Auto PD Captures\" · \"What's in a Brief\" | 6–12 cards or Table `Block · What it tells the user` |\n| F8 | Source lineage / three values | Values change hands or get corrected | \"Every Field Knows Where It Came From\" · \"Three Values. Nothing Overwritten.\" | Table `Value state · Meaning` or lineage record card; numeric Example; source types or source tags |\n| F9 | Show me the proof | Findings must be verifiable | \"Every Finding Answers: 'Show Me the Proof.'\" · \"Every Alert Explains Itself and Shows Its Proof\" | Record card with page/row/timestamp anchors, classification, confidence, status; \"Evidence can point to:\"; \"Confidence, explained:\" |\n| F10 | Missing, stale, newly discovered | Gaps matter | \"What's Missing Matters as Much as What's There\" | Three blocks or cards; document Status list (*Available · Missing · Partial · Unreadable · Wrong account · Duplicate · Old version · Missing page*); before/after example |\n| F11 | Materiality, severity, confidence, routing | Volume forces prioritisation | \"Review by Materiality, Not Document Count\" · \"Severity That Moves, Owners That Exist, Escalation That Follows Consequence\" | \"Materiality considers:\" list; small-number vs critical-gap example; dynamic severity, ownership, SLA blocks |\n| F12 | Correlation and noise control | Many signals, one issue | \"One Issue. One Alert.\" | Two before/after consolidation examples; \"How noise is cut:\"; cross-channel line |\n| F13 | Commitments and memory | Promises made in conversations | \"Promises That Don't Disappear When the Call Ends\" · \"Institutional Memory: Both Sides' Promises, Checked Against Reality\" | Timeline `When · What happens`; customer and organisation commitments; \"Shown for each:\" |\n| F14 | What changed | Users return to ongoing cases | \"Show What Changed. Don't Make Them Reread What Didn't.\" | \"Detected changes:\" list; recency-weighted; stays current |\n| F15 | Conversation plan | Product prepares what to say | \"Ask This. Verify That. Don't Repeat That. Don't Say That.\" | Four blocks: Ask (by journey) · Verify · Don't repeat · Don't say |\n| F16 | Clarification loop | Findings need another party's answer | \"Clarify, Resolve, Preserve\" · \"Ask the Seller the Exact Question the Evidence Creates\" | Query record card; \"Response handling:\"; \"What you can see:\"; reviewer resolution options |\n| F17 | States, outcomes, readiness | Cases end in a status | \"Outcomes: No Unexplained Pass or Fail\" · \"Every Meeting Gets an Objective, Priorities and a Readiness Check\" | Table `Outcome · Meaning` (5–7) or Status list; aphorism |\n| F18 | Review-ready output / packs | A reviewer or committee receives a package | \"A Review-Ready Output\" · \"The Evidence Package\" · \"Human Review: Send the Exception, Not the Whole Video\" | Three blocks; sample summary as a blockquote; principle that the summary never recommends the decision |\n| F19 | Conversation to action | Findings trigger work | \"From Conversation to Action\" · \"From Alert to Action to Resolution\" · \"Agentic Actions After the Call\" | Flow line; Table `When · What Darwix can trigger` or `Case type · Automatic actions`; lifecycle Status list; closed-loop line |\n| F20 | Before → During → After / handoffs | Connects to phases or other Darwix products | \"Before → During → After\" · \"One Proposal, Every Next Step\" | Three columns or a handoff list; cross-channel example |\n| F21 | Continuity | Journeys pause and resume | \"Pause, Resume, Continue Across Channels\" | What's preserved; why it stopped; \"When the customer returns:\"; status clarity list |\n| F22 | Grounded answers and multilingual | Customers ask questions; multiple languages | \"Grounded Answers, Multilingual by Design\" · \"Conversation That Understands, Not a Recorded Questionnaire\" | Two or three blocks: grounded Q&A (no invented answers, route to human), languages and code-switching |\n| F23 | Consent, confirmation, regulatory controls | Consent or regulation shapes the flow | \"The Customer Confirms What Goes In Their Name\" · \"Consent and Practice-Guideline Aware\" | \"Built-in controls:\" or \"What's recorded:\"; Legal review flag |\n| F24 | Real-time intervention | Value depends on acting before the interaction ends | \"Alert While the Interaction Is Still Recoverable\" | Four bold examples: situation → *who is prompted* |\n| F25 | Segment cards | Several journeys, products, roles or specialties | \"Built for Every Lending Journey\" · \"Product-Aware Verification\" · \"Same Customer. Different Role. Different Brief.\" | 4–7 cards with focus + example, or Table `Role · Focus · Example`; optional depth tiers |\n| F26 | Your template, not ours | Client's form or taxonomy drives behaviour | \"Your PD Template, Not Ours\" · \"Your Alerts, Your Definitions\" | What's configurable; conditional-logic Example |\n| F27 | Rules plus AI | Deterministic and AI logic both matter | \"AI for Meaning. Rules for Control.\" · \"Rules Where Rules Belong. AI Where Understanding Is Needed.\" | Table `Deterministic rules handle · AI handles` or a worked date/arithmetic example; motto |\n| F28 | Client-controlled guardrails | Buyers fear unrestricted AI | \"Insurer-Controlled Guardrails\" | Control list; \"Deterministic where control is required. Intelligent where the conversation needs it.\" |\n| F29 | Agentic preparation | Product does legwork before the human | \"Preparation Work Done Before They Ask\" | \"Where authorised, Darwix can automatically:\" list |\n| F30 | Pool or portfolio view | Works at portfolio scale | \"From 5,000 Accounts to the Ones That Deserve an Expert\" | Table `Segment · What it means`; italic drill-down chain; pool view list; deterministic quantification + boundary |\n| F31 | Analytics | Recurring patterns are valuable | \"See Where the Business Keeps Needing Intervention\" | Metrics list; Supporting line |\n| F32 | Multimodal signals | Video or audio signals matter | \"Video & Voice Intelligence\" | Video signals; voice signals; interpreted by client rules only |\n\n---\n\n## 11. Open Items Catalog\n\n`## Open Items to Confirm Before Publishing`, bullets in the form `- **Label:** what to confirm, and what to do if unconfirmed.` Always be specific.\n\n| Label | Include | Template |\n|---|---|---|\n| **Metrics** | Always | \"No quantified claims ([the natural metrics for this product]) are included. Add only measured pilot or production data.\" |\n| **Feature readiness** | Always | \"Confirm which items are live versus roadmap: [named capabilities, especially every Inferred one].\" |\n| **Customer proof and demo** (or separate **Customer proof** and **Demo asset**) | Always | \"Add a named [client type] logo or quote only if approved. The §4 demo needs [a recorded session / a synthetic or anonymised data room], never real [customer / patient] data.\" |\n| **Link to other Darwix products** | Page names other Darwix products | \"The page assumes [products] feed or receive this layer. Confirm which integrations exist today.\" |\n| **Language coverage** | Language claims beyond Hindi, English, Hinglish, or any list | \"Confirm supported languages beyond Hindi, English and Hinglish.\" |\n| **Integrations** | Named systems | \"Confirm which [LOS / policy admin / EMR] systems are supported for read and write-back today.\" |\n| **Regulatory / legal / clinical wording** | Regulator, law, guideline or legal concept referenced | \"Have [Legal / Compliance / clinical advisers] review [the §N context line and wording on X], so nothing implies [legal advice / a regulatory classification / a guaranteed outcome].\" |\n| **Positioning vs [alternative]** | A competing category exists | \"Confirm the page leans on what's distinct: [differentiators].\" |\n| **Audience fit** | Audience outside BFSI positioning | \"Confirm whether homepage and navigation messaging needs to broaden.\" |\n| **Capture / delivery / channel surface** | Device or channel undecided | \"Confirm where the user [captures / receives] [X] ([options]).\" |\n| **Data consent and access** | New use of conversation or sensitive data | \"Confirm what [data] can lawfully feed [X] and which role-based rules apply.\" |\n| **Market claim** | Industry trend cited | \"Verify against a current, citable source before launch.\" |\n| **One page or two** / **Relationship to [page]** | Overlap with another PRD | \"This PRD and [other] describe [overlap]. Publish one, or split messaging so the pages don't repeat the same story.\" |\n| **Source assumptions** | Anything inferred about audience, scope or behaviour because the source was silent | \"The source didn't specify [X]. The PRD assumes [Y]. Confirm.\" |\n\n---\n\n## 12. Quality Checklist\n\nFix every miss before delivering.\n\n**Structure**\n- [ ] Title `# PRD: Darwix AI [Product Name] Page`; header block complete (Scope, Audience, What the product is, Page goal, two guardrails, Voice).\n- [ ] 17–21 numbered H2 sections in the order of 9.2; `---` between all sections; unnumbered Open Items at the end.\n- [ ] §1 Hero has all six elements; Capability line 6–9 items; Proof strip exactly 4; secondary CTA scrolls to §4.\n- [ ] §2 has a reframing title, copy, a three-line pain strip and a closing line.\n- [ ] §4 has Format with `*(Synthetic data.)*`, a context block, 5–8 rows, at least two bold flags, Then and a closing line.\n- [ ] 8–12 capability modules, ordered by the arc, no two making the same point.\n- [ ] Control table present with boundary lines marked (state on page).\n- [ ] Badges line exact; Form line exact; CTA \"See [Product] in Action\".\n- [ ] FAQ has 8–15 items, opens with \"What is...\" and \"Is it just...\", includes the decision-boundary question.\n\n**Content**\n- [ ] Every section opens with a claim and proves it with a concrete example, table or card.\n- [ ] Every major capability in the fact sheet appears somewhere; nothing contradicts the source.\n- [ ] Later examples reuse the §4 case where natural.\n- [ ] Buyer's domain vocabulary used correctly.\n\n**Truthfulness**\n- [ ] Zero unmeasured numbers in claims; tiles qualitative.\n- [ ] No invented customers, certifications or confirmed integrations.\n- [ ] Every Inferred capability listed under Feature readiness.\n- [ ] Regulatory references flagged `(Legal to review)` and listed in Open Items.\n- [ ] Decision boundary stated in header, Control section and FAQ.\n\n**Voice and mechanics**\n- [ ] No em dashes. En dashes only in numeric ranges.\n- [ ] No banned words (6.3). No exclamation marks or emoji.\n- [ ] British/Indian spelling; no serial comma; ` · ` and ` → ` used consistently.\n- [ ] Hinglish quotes sound like real speech; Indian currency and date formats throughout.\n\n---\n\n## 13. Common Mistakes\n\n- **Feature list instead of argument.** Every section must advance the page goal, not just describe a feature.\n- **A generic signature demo.** \"The AI analyses the conversation and finds issues\" proves nothing. Use specific people, numbers, quotes and named flags.\n- **Promising outcomes.** \"Prevents fraud\", \"eliminates mis-selling\", \"guarantees compliance\" are determinations. Write \"surfaces indicators\", \"flags for review\", \"captures configured disclosures\".\n- **Collapsing the boundary.** Never imply Darwix sanctions, underwrites, diagnoses, prices or decides legal sufficiency.\n- **Overloading the hero.** One headline, one subhead, the lists. Save detail for the sections.\n- **Repeating the same proof.** If two sections use the same table shape and point, merge them.\n- **Dropping Open Items.** A PRD without specific, honest open items is not ready for review.\n- **Ignoring the source.** When the source contradicts a pattern in this skill, the source wins on facts; the skill wins on structure and voice.\n\n---\n\n## 14. Worked Planning Example\n\nSource (summarised): \"Darwix Collections Voice Agent: outbound AI calls for early-bucket collections (DPD 1–30) at NBFCs. Calls in Hindi and Hinglish, reminds customers, captures promise-to-pay, sends payment links, escalates disputes and hardship to human agents, writes outcomes to the collections system.\"\n\nPlan:\n- **Archetype:** A (conversation-to-record) with D (alert) modules for commitments.\n- **Page goal:** *Reminder bots read a script. Darwix holds a real collections conversation, captures what the customer commits to and follows through until it's paid or escalated.*\n- **Guardrails:** Not an IVR, a robocaller or a scripted reminder bot. / Darwix captures commitments and routes exceptions. Settlement terms, waivers and recovery actions stay with authorised collectors.\n- **Hero headline:** \"Every early-bucket customer gets a real conversation. Every promise gets followed up.\"\n- **§3:** 7 steps: load account → call → understand → capture commitment → act (payment link) → escalate → write back.\n- **§4:** DPD-12 two-wheeler loan, ₹4,850 EMI. Rows: identity confirmation · \"Salary 5 tareekh ko aayegi, tab pay kar dunga\" → **Promise-to-Pay: ₹4,850, 5 Oct** · payment link sent · \"Pichle mahine ka charge galat laga hai\" → **Charge Dispute** routed to owner · hardship statement → **Hardship Indicator (explicit statement)** escalated to a human · outcome written to the collections system.\n- **Modules:** F2 Meaning, not scripts · F13 Promises followed up · F24 Real-time escalation · F22 Grounded answers and Hinglish · F17 Call outcomes · F19 Call to action · F12 One customer, one state across channels · F25 Bucket- and product-specific flows · F28 Lender-controlled guardrails (calling hours, consent, authorised language) · F31 Analytics.\n- **Open items:** Metrics · Feature readiness (dispute routing, hardship escalation, write-back) · Language coverage (relate to Voice's 22-language claim) · Regulatory wording on calling hours and fair-practice conduct (Legal to review) · Integrations (collections platform) · Customer proof and demo.\n"},{"id":"s-struct","name":"PRD_Structure.md","text":"# Darwix AI Product Page PRD: Standard Structure\n\n**Version:** 1.0\n**Derived from:** Nine Darwix product page PRDs: Auto PD, Video PIVC, Video Tele-Medicine, Evidence Intelligence, Alert Intelligence, Pre Meet Intelligence, Life Insurance Proposal Automation, Retail Asset Evidence Intelligence, and Retail Asset Evidence Intelligence (Document Discrepancy variant).\n**What this defines:** The fixed shape every Darwix product page PRD follows: document conventions, content elements, the header block, the section order, the specification of every fixed section, the library of capability sections, and a fill-in skeleton.\n\n---\n\n## Part A. Document Conventions\n\n### A1. File and format\n- **File name:** `Darwix_<Product_Name>_Page_PRD.md` (Title Case words joined by underscores). Example: `Darwix_Alert_Intelligence_Page_PRD.md`.\n- **Format:** Markdown. One H1 title. Every page section is an H2 in the form `## N. Section Title`. No H3s: sub-blocks use bold labels.\n- **Separators:** a horizontal rule `---` after the header block, between every numbered section, and before the Open Items section.\n- **Length:** 17 to 21 numbered sections, followed by one unnumbered section, `## Open Items to Confirm Before Publishing`. Roughly 3,000 to 4,000 words.\n\n### A2. Typography rules\n| Rule | Convention |\n|---|---|\n| H2 titles | Title Case. Either a label (\"Business Impact\") or a statement (\"One Issue. One Alert.\") |\n| Headlines, copy, supporting lines | Sentence case |\n| Element labels | Bold, followed by a colon: `**Headline:**` |\n| Inline lists | Middle dot with spaces: `A · B · C` |\n| Flows, results, transformations | Arrow with spaces: `A → B` |\n| Numeric ranges | En dash: `₹4–5 lakh`, `145–150` |\n| Dashes in prose | No em dashes. Use colons, periods or commas |\n| Spelling | British/Indian English: prioritise, normalise, organisation, colour, behaviour |\n| Serial comma | Not used: \"layout and visual design\", not \"layout, and visual design\" |\n| Italics | Illustrative examples, scenario lines, aphorisms, the page-goal belief, status lists |\n| Bold inside tables | Finding names, flag names and severity words |\n| Cross-references | `§4`, e.g. \"(scrolls to §4)\" |\n\n### A3. Data conventions\n- **Currency:** ₹ with Indian units: `₹18,500`, `₹24.80L` or `₹24.8 lakh`, `₹8.2 crore`.\n- **Dates and times:** `14 Aug`, `18 Sep, 07:14`. Recording timestamps as `09:42`.\n- **IDs:** realistic synthetic identifiers: `HL-241872`, `FIN-DUE-0048`.\n- **People:** Indian names, abbreviated where natural: \"Rohan M.\", \"Rakesh Kumar Sharma\".\n- **Speech:** frontline customer speech in natural romanised Hinglish (Devanagari is allowed sparingly). Enterprise-user speech in English.\n- **Synthetic marker:** every demo's Format line ends with `*(Synthetic data.)*`. Illustrative pool figures are labelled \"(illustrative)\".\n- **No performance metrics:** no accuracy, speed, savings or volume claims unless supplied as measured data.\n\n### A4. Inline flags\n| Flag | Meaning |\n|---|---|\n| `(state on page)` / `(state them on the page)` | This line must appear on the publi
